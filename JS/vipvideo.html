<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101828">
  <title>VIP 视频解析 - PHDSX</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #fff;
      --ink: #101828;
      --muted: #667085;
      --line: #dfe6ee;
      --brand: #1769e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    main { width: min(calc(100% - 36px), 880px); margin: 0 auto; padding: clamp(42px, 7vw, 76px) 0; }
    .intro { margin-bottom: 24px; }
    .eyebrow { color: var(--brand); font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 12px 0 10px; font-size: clamp(32px, 6vw, 52px); line-height: 1.1; }
    .intro p { max-width: 650px; margin: 0; color: var(--muted); line-height: 1.75; }
    .tool-panel { padding: clamp(20px, 5vw, 34px); border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: 0 16px 40px rgba(16,24,40,.08); }
    label { display: block; margin-bottom: 9px; font-weight: 750; }
    .input-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; }
    input { width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid #cbd5e1; border-radius: 7px; outline: none; font: inherit; }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(23,105,224,.11); }
    button { min-height: 48px; padding: 0 20px; border: 1px solid var(--brand); border-radius: 7px; background: var(--brand); color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    button:hover { background: #0f4fae; }
    .status { min-height: 24px; margin: 10px 0 0; color: #b42318; font-size: 14px; }
    .support { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; margin-top: 24px; }
    .support span { padding: 13px; border: 1px solid var(--line); border-radius: 7px; background: #f8fafc; text-align: center; color: var(--muted); font-weight: 700; }
    .notice { margin: 20px 0 0; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; line-height: 1.65; }
    @media (max-width: 560px) {
      .input-row { grid-template-columns: 1fr; }
      .support { grid-template-columns: 1fr; }
    }
  </style>
<link rel="stylesheet" href="../assets/standalone.css?v=20260824a">
<script defer src="../assets/standalone.js?v=20260829b" data-home="../index.html" data-return="../tools.html" data-return-label="Tools"></script>
</head>
<body>
  <main>
    <section class="intro">
      <span class="eyebrow">VIDEO TOOL</span>
      <h1>VIP 视频解析</h1>
      <p>粘贴完整视频页面地址后打开第三方解析服务。支持腾讯视频、爱奇艺和优酷等常见平台。</p>
    </section>
    <section class="tool-panel">
      <label for="video-url">视频页面地址</label>
      <div class="input-row">
        <input id="video-url" type="url" inputmode="url" placeholder="https://..." autocomplete="off">
        <button type="button" id="parse-button">打开解析</button>
      </div>
      <p class="status" id="status" role="status"></p>
      <div class="support" aria-label="支持的平台">
        <span>腾讯视频</span>
        <span>爱奇艺</span>
        <span>优酷</span>
      </div>
      <p class="notice">本工具仅供学习与技术测试，请遵守视频平台服务条款和当地法律法规。</p>
    </section>
  </main>
  <script>
    (function () {
      const input = document.getElementById('video-url');
      const button = document.getElementById('parse-button');
      const status = document.getElementById('status');

      function openParser() {
        const value = input.value.trim();
        if (!/^https?:\/\/\S+$/i.test(value)) {
          status.textContent = '请输入以 http:// 或 https:// 开头的完整视频地址。';
          input.focus();
          return;
        }
        status.textContent = '';
        window.open('https://jx.598110.com/?url=' + encodeURIComponent(value), '_blank', 'noopener,noreferrer');
      }

      button.addEventListener('click', openParser);
      input.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') openParser();
      });
    }());
  </script>
</body>
</html>
