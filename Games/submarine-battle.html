            flex-direction: column;
            justify-content: space-between;

        .top-bar {

            color: white;

            font-size: 18px;

            align-items: center;
        }

        .stat-value { font-size: 20px; }
        
        .ammo-container {
            position: absolute;
            bottom: 20px;

            transform: translateX(-50%);
            display: flex;
            gap: 5px;
        }
        .ammo-shell {

            background: #ffd700;

            box-shadow: 0 0 5px rgba(255, 215, 0, 0.5);

        .ammo-shell.empty {
            background: #333;

            box-shadow: none;

        .reloading-bar {

            color: white;
            pointer-events: auto;
            z-index: 10;
            backdrop-filter: blur(5px);

        h1 { font-size: 60px; margin: 0 0 20px 0; color: #00bfff; text-shadow: 0 0 20px #00bfff; }
        h2 { font-size: 40px; color: #ffd700; margin-bottom: 30px; }
        p { font-size: 24px; color: #ccc; max-width: 600px; text-align: center; line-height: 1.5; }
        .btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 24px;
            background: linear-gradient(to bottom, #007bff, #0056b3);
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }
        .pause-btn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .pause-btn:hover { background: rgba(255, 255, 255, 0.4); }
        .hidden { display: none !important; }
        .level-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 900;
            pointer-events: none;
            animation: pulse 2s infinite;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .stat-row { text-align: center; }
        .stat-row span { display: block; font-size: 28px; color: #fff; font-weight: bold; }
        .stat-row label { font-size: 14px; color: #aaa; }

        @keyframes pulse { 0% { opacity: 0.1; } 50% { opacity: 0.3; } 100% { opacity: 0.1; } }
        @media (max-width: 820px) {
            body.phdsx-game-page #gameCanvas {
                width: calc(100vw - 64px);
            }
            body.phdsx-game-page #ui-layer,

            body.phdsx-game-page #game-over-screen,
            body.phdsx-game-page #pause-screen {
                left: 64px;

            }
            h1 { font-size: 42px; }
            p { padding: 0 18px; font-size: 17px; }
            .top-bar { padding: 12px; font-size: 14px; }
            .hud-group { gap: 10px; }
        }

    <script>
        // --- 游戏配置 ---
        const CONFIG = {
            gravity: 0.15,
            waterLevel: 150,
            maxAmmo: 5,
            reloadTime: 1200, // 毫秒
            submarines: {
                gray: { score: 100, speed: 1.5, hp: 1, depthMin: 200, depthMax: 400, color: '#708090', type: 'basic' },
                blue: { score: 250, speed: 2.8, hp: 2, depthMin: 300, depthMax: 500, color: '#1E90FF', type: 'fast' },
                red:  { score: 500, speed: 1.0, hp: 3, depthMin: 450, depthMax: 650, color: '#DC143C', type: 'hunter' }
            }
        };

        const GAME_ASSETS = {};
        const ASSET_PATHS = {
            background: 'submarine-assets/ocean-background.webp',
            ship: 'submarine-assets/player-destroyer.png',
            basic: 'submarine-assets/submarine-basic.png',
            fast: 'submarine-assets/submarine-fast.png',
            hunter: 'submarine-assets/submarine-hunter.png',
            explosion: 'submarine-assets/explosion.png'
        };
        const ASSETS_READY = Promise.all(Object.entries(ASSET_PATHS).map(([name, src]) => new Promise((resolve) => {
            const image = new Image();
            image.onload = () => {
                GAME_ASSETS[name] = image;
                resolve();
            };
            image.onerror = resolve;
            image.src = src;
        })));

        function drawGameAsset(ctx, name, x, y, width, height) {
            const image = GAME_ASSETS[name];
            if (!image || !image.complete || !image.naturalWidth) return false;
            ctx.drawImage(image, x, y, width, height);
            return true;
        }

        function gameViewportOffset() {
            if (!document.body.classList.contains('phdsx-game-page')) return 0;
            return window.innerWidth <= 820 ? 64 : 208;
        }

        // --- 核心类 ---
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;

                this.lastTime = 0;
                this.active = false;
                this.paused = false;
                
                this.entities = {
                    ship: null,
                    depthCharges: [],
                    submarines: [],
                    enemyProjectiles: [],
                    particles: [],
                    fish: [],
                    supplies: []
                };

                this.state = {
                    score: 0,
                    level: 1,
                    kills: 0,
                    hitsTaken: 0,
                    ammo: CONFIG.maxAmmo,
                    lastReload: 0,
                    reloadProgress: 0,
                    gameOver: false
                };

                this.keys = {};
                
                window.addEventListener('resize', () => this.resize());
                window.addEventListener('keydown', (e) => this.handleInput(e, true));
                window.addEventListener('keyup', (e) => this.handleInput(e, false));

                this.resize();
            }

            resize() {
                this.width = Math.max(320, window.innerWidth - gameViewportOffset());
                this.height = window.innerHeight;
                CONFIG.waterLevel = Math.max(110, Math.min(180, Math.round(this.height * 0.2)));
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                if (this.entities.ship) {
                    this.entities.ship.y = CONFIG.waterLevel - 20;
                }
                this.draw();
            }

            handleInput(e, isDown) {
                this.keys[e.code] = isDown;
                
                if (isDown) {
                    if (e.code === 'Space' && this.active && !this.state.gameOver && !this.paused) {
                        this.fire();
                    }
                    if (e.code === 'KeyP' && this.active && !this.state.gameOver) {
                        this.togglePause();
                    }
                }
            }

            togglePause() {
                this.paused = !this.paused;
                const pauseScreen = document.getElementById('pause-screen');
                if (this.paused) {
                    pauseScreen.classList.remove('hidden');
                    // 暂停时记录当前时间防止时间跳跃问题
                    this.pauseStartTime = performance.now();
                } else {
                    pauseScreen.classList.add('hidden');
                    // 恢复时调整 lastTime，避免 dt 突然变大
                    this.lastTime = performance.now();
                    // 调整 reload 时间
                    const pauseDuration = performance.now() - this.pauseStartTime;
                    this.state.lastReload += pauseDuration;
                }
            }

            start() {
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('game-over-screen').classList.add('hidden');
                document.getElementById('pause-screen').classList.add('hidden');
                
                this.active = true;
                this.paused = false;
                this.state = {
                    score: 0,
                    level: 1,
                    kills: 0,
                    hitsTaken: 0,
                    ammo: CONFIG.maxAmmo,
                    lastReload: performance.now(),
                    reloadProgress: 0,
                    gameOver: false
                };
                
                // 重置实体
                this.entities.ship = new Ship(this.width / 2, CONFIG.waterLevel - 20);
                this.entities.depthCharges = [];
                this.entities.submarines = [];
                this.entities.enemyProjectiles = [];
                this.entities.particles = [];
                this.entities.fish = [];
                this.entities.supplies = [];

                this.updateUI();
                this.lastTime = performance.now();
                requestAnimationFrame((t) => this.loop(t));
            }

            fire() {
                if (this.state.ammo > 0) {
                    this.state.ammo--;
                    this.entities.depthCharges.push(new DepthCharge(this.entities.ship.x, this.entities.ship.y + 20));
                    this.state.lastReload = performance.now();
                    this.updateUI();
                }
            }

            spawnEnemy() {
                const maxSubs = 2 + this.state.level;
                if (this.entities.submarines.length < maxSubs) {
                    const rand = Math.random();
                    let type = 'gray';
                    
                    if (this.state.level >= 2 && rand > 0.6) type = 'blue';
                    if (this.state.level >= 3 && rand > 0.85) type = 'red';

                    const config = CONFIG.submarines[type];
                    const startX = Math.random() > 0.5 ? -100 : this.width + 100;
                    const direction = startX < 0 ? 1 : -1;
                    const depth = Math.random() * (config.depthMax - config.depthMin) + config.depthMin;
                    const safeDepth = Math.min(depth, this.height - 50);

                    this.entities.submarines.push(new Submarine(startX, safeDepth, type, direction));
                }
            }

            spawnFish() {
                if (this.entities.fish.length < 3 && Math.random() < 0.005) {
                     const startX = Math.random() > 0.5 ? -50 : this.width + 50;
                     const direction = startX < 0 ? 1 : -1;
                     const depth = Math.random() * (this.height - CONFIG.waterLevel - 100) + CONFIG.waterLevel + 50;
                     this.entities.fish.push(new Fish(startX, depth, direction));
                }
            }

            update(dt) {
                if (this.state.gameOver) return;

                // 关卡进度
                if (this.state.score > this.state.level * 1500) {
                    this.state.level++;
                    document.getElementById('centerLevelText').innerText = `LEVEL ${this.state.level}`;
                }

                // 弹药装填
                if (this.state.ammo < CONFIG.maxAmmo) {
                    const now = performance.now();
                    const elapsed = now - this.state.lastReload;
                    this.state.reloadProgress = Math.min(elapsed / CONFIG.reloadTime, 1);
                    
                    if (elapsed >= CONFIG.reloadTime) {
                        this.state.ammo++;
                        this.state.lastReload = now;
                        this.state.reloadProgress = 0;
                        this.updateUI();
                    }
                    document.getElementById('reloadBar').style.width = `${this.state.reloadProgress * 100}%`;
                } else {
                    document.getElementById('reloadBar').style.width = '0%';
                }

                // 更新实体
                this.entities.ship.update(this.keys, this.width);
                
                this.spawnEnemy();
                this.spawnFish();

                // 更新深水炸弹
                this.entities.depthCharges.forEach((dc, i) => {
                    dc.update();
                    if (dc.y > this.height) dc.markedForDeletion = true;
                    
                    // 碰撞检测：炸弹 vs 潜艇
                    this.entities.submarines.forEach(sub => {
                        if (checkCollision(dc, sub)) {
                            dc.markedForDeletion = true;
                            const killed = sub.takeDamage(1);
                            createExplosion(dc.x, dc.y, 'orange');
                            this.shakeScreen(5);
                            if (killed) {
                                this.state.kills++;
                                this.updateUI();
                            }
                        }
                    });

                    // 碰撞检测：炸弹 vs 鱼
                    this.entities.fish.forEach(fish => {
                         if (checkCollision(dc, fish)) {
                             fish.scared = true;
                             this.entities.supplies.push(new Supply(fish.x, fish.y));
                         }
                    });
                });

                // 更新潜艇
                this.entities.submarines.forEach(sub => {
                    sub.update(this.entities.ship);
                    if (sub.canFire()) {
                        let projType = 'mine';
                        if (sub.type === 'fast') projType = 'torpedo'; // 蓝色也可以发鱼雷？原逻辑未改，这里保留原逻辑或增强
                        
                        // 红色潜艇逻辑：概率发射导弹或鱼雷
                        if (sub.type === 'hunter') {
                            // 50% 概率发射追踪导弹
                            projType = Math.random() > 0.5 ? 'missile' : 'torpedo';
                        } else if (sub.type === 'fast') {
                            // 蓝色稍微加强，偶尔发鱼雷
                            projType = Math.random() > 0.8 ? 'torpedo' : 'mine';
                        }
                        
                        this.entities.enemyProjectiles.push(new EnemyProjectile(sub.x, sub.y - 20, projType, this.entities.ship));
                    }
                });

                // 更新敌方投射物
                this.entities.enemyProjectiles.forEach(proj => {
                    proj.update();
                    // 碰撞：水雷/导弹 vs 船
                    if (checkCollision(proj, this.entities.ship)) {
                        proj.markedForDeletion = true;
                        createExplosion(proj.x, proj.y, 'red');
                        this.entities.ship.takeDamage(proj.damage);
                        this.state.hitsTaken++;
                        this.updateUI();
                        this.shakeScreen(10);
                    }
                    if (proj.y < CONFIG.waterLevel) {
                         // 导弹如果飞出水面太多，销毁
                         proj.markedForDeletion = true;
                         createSplash(proj.x, CONFIG.waterLevel);
                    }
                });

                // 更新补给品
                this.entities.supplies.forEach(supply => {
                    supply.update();
                    if (checkCollision(supply, this.entities.ship)) {
                        supply.markedForDeletion = true;
                        if (supply.type === 'health') {
                            this.entities.ship.hp = Math.min(this.entities.ship.hp + 20, 100);
                        } else {
                            this.state.ammo = CONFIG.maxAmmo;
                        }
                        this.updateUI();
                        createExplosion(supply.x, supply.y, '#00ff00', 10);
                    }
                });

                this.entities.fish.forEach(f => f.update(this.width));
                this.entities.particles.forEach(p => p.update());
                this.cleanup();

                if (this.entities.ship.hp <= 0) {
                    this.gameOver();
                }
            }

            cleanup() {
                ['depthCharges', 'submarines', 'enemyProjectiles', 'particles', 'fish', 'supplies'].forEach(key => {
                    this.entities[key] = this.entities[key].filter(e => !e.markedForDeletion);
                });
            }

            draw() {
                const background = GAME_ASSETS.background;
                if (background) {
                    this.ctx.drawImage(background, 0, 0, this.width, this.height);
                    this.ctx.fillStyle = 'rgba(0, 22, 42, 0.08)';
                    this.ctx.fillRect(0, CONFIG.waterLevel, this.width, this.height - CONFIG.waterLevel);
                } else {
                    const skyGrad = this.ctx.createLinearGradient(0, 0, 0, CONFIG.waterLevel);
                    skyGrad.addColorStop(0, '#87CEEB');
                    skyGrad.addColorStop(1, '#E0F7FA');
                    this.ctx.fillStyle = skyGrad;
                    this.ctx.fillRect(0, 0, this.width, CONFIG.waterLevel);
                    const seaGrad = this.ctx.createLinearGradient(0, CONFIG.waterLevel, 0, this.height);
                    seaGrad.addColorStop(0, '#006994');
                    seaGrad.addColorStop(1, '#001e2b');
                    this.ctx.fillStyle = seaGrad;
                    this.ctx.fillRect(0, CONFIG.waterLevel, this.width, this.height - CONFIG.waterLevel);
                }

                this.ctx.save();
                this.ctx.globalAlpha = 0.22;
                this.ctx.fillStyle = '#ffffff';
                for(let i=0; i<2; i++) {
                    const offset = performance.now() / (200 + i*100);
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, CONFIG.waterLevel);
                    for(let x=0; x<=this.width; x+=20) {
                        this.ctx.lineTo(x, CONFIG.waterLevel + Math.sin(x/50 + offset + i) * 10);
                    }
                    this.ctx.lineTo(this.width, this.height);
                    this.ctx.lineTo(0, this.height);
                    this.ctx.fill();
                }
                this.ctx.restore();

                this.entities.fish.forEach(e => e.draw(this.ctx));
                this.entities.submarines.forEach(e => e.draw(this.ctx));
                this.entities.supplies.forEach(e => e.draw(this.ctx));
                this.entities.depthCharges.forEach(e => e.draw(this.ctx));
                this.entities.enemyProjectiles.forEach(e => e.draw(this.ctx));
                if (this.entities.ship) this.entities.ship.draw(this.ctx);
                this.entities.particles.forEach(e => e.draw(this.ctx));
            }

            loop(timestamp) {
                if (!this.active) return;
                
                const dt = timestamp - this.lastTime;
                this.lastTime = timestamp;

                if (!this.paused) {
                    this.ctx.clearRect(0, 0, this.width, this.height);
                    this.update(dt);
                    this.draw();
                } else {
                    // 暂停时不更新，但可以重绘（如果需要）或者保持画面静止
                }

                requestAnimationFrame((t) => this.loop(t));
            }

            updateUI() {
                document.getElementById('scoreDisplay').innerText = this.state.score;
                document.getElementById('levelDisplay').innerText = this.state.level;
                document.getElementById('killDisplay').innerText = this.state.kills;
                document.getElementById('hitDisplay').innerText = this.state.hitsTaken;
                
                const hpElem = document.getElementById('healthDisplay');
                hpElem.innerText = `结构: ${Math.floor(this.entities.ship.hp)}%`;
                hpElem.style.color = this.entities.ship.hp > 50 ? '#00ff00' : (this.entities.ship.hp > 25 ? '#ffff00' : '#ff0000');

                // 弹药UI
                const container = document.getElementById('ammoContainer');
                const bar = document.getElementById('reloadBar');
                container.innerHTML = '';
                container.appendChild(bar);
                
                for(let i=0; i<CONFIG.maxAmmo; i++) {
                    const div = document.createElement('div');
                    div.className = `ammo-shell ${i < this.state.ammo ? '' : 'empty'}`;
                    container.appendChild(div);
                }
            }

            gameOver() {
                this.active = false;
                this.state.gameOver = true;
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('finalScore').innerText = this.state.score;
                document.getElementById('finalLevel').innerText = this.state.level;
                document.getElementById('finalKills').innerText = this.state.kills;
                document.getElementById('finalHits').innerText = this.state.hitsTaken;
            }

            shakeScreen(intensity) {
                const canvas = this.canvas;
                let shake = intensity;
                const id = setInterval(() => {
                    const dx = (Math.random() - 0.5) * shake;
                    const dy = (Math.random() - 0.5) * shake;
                    canvas.style.transform = `translate(${dx}px, ${dy}px)`;
                    shake *= 0.9;
                    if(shake < 0.5) {
                        clearInterval(id);
                        canvas.style.transform = 'none';
                    }
                }, 16);
            }
        }

        // --- 实体类定义 ---

        class Ship {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 80;
                this.height = 30;
                this.speed = 4;
                this.hp = 100;
                this.velocity = 0;
                this.hitboxRadius = 35;
            }

            update(keys, screenWidth) {
                if (keys['ArrowLeft'] || keys['KeyA']) this.velocity = -this.speed;
                else if (keys['ArrowRight'] || keys['KeyD']) this.velocity = this.speed;
                else this.velocity *= 0.9; 

                this.x += this.velocity;
                
                if (this.x < 40) this.x = 40;
                if (this.x > screenWidth - 40) this.x = screenWidth - 40;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(0, 20, 45, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                if (!drawGameAsset(ctx, 'ship', -68, -38, 136, 43)) {
                    ctx.fillStyle = '#555';
                    ctx.beginPath();
                    ctx.moveTo(-40, 0);
                    ctx.lineTo(40, 0);
                    ctx.lineTo(30, 20);
                    ctx.lineTo(-30, 20);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#777';
                    ctx.fillRect(-20, -15, 30, 15);
                    ctx.fillStyle = '#333';
                    ctx.fillRect(-5, -25, 5, 10);
                    ctx.fillRect(10, -10, 15, 5);
                }

                ctx.restore();
            }

            takeDamage(amount) {
                this.hp -= amount;
            }
        }

        class Submarine {
            constructor(x, y, type, direction) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.config = CONFIG.submarines[type];
                this.direction = direction;
                const dimensions = {
                    gray: { width: 100, height: 47, hitbox: 36 },
                    blue: { width: 118, height: 28, hitbox: 40 },
                    red: { width: 132, height: 55, hitbox: 46 }
                }[type];
                this.width = dimensions.width;
                this.height = dimensions.height;
                this.hp = this.config.hp;
                this.markedForDeletion = false;
                this.lastShot = performance.now();
                this.shootInterval = type === 'fast' ? 2000 : 3000;
                if (type === 'hunter') this.shootInterval = 3500;
                this.hitboxRadius = dimensions.hitbox;
            }

            update(ship) {
                this.x += this.config.speed * this.direction;

                if (this.type === 'hunter') {
                    this.y += Math.sin(performance.now() / 1000) * 0.5;
                }

                if ((this.direction === 1 && this.x > game.width + 100) || 
                    (this.direction === -1 && this.x < -100)) {
                    this.markedForDeletion = true;
                }
            }

            canFire() {
                const now = performance.now();
                if (now - this.lastShot > this.shootInterval) {
                    if (Math.random() < 0.4) {
                        this.lastShot = now;
                        return true;
                    }
                }
                return false;
            }

            takeDamage(amount) {
                this.hp -= amount;
                if (this.hp <= 0) {
                    this.markedForDeletion = true;
                    game.state.score += this.config.score;
                    createExplosion(this.x, this.y, 'yellow', 20);
                    for(let i=0; i<5; i++) {
                        game.entities.particles.push(new Bubble(this.x, this.y));
                    }
                    return true;
                }
                return false;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.direction === -1) ctx.scale(-1, 1);

                const assetName = this.config.type;
                if (!drawGameAsset(ctx, assetName, -this.width / 2, -this.height / 2, this.width, this.height)) {
                    ctx.fillStyle = this.config.color;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 35, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.roundRect(-10, -20, 20, 15, 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        class DepthCharge {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vy = 2;
                this.markedForDeletion = false;
                this.hitboxRadius = 8;
            }

            update() {
                this.vy += 0.1;
                this.y += this.vy;
                
                if (Math.random() < 0.3) {
                    game.entities.particles.push(new Bubble(this.x, this.y, 2));
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = '#222';
                ctx.fillRect(-5, -8, 10, 16);
                ctx.fillStyle = '#555';
                ctx.fillRect(-5, -8, 10, 4);
                ctx.restore();
            }
        }

        class EnemyProjectile {
            constructor(x, y, type, target) {
                this.x = x;
                this.y = y;
                this.type = type; // 'mine', 'torpedo', 'missile'
                this.target = target;
                this.vx = 0;
                this.vy = type === 'mine' ? -1.5 : -2.5;
                this.damage = type === 'mine' ? 15 : (type === 'missile' ? 35 : 25);
                this.markedForDeletion = false;
                this.hitboxRadius = 6;
                this.wobble = Math.random() * Math.PI;
                this.timer = 0; // For missile state
            }

            update() {
                this.timer++;

                if (this.type === 'mine') {
                    // 水雷：缓慢上升，轻微左右摇摆
                    this.y += this.vy;
                    this.x += Math.sin(this.y / 30 + this.wobble) * 0.5;
                } 
                else if (this.type === 'torpedo') {
                    // 鱼雷：水平追踪
                    this.y += this.vy;
                    if (this.target.x > this.x) this.vx += 0.05;
                    else this.vx -= 0.05;
                    if (this.vx > 1.5) this.vx = 1.5;
                    if (this.vx < -1.5) this.vx = -1.5;
                    this.x += this.vx;
                }
                else if (this.type === 'missile') {
                    // 导弹：
                    // 阶段1: 垂直快速上升
                    // 阶段2: 接近水面时，强力追踪
                    
                    if (this.y > CONFIG.waterLevel + 150) {
                        // 深水阶段：直线上升加速
                        this.vy = -3.5; 
                        this.vx *= 0.9;
                    } else {
                        // 攻击阶段：减缓上升，开始转向
                        this.vy *= 0.95; // 减速上升以获得更多横向时间
                        if (this.vy > -0.5) this.vy = -0.5; // 保持最小上升速度

                        const dx = this.target.x - this.x;
                        const ax = dx * 0.005; // 转向加速度
                        this.vx += ax;
                        
                        // 限制最大横向速度
                        if (this.vx > 4) this.vx = 4;
                        if (this.vx < -4) this.vx = -4;
                    }
                    
                    this.x += this.vx;
                    this.y += this.vy;

                    // 导弹尾烟
                    if (this.timer % 3 === 0) {
                        game.entities.particles.push(new Particle(this.x, this.y + 10, '#888', 3));
                        game.entities.particles.push(new Particle(this.x, this.y + 10, '#ff4400', 2));
                    }
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                if (this.type === 'mine') {
                    ctx.fillStyle = '#333';
                    ctx.beginPath();
                    ctx.arc(0, 0, 6, 0, Math.PI * 2);
                    ctx.fill();
                    for(let i=0; i<4; i++) {
                        ctx.rotate(Math.PI/2);
                        ctx.fillRect(-1, -8, 2, 4);
                    }
                } else if (this.type === 'torpedo') {
                    ctx.rotate(Math.atan2(this.vy, this.vx) + Math.PI/2);
                    ctx.fillStyle = '#8B0000';
                    ctx.fillRect(-3, -10, 6, 20);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(-3, 5, 6, 5);
                } else if (this.type === 'missile') {
                    ctx.rotate(Math.atan2(this.vy, this.vx) + Math.PI/2);
                    // 导弹弹体
                    ctx.fillStyle = '#ccc';
                    ctx.fillRect(-4, -12, 8, 24);
                    // 弹头
                    ctx.fillStyle = '#f00';
                    ctx.beginPath();
                    ctx.moveTo(-4, -12);
                    ctx.lineTo(4, -12);
                    ctx.lineTo(0, -20);
                    ctx.fill();
                    // 尾翼
                    ctx.fillStyle = '#333';
                    ctx.beginPath();
                    ctx.moveTo(-4, 8);
                    ctx.lineTo(-8, 14);
                    ctx.lineTo(-4, 10);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(4, 8);
                    ctx.lineTo(8, 14);
                    ctx.lineTo(4, 10);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class Fish {
            constructor(x, y, dir) {
                this.x = x;
                this.y = y;
                this.direction = dir;
                this.speed = Math.random() * 1 + 0.5;
                this.scared = false;
                this.markedForDeletion = false;
                this.hitboxRadius = 15;
                this.color = `hsl(${Math.random()*60 + 30}, 100%, 50%)`;
            }
            
            update(width) {
                this.x += (this.scared ? this.speed * 4 : this.speed) * this.direction;
                if ((this.direction === 1 && this.x > width + 50) || 
                    (this.direction === -1 && this.x < -50)) {
                    this.markedForDeletion = true;
                }
            }
            
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.direction === -1) ctx.scale(-1, 1);
                
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, 10, 6, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-5, 0);
                ctx.lineTo(-12, -5);
                ctx.lineTo(-12, 5);
                ctx.fill();
                
                ctx.restore();
            }
        }

        class Supply {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.type = Math.random() > 0.5 ? 'health' : 'ammo';
                this.vy = -1.2;
                this.markedForDeletion = false;
                this.hitboxRadius = 15;
            }

            update() {
                this.y += this.vy;
                if (this.y < CONFIG.waterLevel) {
                    this.y = CONFIG.waterLevel;
                    this.vy = 0;
                    this.y += Math.sin(performance.now()/300) * 0.5;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI*2);
                ctx.fill();

                if (this.type === 'health') {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(-8, -8, 16, 16);
                    ctx.fillStyle = '#f00';
                    ctx.fillRect(-2, -6, 4, 12);
                    ctx.fillRect(-6, -2, 12, 4);
                } else {
                    ctx.fillStyle = '#DAA520';
                    ctx.fillRect(-8, -6, 16, 12);
                    ctx.fillStyle = '#000';
                    ctx.font = '10px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('AM', 0, 0);
                }
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, size) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = size;
                this.life = 1.0;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.markedForDeletion = false;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.03;
                if(this.life <= 0) this.markedForDeletion = true;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }
        }

        class ExplosionEffect {
            constructor(x, y, size) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.life = 1;
                this.markedForDeletion = false;
            }
            update() {
                this.life -= 0.035;
                this.size += 1.8;
                if (this.life <= 0) this.markedForDeletion = true;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                if (!drawGameAsset(ctx, 'explosion', this.x - this.size / 2, this.y - this.size / 2, this.size, this.size)) {
                    ctx.fillStyle = '#ffb000';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size / 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class Bubble extends Particle {
            constructor(x, y, size = 3) {
                super(x, y, 'rgba(255, 255, 255, 0.4)', size);
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = -Math.random() * 2 - 1;
                this.life = 1.0;
            }
            update() {
                this.y += this.vy;
                this.x += Math.sin(this.y/10) * 0.5;
                if(this.y < CONFIG.waterLevel) this.markedForDeletion = true;
            }
        }

        // --- 辅助函数 ---

        function checkCollision(circleA, circleB) {
            const dx = circleA.x - circleB.x;
            const dy = circleA.y - circleB.y;
            const distance = Math.sqrt(dx*dx + dy*dy);
            return distance < (circleA.hitboxRadius + circleB.hitboxRadius);
        }

        function createExplosion(x, y, color, count=10) {
            game.entities.particles.push(new ExplosionEffect(x, y, count >= 20 ? 72 : 48));
            for(let i=0; i<count; i++) {
                game.entities.particles.push(new Particle(x, y, color, Math.random()*5+2));
            }
            game.entities.particles.push(new Particle(x, y, 'white', 15));
        }

        function createSplash(x, y) {
             for(let i=0; i<8; i++) {
                game.entities.particles.push(new Particle(x, y, '#fff', Math.random()*3+1));
            }
        }

        // --- 启动 ---
        const game = new Game();
        ASSETS_READY.then(() => game.draw());

    </script>
