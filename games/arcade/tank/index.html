<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="在线游玩坦克大战小游戏。">
<title>坦克大战 - PHDSX</title>
<link rel="stylesheet" href="tank.css">
</head>
<body data-game="tank">
<main class="game">
  <header><a href="../../../games.html?category=arcade">← 游戏厅</a><h1>坦克大战 <small>BATTLE CITY</small></h1><button id="mute" aria-pressed="true">声音：关</button></header>
  <section class="hud" aria-label="战况"><span>得分 <b id="score">000000</b></span><span>生命 <b id="lives">3</b></span><span>关卡 <b id="level">1 / 3</b></span><span>敌军 <b id="remaining">12</b></span></section>
  <div class="battlefield">
    <canvas id="stage" width="416" height="416" tabindex="0" aria-label="坦克大战战场，方向键或 WASD 移动，空格或 J 射击"></canvas>
    <div id="overlay" class="overlay"><h2 id="title">坦克大战</h2><p id="message">保护鹰徽基地，击退全部敌军。<br>三道防线，只有一次使命。</p><button id="action">开始游戏</button></div>
  </div>
  <div class="toolbar"><span id="effect" role="status">火力 1 · 基地完好</span><div><button id="pause" disabled>暂停</button><button id="restart">重新开始</button></div></div>
  <div class="touch" aria-label="触控操作"><div class="dpad"><button data-control="up" aria-label="上">▲</button><button data-control="left" aria-label="左">◀</button><button data-control="down" aria-label="下">▼</button><button data-control="right" aria-label="右">▶</button></div><button class="fire" data-control="fire">开火</button></div>
  <p class="help">方向键 / WASD 移动　空格 / J 射击　P / Esc 暂停<br><span>★ 永久升级（本条生命）　◇ 护盾 10 秒　✹ 清除在场敌军</span></p>
</main>
<script src="maps.js"></script><script src="engine.js"></script><script src="render.js"></script><script src="game.js"></script>
</body>
</html>
