<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fafbfe">
  <meta name="description" content="免费在线五子棋，15×15 棋盘本地双人对弈，支持悔棋与重新开局。">
  <title>五子棋 - PHDSX</title>
  <link rel="stylesheet" href="../../assets/site.css?v=20260830c">
  <link rel="stylesheet" href="../../assets/design-system.css?v=20260920a">
  <link rel="stylesheet" href="gomoku.css?v=20260921a">
  <link rel="stylesheet" href="../../assets/ubuntu.css?v=20260923u5">
<script src="../../assets/navigation.js?v=20260923u5"></script>
<script defer src="../../assets/design-system.js?v=20260923u5"></script>
</head>
<body>
  <header class="site-header"></header>
  <main>
    <section class="section gomoku-page" aria-labelledby="game-title">
      <header class="gomoku-heading">
        <div><p class="gomoku-eyebrow" data-i18n="gomoku.mode">本地双人 · 15 × 15</p><h1 id="game-title" data-i18n="games.gomoku">五子棋</h1><p class="section-lede" data-i18n="gomoku.lede">黑白交替，五子相连。和朋友面对面来一局。</p></div>
        <a class="button" href="../../games.html" data-i18n="gomoku.back">返回游戏</a>
      </header>
      <div class="gomoku-layout">
        <div class="gomoku-board-panel">
          <div class="gomoku-board" id="board" role="group" aria-label="五子棋棋盘" aria-describedby="board-help"></div>
          <p id="board-help" class="gomoku-help" data-i18n="gomoku.help">点击交叉点落子；也可用方向键移动，按回车或空格落子。</p>
        </div>
        <aside class="gomoku-panel">
          <div class="gomoku-status-box" role="status" aria-live="polite" aria-atomic="true"><span id="turn-stone" class="gomoku-turn-stone" aria-hidden="true"></span><div><p class="gomoku-eyebrow" data-i18n="gomoku.current">当前棋局</p><h2 id="status">黑方落子</h2></div></div>
          <dl class="gomoku-stats"><div><dt data-i18n="gomoku.moves">已落子</dt><dd id="move-count">0</dd></div><div><dt data-i18n="gomoku.last">上一手</dt><dd id="last-move">—</dd></div></dl>
          <div class="gomoku-actions"><button class="button primary" id="restart" type="button" data-i18n="gomoku.restart">重新开局</button><button class="button" id="undo" type="button" data-i18n="gomoku.undo" disabled>悔棋一步</button></div>
          <div class="gomoku-rules"><h3 data-i18n="gomoku.rulesTitle">对弈规则</h3><ul><li data-i18n="gomoku.rule1">黑方先手，双方轮流在空交叉点落子。</li><li data-i18n="gomoku.rule2">横、竖或斜向连成五子及以上即可获胜。</li><li data-i18n="gomoku.rule3">自由规则，不设禁手；棋盘落满仍无人获胜则和棋。</li></ul><p data-i18n="gomoku.marker">蓝色圆点标记上一手，金色圆环标记获胜连线。</p></div>
        </aside>
      </div>
      <noscript>请启用 JavaScript 后游玩五子棋。</noscript>
    </section>
  </main>
  <footer class="site-footer"><span>PHDSX 个人主页</span><span>工具 · 游戏 · 博客 · 小说 · 黄页</span></footer>
  <script src="../../assets/i18n.js?v=20260923u5"></script>
  <script src="../../assets/site.js?v=20260830e"></script>
  <script type="module" src="gomoku.mjs?v=20260921a"></script>
</body>
</html>
