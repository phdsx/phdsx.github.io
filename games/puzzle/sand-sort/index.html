<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#192536">
  <title>沙子分类 · PHDSX</title>
  <link rel="stylesheet" href="sand-sort.css?v=studio2-final">
</head>
<body class="sand-studio">
  <main class="game-shell" data-game-state="loading">
    <header class="status-bar" inert aria-hidden="true">
      <button id="pause-button" class="round-control" type="button" aria-label="暂停游戏"><img src="assets/icons/pause-fill.svg" alt=""></button>
      <div class="level-heading"><div class="level-title">第 <strong id="level-number">1</strong> 关</div><div class="level-dots" aria-hidden="true"><i class="active"></i><i></i><i></i><i></i></div></div>
      <button id="sound-button" class="round-control" type="button" aria-pressed="false" aria-label="关闭游戏声音"><img src="assets/icons/volume-up.svg" alt=""></button>
      <span id="coin-count" hidden>200</span>
    </header>
    <canvas id="game-canvas" tabindex="0" aria-label="沙子分类游戏区域" aria-describedby="keyboard-help" aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown Home End Enter Space 1 2 3 4 5 6 7 8 9 0" inert aria-hidden="true"></canvas>
    <p id="keyboard-help" class="visually-hidden">使用方向键定位瓶子，按回车或空格选择，也可以按数字键直接选择前十个瓶子。</p>
    <p id="game-status" class="game-status" aria-live="polite" inert aria-hidden="true">正在载入游戏</p>
    <nav class="tool-dock" aria-label="免费游戏工具" inert aria-hidden="true">
      <button type="button" data-tool="undo"><span class="tool-icon"><img src="assets/icons/arrow-counterclockwise.svg" alt=""></span><span>撤销</span></button>
      <button type="button" data-tool="hint"><span class="tool-icon"><img src="assets/icons/lightbulb.svg" alt=""></span><span>提示</span></button>
      <button type="button" data-tool="shuffle"><span class="tool-icon"><img src="assets/icons/shuffle.svg" alt=""></span><span>重排</span></button>
      <button type="button" data-tool="extra"><span class="tool-icon with-bottle"><img src="assets/icons/plus-lg.svg" alt=""><img src="assets/icons/milk.svg" alt=""></span><span>加空瓶</span></button>
      <button type="button" data-tool="restart"><span class="tool-icon"><img src="assets/icons/arrow-clockwise.svg" alt=""></span><span>重开</span></button>
    </nav>
    <section id="tutorial" class="overlay-card tutorial-card" role="dialog" aria-modal="true" aria-labelledby="tutorial-title">
      <h1 id="tutorial-title">让每一瓶，只留一种颜色</h1>
      <p id="tutorial-description">选一个瓶子，再选空瓶或顶部同色的瓶子。</p>
      <div class="tutorial-actions"><button type="button" data-action="start" disabled>开始游戏</button><a href="../../../games.html">返回游戏厅</a></div>
    </section>
    <section id="win-dialog" class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="win-title" hidden>
      <h2 id="win-title">分类完成</h2><p>所有颜色都回到了自己的瓶子。</p><button type="button" data-action="next">下一关</button>
    </section>
  </main>
  <script defer src="sand-sort.bundle.js?v=studio2-final"></script>
</body>
</html>
