<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#b9e7d0">
  <title>停车脉冲 · Parking Pulse</title>
  <style>
    :root { --ink:#26334c; --muted:#6e7a93; --cream:#fffdf7; --paper:#f7f3eb; --mint:#b9e7d0; --mint-deep:#6fbca2; --navy:#354260; --lavender:#c8c9e7; --yellow:#ffd66d; --shadow:0 14px 30px rgba(47,62,90,.16),0 4px 8px rgba(47,62,90,.1); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:radial-gradient(circle at 12% 8%,rgba(255,255,255,.76) 0 2px,transparent 3px),radial-gradient(circle at 90% 22%,rgba(255,255,255,.72) 0 3px,transparent 4px),linear-gradient(160deg,#bdebd0 0%,#a8dbc4 46%,#84c0ad 100%); }
    button { font:inherit; }
    .game-wrap { width:min(980px,100%); margin:0 auto; padding:18px 14px 28px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .brand { display:flex; align-items:center; gap:10px; color:var(--ink); text-decoration:none; font-weight:900; letter-spacing:.04em; }
    .brand-mark { display:grid; place-items:center; width:42px; height:42px; border:3px solid var(--ink); border-radius:15px; color:var(--cream); background:var(--navy); box-shadow:0 5px 0 rgba(38,51,76,.22); }
    .back-link { display:grid; place-items:center; width:42px; height:42px; padding:0; border:2px solid rgba(38,51,76,.3); border-radius:50%; color:var(--ink); background:rgba(255,255,255,.72); box-shadow:0 4px 0 rgba(38,51,76,.14); cursor:pointer; font-size:1.25rem; font-weight:900; opacity:.9; }
    .back-link:hover,.back-link:focus-visible { opacity:1; outline:3px solid var(--yellow); outline-offset:2px; }
    .game-card { overflow:hidden; border:3px solid rgba(255,255,255,.72); border-radius:30px; background:rgba(255,253,247,.74); box-shadow:var(--shadow); }
    .game-head { display:grid; grid-template-columns:1fr auto; align-items:end; gap:18px; padding:22px 24px 16px; }
    .eyebrow { margin:0 0 6px; color:var(--mint-deep); font-size:.76rem; font-weight:900; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(1.7rem,4vw,2.7rem); line-height:1; letter-spacing:-.05em; }
    .subtitle { max-width:560px; margin:9px 0 0; color:var(--muted); font-size:.92rem; line-height:1.55; }
    .level-badge { display:grid; justify-items:center; min-width:92px; padding:11px 14px; border:2px solid var(--navy); border-radius:19px; color:var(--cream); background:var(--navy); box-shadow:0 4px 0 rgba(38,51,76,.2); }
    .level-badge strong { font-size:1.36rem; line-height:1; }
    .level-badge span { margin-top:3px; font-size:.7rem; font-weight:800; opacity:.75; }
    .passenger-panel { margin:0 18px 14px; padding:14px 16px 16px; border-radius:22px; background:rgba(255,255,255,.7); }
    .panel-label { display:flex; align-items:center; justify-content:space-between; gap:12px; color:var(--muted); font-size:.74rem; font-weight:900; letter-spacing:.1em; text-transform:uppercase; }
    .remaining { color:var(--ink); font-size:.78rem; letter-spacing:0; text-transform:none; }
    .queue { position:relative; display:flex; flex-wrap:nowrap; align-items:flex-end; gap:0; overflow:hidden; margin-top:11px; min-height:48px; padding:3px 4px 7px; }
    .queue::before { content:""; position:absolute; left:6px; right:6px; bottom:2px; border-bottom:3px dashed rgba(111,188,162,.38); }
    .queue-person { position:relative; display:grid; flex:0 0 27px; place-items:end center; width:27px; height:40px; z-index:var(--person-index); animation:queue-arrive .42s cubic-bezier(.2,.8,.3,1) both; }
    .queue-person::before { content:""; position:absolute; bottom:2px; width:23px; height:8px; border:2px solid rgba(38,51,76,.45); border-radius:50%; background:var(--person-color); box-shadow:0 2px 0 rgba(38,51,76,.12); }
    .queue-person img { position:relative; z-index:1; display:block; width:28px; height:36px; object-fit:contain; filter:drop-shadow(0 2px 1px rgba(38,51,76,.2)); }
    .queue-person.person-coral img,.boarding-person.person-coral { filter:hue-rotate(165deg) saturate(1.25) brightness(1.03) drop-shadow(0 2px 1px rgba(38,51,76,.2)); }
    .queue-person.person-sun img,.boarding-person.person-sun { filter:hue-rotate(205deg) saturate(1.18) brightness(1.04) drop-shadow(0 2px 1px rgba(38,51,76,.2)); }
    .queue-person.person-mint img,.boarding-person.person-mint { filter:hue-rotate(305deg) saturate(1.08) brightness(1.02) drop-shadow(0 2px 1px rgba(38,51,76,.2)); }
    @keyframes queue-arrive { from { opacity:0; transform:translateX(13px) translateY(5px) scale(.72); } to { opacity:1; transform:translateX(0) translateY(0) scale(1); } }
    .passenger-group { display:inline-flex; align-items:center; gap:7px; padding:6px 10px 6px 7px; border:2px solid rgba(38,51,76,.1); border-radius:13px; color:var(--ink); background:var(--paper); font-size:.84rem; font-weight:900; box-shadow:0 3px 0 rgba(38,51,76,.07); }
    .passenger-group:first-child { border-color:var(--ink); box-shadow:0 3px 0 rgba(38,51,76,.16); transform:translateY(-1px); }
    .passenger-avatars { display:flex; align-items:flex-end; width:46px; height:37px; }
    .passenger-avatar { position:relative; display:block; width:31px; height:37px; margin-left:-10px; z-index:var(--avatar-index); border-radius:50%; background:radial-gradient(circle at 50% 80%,var(--passenger-color) 0 35%,transparent 37%); }
    .passenger-avatar:first-child { margin-left:0; }
    .passenger-avatar img { position:relative; z-index:1; display:block; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 2px 1px rgba(38,51,76,.2)); }
    .empty-queue { color:var(--mint-deep); font-weight:900; }
    .slots-panel { padding:0 18px 17px; }
    .slots { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; padding:10px; border:3px solid rgba(255,255,255,.72); border-radius:20px; background:rgba(147,153,202,.54); }
    .slot { display:grid; place-items:center; min-height:74px; border:2px dashed rgba(255,255,255,.82); border-radius:14px; color:rgba(255,255,255,.88); font-size:.73rem; font-weight:900; }
    .slot.is-filled { border-style:solid; background:rgba(255,255,255,.18); }
    .slot .vehicle { width:86%; min-height:53px; cursor:default; pointer-events:none; }
    .board-panel { min-height:0; margin:0 18px; padding:17px; border:3px solid rgba(255,255,255,.72); border-radius:24px 24px 15px 15px; background:#9da6d2; }
    .board-title { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; color:var(--cream); }
    .board-title strong { font-size:.98rem; }
    .board-title span { font-size:.74rem; font-weight:800; opacity:.86; }
    .board { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); grid-template-rows:repeat(6,minmax(38px,1fr)); gap:5px; min-height:0; padding:10px; border:3px solid rgba(255,255,255,.8); border-radius:18px; background-color:#aeb7de; background-image:linear-gradient(rgba(255,255,255,.13) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.13) 2px,transparent 2px); background-size:calc(100% / 6) calc(100% / 6); }
    .board:focus-within { border-color:var(--yellow); }
    .vehicle { position:relative; z-index:2; display:flex; align-items:center; justify-content:center; min-width:0; min-height:38px; padding:0; overflow:visible; border:0; border-radius:14px; color:white; background:transparent; box-shadow:none; cursor:pointer; transition:transform .18s ease,filter .18s ease,opacity .18s ease; }
    .vehicle::before,.vehicle::after { display:none; }
    .vehicle .bus-sprite { position:absolute; z-index:1; width:143%; height:155%; object-fit:contain; pointer-events:none; filter:drop-shadow(0 6px 2px rgba(38,51,76,.32)); transition:transform .22s ease,filter .22s ease; }
    .vehicle.color-sky .bus-sprite { filter:drop-shadow(0 6px 2px rgba(38,51,76,.32)); }
    .vehicle.color-coral .bus-sprite { filter:hue-rotate(165deg) saturate(1.25) brightness(1.03) drop-shadow(0 6px 2px rgba(38,51,76,.32)); }
    .vehicle.color-sun .bus-sprite { filter:hue-rotate(205deg) saturate(1.18) brightness(1.04) drop-shadow(0 6px 2px rgba(38,51,76,.32)); }
    .vehicle.color-mint .bus-sprite { filter:hue-rotate(305deg) saturate(1.08) brightness(1.02) drop-shadow(0 6px 2px rgba(38,51,76,.32)); }
    .vehicle.dir-left .bus-sprite { transform:rotate(180deg); }
    .vehicle.dir-up .bus-sprite { transform:rotate(-90deg); }
    .vehicle.dir-down .bus-sprite { transform:rotate(90deg); }
    .vehicle .arrow { position:relative; z-index:4; display:grid; place-items:center; width:27px; height:27px; border:2px solid rgba(38,51,76,.75); border-radius:50%; color:var(--ink); background:rgba(255,255,255,.9); box-shadow:0 3px 0 rgba(38,51,76,.2); font-size:1.18rem; line-height:1; font-weight:1000; text-shadow:none; }
    .vehicle:hover,.vehicle:focus-visible { z-index:5; filter:brightness(1.08); transform:translateY(-3px) scale(1.02); outline:3px solid rgba(255,255,255,.92); outline-offset:2px; }
    .vehicle .arrow { position:relative; z-index:1; font-size:1.45rem; line-height:1; font-weight:1000; text-shadow:0 2px 0 rgba(38,51,76,.3); }
    .vehicle .capacity { position:absolute; right:5px; bottom:4px; z-index:1; font-size:.62rem; font-weight:1000; opacity:.9; }
    .vehicle.vertical { min-height:80px; }
    .vehicle.horizontal { min-width:78px; }
    .vehicle.vertical .bus-sprite { width:155%; height:143%; }
    .vehicle.vertical .arrow { width:25px; height:25px; }
    .boarding-people { position:absolute; left:50%; bottom:-4px; z-index:8; display:flex; gap:0; transform:translate(-50%, 55%); pointer-events:none; }
    .boarding-person { width:25px; height:31px; object-fit:contain; animation:board-walk .55s cubic-bezier(.2,.8,.3,1) both; filter:drop-shadow(0 3px 1px rgba(38,51,76,.24)); }
    .boarding-person:nth-child(2) { animation-delay:.1s; }
    @keyframes board-walk { 0% { opacity:0; transform:translateY(15px) scale(.65); } 65% { opacity:1; transform:translateY(-5px) scale(1.02); } 100% { opacity:1; transform:translateY(0) scale(1); } }
    .vehicle.is-selected { outline:3px solid var(--yellow); outline-offset:2px; transform:translateY(-3px); }
    .vehicle.is-blocked { animation:bump .32s ease both; }
    .vehicle.is-departing { animation:drive-out .44s ease both; }
    @keyframes bump { 0%,100%{transform:translateX(0)} 35%{transform:translateX(-5px)} 70%{transform:translateX(5px)} }
    @keyframes drive-out { to { transform:scale(.65); opacity:0; } }
    .status-row { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:43px; padding:13px 3px 0; color:var(--cream); }
    .status-message { font-size:.86rem; font-weight:800; }
    .move-counter { font-size:.74rem; font-weight:900; opacity:.82; white-space:nowrap; }
    .tool-dock { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; padding:16px 18px 19px; background:rgba(53,66,96,.12); }
    .tool-button { min-height:62px; padding:9px 7px; border:2px solid rgba(38,51,76,.82); border-radius:17px; color:var(--ink); background:var(--cream); box-shadow:0 4px 0 rgba(38,51,76,.18); cursor:pointer; transition:transform .15s ease,background .15s ease; }
    .tool-button:hover:not(:disabled),.tool-button:focus-visible:not(:disabled) { transform:translateY(-3px); background:#fff; outline:3px solid rgba(255,255,255,.78); outline-offset:2px; }
    .tool-button:active:not(:disabled) { transform:translateY(1px); box-shadow:0 2px 0 rgba(38,51,76,.18); }
    .tool-button:disabled { opacity:.45; cursor:not-allowed; }
    .tool-button.is-active { outline:4px solid var(--yellow); outline-offset:3px; transform:translateY(-3px); }
    .tool-icon { display:block; font-size:1.42rem; line-height:1.05; }
    .tool-name { display:block; margin-top:2px; font-size:.76rem; font-weight:900; }
    .tool-count { display:block; margin-top:1px; color:var(--muted); font-size:.68rem; font-weight:800; }
    .modal { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:24px; background:rgba(38,51,76,.45); backdrop-filter:blur(5px); }
    .modal[hidden] { display:none; }
    .modal-card { width:min(390px,100%); padding:28px; border:3px solid rgba(255,255,255,.85); border-radius:28px; text-align:center; background:var(--cream); box-shadow:var(--shadow); }
    .modal-icon { font-size:3.2rem; }
    .modal h2 { margin:10px 0 6px; font-size:1.7rem; }
    .modal p { margin:0 0 20px; color:var(--muted); line-height:1.55; }
    .primary-button { width:100%; padding:13px 18px; border:3px solid var(--ink); border-radius:15px; color:var(--cream); background:var(--navy); box-shadow:0 4px 0 rgba(38,51,76,.2); cursor:pointer; font-weight:900; }
    .primary-button:hover,.primary-button:focus-visible { background:#435172; outline:3px solid var(--yellow); outline-offset:2px; }
    @media (max-width:640px) { .game-wrap{padding:10px 8px 20px}.topbar{margin-bottom:9px}.game-card{border-radius:23px}.game-head{padding:17px 15px 13px}.level-badge{min-width:74px;padding:9px 10px}.level-badge strong{font-size:1.1rem}.passenger-panel,.slots-panel,.board-panel{margin-left:10px;margin-right:10px}.passenger-panel{padding:12px}.slots{gap:6px;padding:7px}.slot{min-height:55px;font-size:.64rem}.slot .vehicle{min-height:43px}.board-panel{padding:11px}.board{min-height:0;grid-template-rows:repeat(6,minmax(34px,1fr));gap:4px;padding:7px}.vehicle{border-width:2px;border-radius:9px}.vehicle .arrow{font-size:1.1rem}.vehicle.horizontal{min-width:62px}.vehicle.vertical{min-height:58px}.tool-dock{gap:6px;padding:8px 10px 11px}.tool-button{min-height:56px;border-radius:13px}.tool-icon{font-size:1.2rem}.tool-name{font-size:.68rem} }
    @media (max-width:390px) { .subtitle{font-size:.82rem}.vehicle .capacity{display:none}.status-message{font-size:.76rem} }

    /* Video-style full-screen mobile game composition */
    body { overflow-x:hidden; background:#aeb9dd; }
    .game-wrap { width:min(576px,100vw); height:100vh; height:100dvh; min-height:640px; margin:0 auto; padding:0; }
    .topbar { position:absolute; top:12px; left:50%; z-index:30; width:min(576px,100vw); margin:0; padding:0 15px; transform:translateX(-50%); pointer-events:none; }
    .topbar .brand,.topbar .back-link { pointer-events:auto; }
    .topbar .brand { color:#fff; text-shadow:0 2px 0 rgba(38,51,76,.24); }
    .topbar .brand-mark { width:42px; height:42px; border-color:#fff; border-radius:50%; background:#354260; box-shadow:0 4px 0 rgba(38,51,76,.22); }
    .topbar .brand span:last-child { display:none; }
    .topbar .back-link { color:#26334c; opacity:.96; text-shadow:none; }
    .game-card { display:flex; flex-direction:column; height:100%; min-height:0; overflow:hidden; border:0; border-radius:0; background:linear-gradient(#8fd04d 0 15%,#c7d0ec 15% 100%); box-shadow:none; }
    .game-head { position:relative; display:flex; flex:0 0 auto; justify-content:center; min-height:112px; padding:49px 18px 7px; background:#8fd04d; text-align:center; }
    .game-head .eyebrow { display:none; }
    .game-head h1 { color:#fff; font-size:clamp(1.8rem,6vw,2.5rem); letter-spacing:.04em; text-shadow:0 3px 0 #26334c,2px 0 0 #26334c,-2px 0 0 #26334c; }
    .game-head .subtitle { display:none; }
    .level-badge { position:absolute; top:23px; left:50%; min-width:auto; padding:0; border:0; color:#fff; background:transparent; box-shadow:none; transform:translateX(-50%); }
    .level-badge strong { font-size:1.38rem; text-shadow:0 2px 0 #26334c; }
    .level-badge span { display:none; }
    .passenger-panel { flex:0 0 auto; margin:0; padding:7px 13px 7px; border-radius:0; background:#c7d0ec; }
    .passenger-panel .panel-label { color:#26334c; text-shadow:none; }
    .queue { min-height:43px; margin-top:2px; padding:1px 5px 5px; }
    .queue-person { height:36px; }
    .queue-person img { height:33px; }
    .slots-panel { flex:0 0 auto; margin:0; padding:0 13px 8px; background:#c7d0ec; }
    .slots-panel .panel-label { color:#26334c; text-shadow:none; }
    .slots { gap:7px; padding:7px; border:0; border-radius:13px; background:rgba(91,108,160,.42); }
    .slot { min-height:53px; border:2px dashed rgba(255,255,255,.9); color:#26334c; background:rgba(255,255,255,.24); }
    .slot .vehicle { min-height:45px; }
    .board-panel { display:flex; flex:1 1 auto; min-height:0; flex-direction:column; margin:0; padding:8px 12px 0; border:0; border-radius:0; background:#aeb9dd; }
    .board-title { flex:0 0 auto; margin:0 5px 6px; color:#26334c; text-shadow:none; }
    .board-title span { opacity:.9; }
    .board { flex:1 1 auto; min-height:0; height:auto; padding:8px; border:3px solid rgba(255,255,255,.88); border-radius:17px; background-color:#aeb9dd; }
    .vehicle .bus-sprite { width:151%; height:165%; }
    .vehicle.vertical .bus-sprite { width:165%; height:151%; }
    .status-row { flex:0 0 auto; min-height:30px; padding:6px 4px 4px; color:#26334c; }
    .status-message { font-size:.75rem; }
    .move-counter { font-size:.68rem; }
    .tool-dock { grid-template-columns:repeat(3,1fr); flex:0 0 auto; gap:14px; padding:7px 28px calc(10px + env(safe-area-inset-bottom)); background:#8fa5df; }
    .tool-button { width:min(76px,20vw); min-height:0; aspect-ratio:1; justify-self:center; padding:6px 4px; border:3px solid rgba(255,255,255,.9); border-radius:50%; color:#fff; background:radial-gradient(circle at 35% 27%,#f6a8df 0 8%,#be45d7 39%,#7b26a5 100%); box-shadow:0 5px 0 rgba(38,51,76,.23),inset 0 3px 0 rgba(255,255,255,.32); text-shadow:0 2px 0 rgba(38,51,76,.4); }
    .tool-button:nth-child(2) { background:radial-gradient(circle at 35% 27%,#ffefb5 0 8%,#f9bd4d 39%,#e2752f 100%); }
    .tool-button:nth-child(3) { background:radial-gradient(circle at 35% 27%,#a9f3cb 0 8%,#32c874 39%,#168b68 100%); }
    .tool-icon { font-size:1.8rem; }
    .tool-name { font-size:.72rem; }
    .tool-count { color:#fff; font-size:.65rem; }
    .tool-button:hover:not(:disabled),.tool-button:focus-visible:not(:disabled) { transform:translateY(-4px); }
    .vehicle { transform:rotate(var(--tilt,0deg)); }
    .vehicle:hover,.vehicle:focus-visible { transform:translateY(-3px) rotate(var(--tilt,0deg)) scale(1.04); }
    .vehicle.is-selected { transform:translateY(-3px) rotate(var(--tilt,0deg)) scale(1.04); }
    @media (max-height:720px) { .game-head{min-height:96px;padding-top:43px}.game-head h1{font-size:1.7rem}.queue{min-height:37px}.queue-person{height:32px}.queue-person img{height:29px}.slot{min-height:47px}.tool-button{width:min(66px,18vw)}.tool-dock{padding-top:5px;padding-bottom:7px} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <main class="game-wrap">
    <div class="topbar"><a class="brand" href="../../../games.html" aria-label="返回游戏列表"><span class="brand-mark" aria-hidden="true">←</span><span>PARKING PULSE</span></a><button class="back-link" type="button" id="reset-button" aria-label="重新开始本关"><span aria-hidden="true">↺</span></button></div>
    <section class="game-card" aria-label="停车脉冲游戏">
      <header class="game-head"><div><p class="eyebrow">Park & Match</p><h1>停车脉冲</h1><p class="subtitle">把没有被挡住的车送出去，让同色乘客上车。车位有限，先看清箭头，再点击出发。</p></div><div class="level-badge"><strong>第 1 关</strong><span>LEVEL</span></div></header>
      <section class="passenger-panel" aria-labelledby="passenger-label"><div class="panel-label"><span id="passenger-label">乘客队列 · 下一站</span><span class="remaining" id="remaining-count">剩余 0 人</span></div><div class="queue" id="passenger-queue" role="img" aria-label="乘客队列"></div></section>
      <section class="slots-panel" aria-labelledby="slots-label"><div class="panel-label" style="margin:0 2px 7px"><span id="slots-label">接客位 · 4 格</span><span>满员车辆自动出站</span></div><div class="slots" id="parking-slots"></div></section>
      <section class="board-panel" aria-labelledby="board-label"><div class="board-title"><strong id="board-label">停车场</strong><span>点按车辆驶出 · 箭头方向即路线</span></div><div class="board" id="vehicle-board" tabindex="-1"></div><div class="status-row"><span class="status-message" id="status-message" aria-live="polite">先找一辆没有被挡住的车</span><span class="move-counter" id="move-counter">0 次操作</span></div></section>
      <footer class="tool-dock" aria-label="游戏道具"><button class="tool-button" type="button" data-tool="sort" aria-label="重排乘客队列，剩余 2 次"><span class="tool-icon">↝</span><span class="tool-name">重排</span><span class="tool-count" id="sort-count">×2</span></button><button class="tool-button" type="button" data-tool="remove" aria-label="移除车辆，剩余 2 次"><span class="tool-icon">✦</span><span class="tool-name">移除</span><span class="tool-count" id="remove-count">×2</span></button><button class="tool-button" type="button" data-tool="refresh" aria-label="调头车辆，剩余 2 次"><span class="tool-icon">↻</span><span class="tool-name">调头</span><span class="tool-count" id="refresh-count">×2</span></button></footer>
    </section>
  </main>
  <div class="modal" id="result-modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="result-title" aria-describedby="result-copy"><div class="modal-icon" id="result-icon">🎉</div><h2 id="result-title">出站成功！</h2><p id="result-copy">乘客们都赶上车了。</p><button class="primary-button" type="button" id="result-button">重新挑战</button></div></div>
  <script>
    (() => {
      const COLORS = { coral:{label:'珊瑚',hex:'#ef6f65'}, sky:{label:'晴蓝',hex:'#26b7d3'}, sun:{label:'暖橙',hex:'#f39a3f'}, mint:{label:'薄荷',hex:'#56bf76'} };
      const DIRS = { left:'←', right:'→', up:'↑', down:'↓' };
      const LEVEL = { width:6, height:6, slots:4, passengers:[{color:'coral',count:3},{color:'sky',count:4},{color:'sun',count:3},{color:'mint',count:4}], vehicles:[
        {id:'coral-a',color:'coral',x:1,y:1,length:2,direction:'right',capacity:3},{id:'sky-a',color:'sky',x:4,y:1,length:1,direction:'left',capacity:2},{id:'mint-a',color:'mint',x:6,y:1,length:1,direction:'down',capacity:4},{id:'sun-a',color:'sun',x:1,y:2,length:1,direction:'right',capacity:3},{id:'coral-b',color:'coral',x:3,y:2,length:1,direction:'right',capacity:2},{id:'sky-b',color:'sky',x:5,y:2,length:2,direction:'down',capacity:2},{id:'mint-b',color:'mint',x:1,y:3,length:1,direction:'down',capacity:4},{id:'sun-b',color:'sun',x:4,y:3,length:1,direction:'left',capacity:3},{id:'coral-c',color:'coral',x:6,y:3,length:1,direction:'left',capacity:1},{id:'sky-c',color:'sky',x:2,y:4,length:1,direction:'up',capacity:2},{id:'mint-c',color:'mint',x:4,y:4,length:1,direction:'down',capacity:4},{id:'sun-c',color:'sun',x:6,y:4,length:1,direction:'up',capacity:3},{id:'coral-d',color:'coral',x:1,y:5,length:2,direction:'right',capacity:2},{id:'sky-d',color:'sky',x:4,y:5,length:1,direction:'up',capacity:2},{id:'mint-d',color:'mint',x:6,y:5,length:1,direction:'left',capacity:4},{id:'sun-d',color:'sun',x:2,y:6,length:1,direction:'up',capacity:3}
      ]};
      const els = {
        main:document.querySelector('.game-wrap'), queue:document.getElementById('passenger-queue'),
        remaining:document.getElementById('remaining-count'), slots:document.getElementById('parking-slots'),
        board:document.getElementById('vehicle-board'), status:document.getElementById('status-message'),
        moves:document.getElementById('move-counter'), modal:document.getElementById('result-modal'),
        resultIcon:document.getElementById('result-icon'), resultTitle:document.getElementById('result-title'),
        resultCopy:document.getElementById('result-copy'), resultButton:document.getElementById('result-button'),
        reset:document.getElementById('reset-button')
      };
      const timers = new Set();
      const directionOrder = ['left','up','right','down'];
      let game = null;

      function motionDelay(milliseconds) {
        return window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : milliseconds;
      }

      function later(callback,milliseconds) {
        const timer=window.setTimeout(()=>{timers.delete(timer);callback();},motionDelay(milliseconds));
        timers.add(timer);
      }

      function clearTimers() {
        timers.forEach(timer=>window.clearTimeout(timer));
        timers.clear();
      }

      function createLevel() {
        return {
          passengers:LEVEL.passengers.map(group=>({...group})),
          vehicles:LEVEL.vehicles.map(vehicle=>({...vehicle,load:0,status:'active',slot:null})),
          slots:Array(LEVEL.slots).fill(null), tools:{sort:2,remove:2,refresh:2},
          selectedId:null, blockedId:null, boardingVehicleId:null, boardingCount:0,
          toolMode:null, moves:0, resolving:false, result:null, resultReason:null,
          message:'先找一辆没有被挡住的车'
        };
      }

      function activeVehicles() { return game.vehicles.filter(vehicle=>vehicle.status==='active'); }
      function parkedVehicles() { return game.slots.map(id=>id?getVehicle(id):null).filter(Boolean); }
      function passengerTotal() { return game.passengers.reduce((sum,group)=>sum+group.count,0); }
      function getVehicle(id) { return game.vehicles.find(vehicle=>vehicle.id===id); }

      function occupiedCells(vehicle,direction=vehicle.direction) {
        const cells=[];
        const horizontal=direction==='left'||direction==='right';
        for(let index=0;index<vehicle.length;index+=1) {
          cells.push({x:vehicle.x+(horizontal?index:0),y:vehicle.y+(horizontal?0:index)});
        }
        return cells;
      }

      function canMove(vehicle,vehicles=activeVehicles()) {
        const horizontal=vehicle.direction==='left'||vehicle.direction==='right';
        const start=horizontal?vehicle.x:vehicle.y;
        const step=vehicle.direction==='right'||vehicle.direction==='down'?1:-1;
        const edge=step===1?(horizontal?LEVEL.width:LEVEL.height):1;
        const first=step===1?start+vehicle.length:start-1;
        if((step===1&&first>edge)||(step===-1&&first<edge)) return {ok:true};
        for(let cursor=first;step===1?cursor<=edge:cursor>=edge;cursor+=step) {
          const cell=horizontal?{x:cursor,y:vehicle.y}:{x:vehicle.x,y:cursor};
          if(vehicles.some(other=>other.id!==vehicle.id&&occupiedCells(other).some(point=>point.x===cell.x&&point.y===cell.y))) {
            return {ok:false,reason:'前方有车挡住了，换一辆试试'};
          }
        }
        return {ok:true};
      }

      function placementIsValid(vehicle,direction) {
        const cells=occupiedCells(vehicle,direction);
        if(cells.some(cell=>cell.x<1||cell.x>LEVEL.width||cell.y<1||cell.y>LEVEL.height)) return false;
        return !activeVehicles().some(other=>other.id!==vehicle.id&&occupiedCells(other).some(otherCell=>cells.some(cell=>cell.x===otherCell.x&&cell.y===otherCell.y)));
      }

      function vehicleMarkup(vehicle,place='board') {
        const color=COLORS[vehicle.color];
        const horizontal=vehicle.direction==='left'||vehicle.direction==='right';
        const selected=vehicle.id===game.selectedId?' is-selected':'';
        const blocked=vehicle.id===game.blockedId?' is-blocked':'';
        const moving=vehicle.status==='departing'?' is-departing':'';
        const tilt=((vehicle.id.charCodeAt(0)+vehicle.id.length)%5-2)*3;
        const boardingCount=place==='slot'&&game.boardingVehicleId===vehicle.id?Math.min(3,game.boardingCount):0;
        const boarding=boardingCount?`<span class="boarding-people" aria-hidden="true">${Array.from({length:boardingCount},()=>`<img class="boarding-person person-${vehicle.color}" src="assets/parking-pulse-person.png" alt="">`).join('')}</span>`:'';
        const style=place==='board'?`grid-column:${vehicle.x}/span ${horizontal?vehicle.length:1};grid-row:${vehicle.y}/span ${horizontal?1:vehicle.length};--vehicle-color:${color.hex};--tilt:${tilt}deg;`:`--vehicle-color:${color.hex};--tilt:${tilt}deg;`;
        const common=`class="vehicle ${horizontal?'horizontal':'vertical'} color-${vehicle.color} dir-${vehicle.direction}${selected}${blocked}${moving}" style="${style}" data-vehicle-id="${vehicle.id}"`;
        const contents=`<img class="bus-sprite" src="assets/parking-pulse-bus.png" alt=""><span class="arrow" aria-hidden="true">${DIRS[vehicle.direction]}</span>${boarding}<span class="capacity">${vehicle.load}/${vehicle.capacity}</span>`;
        if(place==='slot') return `<div ${common} role="img" aria-label="${color.label}候车车辆，已载 ${vehicle.load} 人，容量 ${vehicle.capacity} 人">${contents}</div>`;
        const route=canMove(vehicle).ok?'路线畅通':'前方受阻';
        return `<button ${common} type="button" aria-label="第 ${vehicle.y} 行第 ${vehicle.x} 列，${color.label}车辆，${DIRS[vehicle.direction]}方向，容量 ${vehicle.capacity} 人，${route}">${contents}</button>`;
      }

      function renderQueue() {
        const people=game.passengers.flatMap(group=>Array.from({length:group.count},()=>group.color));
        els.queue.innerHTML=people.length?people.map((color,index)=>`<span class="queue-person person-${color}" style="--person-color:${COLORS[color].hex};--person-index:${index}" aria-hidden="true"><img src="assets/parking-pulse-person.png" alt=""></span>`).join(''):'<span class="empty-queue">乘客全部上车啦！</span>';
        const head=game.passengers[0];
        els.queue.setAttribute('aria-label',head?`乘客队列，当前 ${COLORS[head.color].label}，共剩余 ${passengerTotal()} 人`:'乘客已经全部上车');
        els.remaining.textContent=`剩余 ${passengerTotal()} 人`;
      }

      function renderSlots() {
        els.slots.innerHTML=game.slots.map((vehicleId,index)=>{
          const vehicle=vehicleId?getVehicle(vehicleId):null;
          return `<div class="slot${vehicle?' is-filled':''}" aria-label="接客位 ${index+1}${vehicle?' 已占用':' 空闲'}">${vehicle?vehicleMarkup(vehicle,'slot'):`空位 ${index+1}`}</div>`;
        }).join('');
      }

      function renderBoard() {
        els.board.innerHTML=activeVehicles().map(vehicle=>vehicleMarkup(vehicle)).join('');
        els.board.querySelectorAll('[data-vehicle-id]').forEach(button=>button.addEventListener('click',()=>handleVehicleClick(button.dataset.vehicleId)));
      }

      function renderTools() {
        const toolLabels={sort:'重排乘客队列',remove:'移除车辆',refresh:'调头车辆'};
        ['sort','remove','refresh'].forEach(name=>{
          const button=document.querySelector(`[data-tool="${name}"]`);
          button.querySelector('.tool-count').textContent=`×${game.tools[name]}`;
          button.setAttribute('aria-label',`${toolLabels[name]}，剩余 ${game.tools[name]} 次${game.toolMode===name?'，选择模式已开启':''}`);
          button.classList.toggle('is-active',game.toolMode===name);
          button.disabled=game.tools[name]<=0||game.resolving||Boolean(game.result);
        });
        els.reset.disabled=game.resolving;
      }

      function renderResult() {
        if(game.result) {
          els.resultIcon.textContent=game.result==='win'?'🎉':'🚌';
          els.resultTitle.textContent=game.result==='win'?'出站成功！':game.resultReason==='full'?'车位被占满了':'没有可用路线了';
          els.resultCopy.textContent=game.result==='win'?`你用了 ${game.moves} 次操作，把所有乘客都送到了目的地。`:'当前已经没有能够推进局面的操作，重新安排顺序再试一次吧。';
          if(els.modal.hidden) {
            els.modal.hidden=false;
            els.main.inert=true;
            els.main.setAttribute('aria-hidden','true');
            window.requestAnimationFrame(()=>els.resultButton.focus());
          }
        } else if(!els.modal.hidden) {
          els.modal.hidden=true;
          els.main.inert=false;
          els.main.removeAttribute('aria-hidden');
        }
      }

      function render(focusVehicleId=null,focusToolName=null) {
        renderQueue();
        renderSlots();
        renderBoard();
        renderTools();
        els.status.textContent=game.message;
        els.moves.textContent=`${game.moves} 次操作`;
        renderResult();
        if(!game.result&&focusVehicleId) window.requestAnimationFrame(()=>els.board.querySelector(`[data-vehicle-id="${focusVehicleId}"]`)?.focus({preventScroll:true}));
        if(!game.result&&focusToolName) window.requestAnimationFrame(()=>document.querySelector(`[data-tool="${focusToolName}"]`)?.focus({preventScroll:true}));
      }

      function loadPassengers(vehicle) {
        const before=vehicle.load;
        while(vehicle.load<vehicle.capacity&&game.passengers.length&&game.passengers[0].color===vehicle.color) {
          const group=game.passengers[0];
          const boarding=Math.min(vehicle.capacity-vehicle.load,group.count);
          vehicle.load+=boarding;
          group.count-=boarding;
          if(group.count===0) game.passengers.shift();
        }
        return vehicle.load-before;
      }

      function firstOpenSlot() { return game.slots.findIndex(slot=>slot===null); }

      function resolveBoarding() {
        if(!game||game.result) return;
        const headColor=game.passengers[0]?.color;
        const vehicle=parkedVehicles().find(candidate=>candidate.color===headColor&&candidate.load<candidate.capacity);
        if(!vehicle) {
          game.boardingVehicleId=null;
          game.boardingCount=0;
          game.resolving=false;
          checkResult();
          render();
          return;
        }
        const boarded=loadPassengers(vehicle);
        game.boardingVehicleId=vehicle.id;
        game.boardingCount=boarded;
        game.message=`${COLORS[vehicle.color].label}车辆接到 ${boarded} 位乘客`;
        render();
        later(()=>{
          game.boardingVehicleId=null;
          game.boardingCount=0;
          if(vehicle.load>=vehicle.capacity) {
            game.slots[vehicle.slot]=null;
            vehicle.status='departed';
            vehicle.slot=null;
            game.message=`${COLORS[vehicle.color].label}车辆满员出站，车位空出来了`;
            render();
            later(resolveBoarding,180);
          } else {
            render();
            later(resolveBoarding,100);
          }
        },620);
      }

      function moveVehicle(id) {
        if(game.resolving||game.result) return;
        const vehicle=getVehicle(id);
        if(!vehicle||vehicle.status!=='active') return;
        game.selectedId=id;
        const check=canMove(vehicle);
        if(!check.ok) {
          game.blockedId=id;
          game.message=check.reason;
          render(id);
          later(()=>{game.blockedId=null;render(id);},360);
          return;
        }
        const slot=firstOpenSlot();
        if(slot<0) {
          game.message='接客位已满，试试重排乘客队列';
          checkResult();
          render(id);
          return;
        }
        game.resolving=true;
        game.moves+=1;
        vehicle.status='departing';
        game.message=`${COLORS[vehicle.color].label}车辆驶向接客位…`;
        render();
        later(()=>{
          vehicle.status='parked';
          vehicle.slot=slot;
          game.slots[slot]=vehicle.id;
          game.selectedId=null;
          const headMatches=game.passengers[0]?.color===vehicle.color;
          game.message=headMatches?`${COLORS[vehicle.color].label}车辆准备接客`:'颜色不匹配，车辆先在接客位等待';
          render();
          later(resolveBoarding,headMatches?80:180);
        },420);
      }

      function removeVehicle(vehicle) {
        if(!vehicle||vehicle.status!=='active'||game.tools.remove<=0) return;
        vehicle.status='removed';
        game.tools.remove-=1;
        game.selectedId=null;
        game.toolMode=null;
        game.message='障碍车辆已移除，路线打开了';
        checkResult();
        render(null,'remove');
      }

      function turnVehicle(vehicle) {
        if(!vehicle||vehicle.status!=='active'||game.tools.refresh<=0) return;
        const start=directionOrder.indexOf(vehicle.direction);
        let nextDirection=null;
        for(let step=1;step<directionOrder.length;step+=1) {
          const candidate=directionOrder[(start+step)%directionOrder.length];
          if(placementIsValid(vehicle,candidate)) { nextDirection=candidate;break; }
        }
        game.toolMode=null;
        if(!nextDirection) {
          game.message='这辆车周围空间不足，无法安全调头';
          render(vehicle.id,'refresh');
          return;
        }
        vehicle.direction=nextDirection;
        game.tools.refresh-=1;
        game.selectedId=vehicle.id;
        game.message=`${COLORS[vehicle.color].label}车辆已调头为 ${DIRS[nextDirection]} 方向`;
        checkResult();
        render(vehicle.id,'refresh');
      }

      function handleVehicleClick(id) {
        const vehicle=getVehicle(id);
        if(!vehicle||game.resolving||game.result) return;
        game.selectedId=id;
        if(game.toolMode==='remove') { removeVehicle(vehicle);return; }
        if(game.toolMode==='refresh') { turnVehicle(vehicle);return; }
        moveVehicle(id);
      }

      function sortPassengers() {
        const waiting=parkedVehicles().find(vehicle=>game.passengers.slice(1).some(group=>group.color===vehicle.color));
        const activeMatch=activeVehicles().find(vehicle=>vehicle.color===game.passengers[0]?.color&&canMove(vehicle).ok);
        const movable=activeVehicles().find(vehicle=>canMove(vehicle).ok);
        const candidate=waiting||activeMatch||movable;
        const index=candidate?game.passengers.findIndex(group=>group.color===candidate.color):-1;
        if(index<=0) {
          game.message=index===0?'当前队首已经是最合适的颜色':'现在没有可重排的有效颜色';
          render(null,'sort');
          return;
        }
        game.passengers.unshift(game.passengers.splice(index,1)[0]);
        game.tools.sort-=1;
        game.toolMode=null;
        game.resolving=true;
        game.message=`${COLORS[candidate.color].label}乘客已排到队首`;
        render(null,'sort');
        later(resolveBoarding,220);
      }

      function useTool(name) {
        if(game.resolving||game.result||game.tools[name]<=0) return;
        if(name==='sort') { sortPassengers();return; }
        if(game.toolMode===name) {
          game.toolMode=null;
          game.selectedId=null;
          game.message='已取消道具选择';
          render(null,name);
          return;
        }
        const selected=getVehicle(game.selectedId);
        if(selected?.status==='active') {
          if(name==='remove') removeVehicle(selected);
          else turnVehicle(selected);
          return;
        }
        game.toolMode=name;
        game.selectedId=null;
        game.message=name==='remove'?'请选择一辆要移除的车，再点一次道具可取消':'请选择一辆要调头的车，再点一次道具可取消';
        render(null,name);
      }

      function hasUsefulSort() {
        if(game.tools.sort<=0) return false;
        return parkedVehicles().some(vehicle=>game.passengers.slice(1).some(group=>group.color===vehicle.color));
      }

      function checkResult() {
        if(game.resolving||game.result) return;
        if(passengerTotal()===0) {
          game.result='win';
          game.resultReason='complete';
          game.message='全部乘客都到站了！';
          return;
        }
        const active=activeVehicles();
        const occupied=game.slots.every(Boolean);
        const movable=active.some(vehicle=>canMove(vehicle).ok);
        const sortCanHelp=hasUsefulSort();
        const boardToolCanHelp=!occupied&&active.length>0&&(game.tools.remove>0||game.tools.refresh>0);
        if(occupied&&!sortCanHelp) {
          game.result='lose';
          game.resultReason='full';
          game.message='接客位已满，没有车辆能够继续装客';
        } else if(!occupied&&!movable&&!sortCanHelp&&!boardToolCanHelp) {
          game.result='lose';
          game.resultReason='blocked';
          game.message='没有可用路线了';
        } else if(occupied&&sortCanHelp) {
          game.message='接客位已满，重排队列可以继续装客';
        } else if(!movable&&boardToolCanHelp) {
          game.message='暂时没有直达路线，可以使用移除或调头';
        }
      }

      function reset(focusBoard=false) {
        clearTimers();
        els.main.inert=false;
        els.main.removeAttribute('aria-hidden');
        els.modal.hidden=true;
        game=createLevel();
        render();
        if(focusBoard) window.requestAnimationFrame(()=>els.board.querySelector('.vehicle')?.focus({preventScroll:true}));
      }

      document.querySelectorAll('[data-tool]').forEach(button=>button.addEventListener('click',()=>useTool(button.dataset.tool)));
      els.reset.addEventListener('click',()=>reset(true));
      els.resultButton.addEventListener('click',()=>reset(true));
      els.modal.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();reset(true);}});
      reset();
      window.ParkingPulse={createLevel,canMove,moveVehicle,useTool,reset,getState:()=>game};
    })();
  </script>
