<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="description" content="为 Word 逐字生成拼音 EQ 域代码，支持声调符号、声调数字、逐字校验和 TXT 导出。">
  <title>EQ 单字拼音域代码生成器 · 工具箱</title>
  <link rel="stylesheet" href="../../assets/toolbox.css?v=20261119searchnav">
  <link rel="stylesheet" href="eq-pinyin-code.css?v=20261124">
  <script defer src="vendor/pinyin-pro-3.27.0/dist/index.js"></script>
  <script defer src="scripts/eq-pinyin-code.js?v=20261124"></script>
</head>
<body class="toolbox-page">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <aside class="toolbox-sidebar" aria-label="边栏目录">
    <a class="sidebar-brand" href="../../index.html" aria-label="工具箱首页"><img src="../../assets/ubuntu/icons/tools.svg" alt="" width="30" height="30"><span>工具箱</span></a>
    <nav class="sidebar-nav" aria-label="栏目目录">
      <a href="../../index.html"><img src="../../assets/ubuntu/icons/house-door-fill.svg" alt="" width="21" height="21"><span>首页</span></a>
      <a href="../../tools.html?category=document"><img src="../../assets/ubuntu/icons/folder-fill.svg" alt="" width="22" height="22"><span>文档办公</span></a>
      <a href="eq-pinyin-code.html" aria-current="page"><img src="../../assets/ubuntu/icons/journal-text.svg" alt="" width="22" height="22"><span>EQ 拼音</span></a>
    </nav>
  </aside>
  <header class="toolbox-header">
    <div class="toolbox-container toolbox-header-inner">
      <span class="toolbox-breadcrumb"><a href="../../index.html">首页</a> / EQ 拼音</span>
      <a class="toolbox-header-link" href="https://github.com/phdsx">GitHub</a>
    </div>
  </header>

  <main class="toolbox-container eq-main" id="main" tabindex="-1">
    <header class="eq-heading">
      <h1>EQ 单字拼音域代码生成器</h1>
      <p>输入中文，为 Word 中的每个汉字生成一行独立的拼音域代码。</p>
    </header>
    <noscript><p class="eq-note">启用 JavaScript 后即可生成拼音域代码。</p></noscript>

    <div class="eq-grid">
      <section class="eq-panel" aria-labelledby="eq-source-title">
        <h2 id="eq-source-title"><label for="eq-source">输入文本</label></h2>
        <form id="eq-form">
          <textarea id="eq-source" lang="zh-CN" spellcheck="false" placeholder="输入或粘贴文本，支持多行"></textarea>
          <div class="eq-actions">
            <button class="eq-button eq-button--primary" type="submit">生成并校验</button>
            <button class="eq-button" id="eq-sample" type="button">填入示例</button>
            <button class="eq-button" id="eq-clear" type="button">清空</button>
          </div>
          <p id="eq-status" class="eq-status" role="status"></p>
        </form>
      </section>

      <section class="eq-panel" aria-labelledby="eq-settings-title">
        <h2 id="eq-settings-title">生成参数</h2>
        <div class="eq-settings">
          <label>拼音声调
            <select id="eq-tone-type">
              <option value="symbol">调号 shì</option>
              <option value="num">数字 shi4</option>
              <option value="none">无声调 shi</option>
            </select>
          </label>
          <label>非汉字处理
            <select id="eq-non-zh">
              <option value="remove">删除非汉字</option>
              <option value="keep">保留并生成</option>
            </select>
          </label>
          <label>下移值（do）
            <input id="eq-down-value" type="number" value="38" inputmode="numeric">
          </label>
          <label>占位符
            <input id="eq-placeholder" value="$" spellcheck="false">
          </label>
        </div>
        <p class="eq-note">域代码示例 <code>EQ \o(\l(shì),\s\do38($))</code></p>
      </section>

      <section class="eq-panel eq-panel--wide" aria-labelledby="eq-review-title">
        <div class="eq-panel-heading">
          <h2 id="eq-review-title">逐字校验</h2>
          <span id="eq-count" hidden></span>
        </div>
        <div id="eq-review" class="eq-table-wrap" role="region" aria-labelledby="eq-review-title" tabindex="0" hidden>
          <table class="eq-table" role="table">
            <thead role="rowgroup">
              <tr role="row">
                <th scope="col">序号</th>
                <th scope="col">字符</th>
                <th scope="col">拼音</th>
                <th scope="col">修改声调</th>
                <th scope="col">域代码</th>
                <th scope="col">操作</th>
              </tr>
            </thead>
            <tbody id="eq-review-body" role="rowgroup"></tbody>
          </table>
        </div>
        <p id="eq-empty" class="eq-empty">生成后可在这里修改拼音和声调。</p>
        <div class="eq-actions" id="eq-review-actions" hidden>
          <button class="eq-button" id="eq-refresh" type="button">刷新代码</button>
          <button class="eq-button" id="eq-copy-all" type="button">复制全部代码</button>
          <span id="eq-review-status" class="eq-status" role="status"></span>
        </div>
      </section>

      <section class="eq-panel eq-panel--wide" aria-labelledby="eq-output-title">
        <h2 id="eq-output-title"><label for="eq-output">最终结果</label></h2>
        <textarea id="eq-output" spellcheck="false" placeholder="域代码将在这里显示，每个公式一行"></textarea>
        <div class="eq-actions">
          <button class="eq-button eq-button--primary" id="eq-copy-output" type="button">复制最终结果</button>
          <button class="eq-button" id="eq-download" type="button">导出 TXT</button>
          <span id="eq-output-status" class="eq-status" role="status"></span>
        </div>
        <p class="eq-note">在桌面版 Word 中，按 <kbd>Ctrl</kbd> + <kbd>F9</kbd> 插入域括号，粘贴一行代码，再按 <kbd>F9</kbd> 更新域。</p>
      </section>
    </div>
  </main>
  <footer class="toolbox-container toolbox-footer"><span>© 2026 PHDSX · EQ 拼音</span><a href="#main">返回顶部 ↑</a></footer>

  <template id="eq-row-template">
    <tr role="row">
      <td class="eq-row-number" role="cell"></td>
      <td class="eq-row-char" role="cell"><label><span>字符</span><input class="eq-char-edit" spellcheck="false"></label></td>
      <td class="eq-row-pinyin" role="cell"><label><span>拼音</span><input class="eq-pinyin-edit" spellcheck="false" placeholder="填写拼音"></label></td>
      <td class="eq-row-tone" role="cell">
        <label><span>修改声调</span>
          <select class="eq-tone-edit">
            <option value="">选择声调</option>
            <option value="1">一声</option>
            <option value="2">二声</option>
            <option value="3">三声</option>
            <option value="4">四声</option>
            <option value="0">轻声</option>
          </select>
        </label>
      </td>
      <td class="eq-row-code" role="cell"><code></code></td>
      <td class="eq-row-delete" role="cell"><button class="eq-button eq-button--danger" type="button">删除</button></td>
    </tr>
  </template>
</body>
</html>
