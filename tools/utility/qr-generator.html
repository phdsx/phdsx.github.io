  <style>
    :root {
      --qr-bg: #f4f7fb;
      --qr-panel: #fff;
      --qr-ink: #101828;
      --qr-muted: #667085;
      --qr-line: #dfe6ee;
      --qr-brand: #1769e0;
      --qr-danger: #c93636;
    }
    body.qr-page {
      margin: 0;
      min-height: 100vh;
      background: var(--qr-bg);
      color: var(--qr-ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .qr-main { width: min(100%, 1120px); margin: 0 auto; padding: 42px 28px; }
    .qr-heading { margin-bottom: 24px; }
    .qr-heading span { color: var(--qr-brand); font-size: 11px; font-weight: 800; letter-spacing: .12em; }
    .qr-heading h1 { margin: 9px 0 8px; font-size: clamp(28px, 4vw, 42px); line-height: 1.15; }
    .qr-heading p { margin: 0; color: var(--qr-muted); line-height: 1.7; }
    .qr-workspace { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(330px, .85fr); gap: 18px; align-items: start; }
    .qr-panel { padding: 22px; border: 1px solid var(--qr-line); border-radius: 8px; background: var(--qr-panel); box-shadow: 0 1px 2px rgba(16,24,40,.04); }
    .qr-tabs { display: inline-flex; gap: 4px; margin-bottom: 20px; padding: 4px; border: 1px solid var(--qr-line); border-radius: 7px; background: #f8fafc; }
    .qr-tab { min-width: 96px; min-height: 38px; padding: 0 15px; border: 0; border-radius: 6px; color: var(--qr-muted); background: transparent; font-weight: 700; cursor: pointer; }
    .qr-tab.active { color: #fff; background: var(--qr-brand); }
    .qr-field { display: grid; gap: 8px; margin-bottom: 17px; }
    .qr-field label, .qr-options-title { font-size: 13px; font-weight: 750; }
    .qr-field textarea, .qr-field select, .qr-file-box {
      width: 100%;
      border: 1px solid #c9d4e1;
      border-radius: 7px;
      color: var(--qr-ink);
      background: #fff;
    }
    .qr-field textarea { min-height: 178px; padding: 13px 14px; resize: vertical; line-height: 1.65; }
    .qr-field textarea:focus, .qr-field select:focus { border-color: var(--qr-brand); outline: 0; box-shadow: 0 0 0 4px rgba(23,105,224,.1); }
    .qr-field-meta { display: flex; justify-content: space-between; gap: 12px; color: var(--qr-muted); font-size: 11px; }
    .qr-file-box { display: grid; justify-items: center; gap: 8px; min-height: 178px; padding: 30px 20px; border-style: dashed; text-align: center; cursor: pointer; }
    .qr-file-box:hover { border-color: var(--qr-brand); background: #f8fbff; }
    .qr-file-box input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .qr-file-symbol { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 8px; color: var(--qr-brand); background: #eaf2ff; font-size: 23px; }
    .qr-file-box strong { font-size: 14px; }
    .qr-file-box small { color: var(--qr-muted); line-height: 1.55; }
    .qr-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--qr-line); }
    .qr-field select { min-height: 42px; padding: 0 11px; }
    .qr-color-row { display: grid; grid-template-columns: 44px 1fr; gap: 9px; align-items: center; }
    .qr-color-row input[type="color"] { width: 44px; height: 42px; padding: 3px; border: 1px solid var(--qr-line); border-radius: 7px; background: #fff; cursor: pointer; }
    .qr-color-row input[type="text"] { min-width: 0; height: 42px; padding: 0 10px; border: 1px solid var(--qr-line); border-radius: 7px; color: var(--qr-muted); background: #f8fafc; }
    .qr-logo-box { display: flex; align-items: center; gap: 10px; min-height: 42px; }
    .qr-logo-box input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .qr-logo-pick { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 0 13px; border: 1px dashed #aebdce; border-radius: 7px; color: var(--qr-brand); background: #f8fbff; font-size: 12px; font-weight: 750; cursor: pointer; }
    .qr-logo-name { min-width: 0; overflow: hidden; color: var(--qr-muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .qr-logo-remove { flex: 0 0 auto; border: 0; color: var(--qr-danger); background: transparent; font-size: 12px; cursor: pointer; }
    .qr-theme-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .qr-theme { min-height: 38px; padding: 0 6px; border: 1px solid var(--qr-line); border-radius: 7px; color: var(--qr-muted); background: #fff; font-size: 11px; font-weight: 700; cursor: pointer; }
    .qr-theme.active { border-color: var(--qr-brand); color: var(--qr-brand); background: #f2f7ff; box-shadow: 0 0 0 2px rgba(23,105,224,.08); }
    .qr-actions { display: flex; gap: 9px; margin-top: 4px; }
    .qr-button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 17px; border: 1px solid var(--qr-line); border-radius: 7px; color: var(--qr-ink); background: #fff; font-weight: 750; cursor: pointer; }
    .qr-button.primary { flex: 1; border-color: var(--qr-brand); color: #fff; background: var(--qr-brand); }
    .qr-button:hover { filter: brightness(.97); }
    .qr-error { margin: 13px 0 0; padding: 10px 12px; border: 1px solid #f1c4c4; border-radius: 7px; color: var(--qr-danger); background: #fff6f6; font-size: 12px; line-height: 1.5; }
    .qr-preview { position: sticky; top: 24px; }
    .qr-preview-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .qr-preview-head h2 { margin: 0; font-size: 17px; }
    .qr-status { color: var(--qr-muted); font-size: 11px; }
    .qr-capacity { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: -4px 0 14px; }
    .qr-capacity-item { padding: 9px 10px; border: 1px solid var(--qr-line); border-radius: 7px; background: #f8fafc; }
    .qr-capacity-item span { display: block; margin-bottom: 3px; color: var(--qr-muted); font-size: 10px; }
    .qr-capacity-item strong { font-size: 13px; font-variant-numeric: tabular-nums; }
    .qr-canvas-wrap { display: grid; place-items: center; min-height: 360px; padding: 24px; border: 1px solid var(--qr-line); border-radius: 8px; background-color: #eef3f8; background-image: linear-gradient(45deg,#e4eaf1 25%,transparent 25%),linear-gradient(-45deg,#e4eaf1 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e4eaf1 75%),linear-gradient(-45deg,transparent 75%,#e4eaf1 75%); background-position: 0 0,0 8px,8px -8px,-8px 0; background-size: 16px 16px; }
    #qrcode { display: grid; place-items: center; padding: 14px; background: #fff; box-shadow: 0 12px 30px rgba(16,24,40,.12); }
    #qrcode img, #qrcode canvas { display: block; max-width: 100%; height: auto !important; }
    #qrcode canvas { border-radius: 2px; }
    .qr-preview-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 14px; }
    .qr-note { margin: 15px 0 0; color: var(--qr-muted); font-size: 11px; line-height: 1.65; }
    @media (max-width: 850px) {
      .qr-main { padding: 28px 18px; }
      .qr-workspace { grid-template-columns: 1fr; }
      .qr-preview { position: static; }
    }
    @media (max-width: 520px) {
      .qr-main { padding: 22px 12px; }
      .qr-panel { padding: 16px; }
      .qr-options { grid-template-columns: 1fr; }
      .qr-canvas-wrap { min-height: 300px; padding: 14px; }
      .qr-actions, .qr-preview-actions { grid-template-columns: 1fr; flex-wrap: wrap; }
      .qr-button { width: 100%; }
    }

<body class="qr-page">
  <main class="qr-main">
    <header class="qr-heading">
      <span>LOCAL QR GENERATOR</span>
      <h1>二维码生成</h1>
      <p>把文字、网址或小型文件转换成二维码。内容只在当前浏览器中处理。</p>
    </header>

    <div class="qr-workspace">
      <section class="qr-panel" aria-label="二维码内容设置">
        <div class="qr-tabs" role="tablist" aria-label="输入类型">
          <button class="qr-tab active" type="button" role="tab" aria-selected="true" data-mode="text">文字 / 网址</button>
          <button class="qr-tab" type="button" role="tab" aria-selected="false" data-mode="file">小型文件</button>
        </div>

        <div data-mode-panel="text">
          <div class="qr-field">
            <label for="qr-text">二维码内容</label>
            <textarea id="qr-text" placeholder="输入文字、网址、电话、邮箱等内容">https://phdsx.github.io/</textarea>
            <div class="qr-field-meta"><span>按实际编码容量检测，不限制字符数</span><span data-byte-count>0 字节</span></div>
          </div>
        </div>

        <div data-mode-panel="file" hidden>
          <label class="qr-file-box" for="qr-file">
            <input id="qr-file" type="file">
            <span class="qr-file-symbol">＋</span>
            <strong data-file-name>选择要编码的文件</strong>
            <small>最大 1.2 KB。文件会转换为 Data URL；编码后会比原文件稍大，但不会上传服务器。</small>
          </label>
        </div>

        <div class="qr-options">
          <div class="qr-field">
            <label for="qr-size">二维码尺寸</label>
            <select id="qr-size">
              <option value="240">240 × 240</option>
              <option value="320" selected>320 × 320</option>
              <option value="400">400 × 400</option>
            </select>
          </div>
          <div class="qr-field">
            <label for="qr-level">纠错等级</label>
            <select id="qr-level">
              <option value="L">低 · 容量更大</option>
              <option value="M" selected>中 · 推荐</option>
              <option value="Q">较高</option>
              <option value="H">高 · 容量较小</option>
            </select>
          </div>
          <div class="qr-field">
            <label for="qr-dark">前景色</label>
            <div class="qr-color-row"><input id="qr-dark" type="color" value="#101828"><input type="text" value="#101828" data-color-label="qr-dark" readonly></div>
          </div>
          <div class="qr-field">
            <label for="qr-light">背景色</label>
            <div class="qr-color-row"><input id="qr-light" type="color" value="#ffffff"><input type="text" value="#ffffff" data-color-label="qr-light" readonly></div>
          </div>
          <div class="qr-field">
            <label for="qr-style">点阵样式</label>
            <select id="qr-style">
              <option value="square">经典方块</option>
              <option value="rounded" selected>柔和圆角</option>
              <option value="dots">圆点</option>
            </select>
          </div>
          <div class="qr-field">
            <label for="qr-logo">中心 Logo</label>
            <div class="qr-logo-box">
              <label class="qr-logo-pick" for="qr-logo">上传图片</label>
              <input id="qr-logo" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
              <span class="qr-logo-name" id="qr-logo-name">未选择</span>
              <button class="qr-logo-remove" type="button" id="remove-logo" hidden>移除</button>
            </div>
          </div>
          <div class="qr-field" style="grid-column: 1 / -1">
            <span class="qr-options-title">主题</span>
            <div class="qr-theme-row" role="group" aria-label="二维码主题">
              <button class="qr-theme active" type="button" data-theme="classic" data-dark="#101828" data-light="#ffffff">经典</button>
              <button class="qr-theme" type="button" data-theme="ocean" data-dark="#075985" data-light="#f0f9ff">海洋</button>
              <button class="qr-theme" type="button" data-theme="forest" data-dark="#14532d" data-light="#f0fdf4">森林</button>
              <button class="qr-theme" type="button" data-theme="plum" data-dark="#581c87" data-light="#faf5ff">梅紫</button>
            </div>
          </div>
        </div>

        <div class="qr-actions">
          <button class="qr-button primary" type="button" id="generate-qr">生成二维码</button>
          <button class="qr-button" type="button" id="clear-qr">清空</button>
        </div>
        <p class="qr-error" id="qr-error" role="alert" hidden></p>
      </section>

      <aside class="qr-panel qr-preview" aria-label="二维码预览">
        <div class="qr-preview-head"><h2>预览</h2><span class="qr-status" id="qr-status">等待生成</span></div>
        <div class="qr-capacity" aria-label="二维码容量">
          <div class="qr-capacity-item"><span>已占用</span><strong id="qr-capacity-used">—</strong></div>
          <div class="qr-capacity-item"><span>剩余</span><strong id="qr-capacity-remaining">—</strong></div>
          <div class="qr-capacity-item"><span>总容量</span><strong id="qr-capacity-total">—</strong></div>
        </div>
        <div class="qr-canvas-wrap"><div id="qrcode" aria-label="生成的二维码"></div></div>
        <div class="qr-preview-actions">
          <button class="qr-button" type="button" id="download-qr" disabled>下载 PNG</button>
          <button class="qr-button" type="button" id="copy-content" disabled>复制内容</button>
        </div>
        <p class="qr-note">二维码适合承载短文本和链接。文件模式只适用于极小文件，普通图片、视频和文档通常应先上传到可访问的位置，再把下载链接生成二维码。</p>
      </aside>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const MAX_FILE_BYTES = 1200;
      const QR_BYTE_CAPACITY = [
        [17,14,11,7],[32,26,20,14],[53,42,32,24],[78,62,46,34],[106,84,60,44],
        [134,106,74,58],[154,122,86,64],[192,152,108,84],[230,180,130,98],[271,213,151,119],
        [321,251,177,137],[367,287,203,155],[425,331,241,177],[458,362,258,194],[520,412,292,220],
        [586,450,322,250],[644,504,364,280],[718,560,394,310],[792,624,442,338],[858,666,482,382],
        [929,711,509,403],[1003,779,565,439],[1091,857,611,461],[1171,911,661,511],[1273,997,715,535],
        [1367,1059,751,593],[1465,1125,805,625],[1528,1190,868,658],[1628,1264,908,698],[1732,1370,982,742],
        [1840,1452,1030,790],[1952,1538,1112,842],[2068,1628,1168,898],[2188,1722,1228,958],[2303,1809,1283,983],
        [2431,1911,1351,1051],[2563,1989,1423,1093],[2699,2099,1499,1139],[2809,2213,1579,1219],[2953,2331,1663,1273]
      ];
      const textInput = document.getElementById('qr-text');
      const fileInput = document.getElementById('qr-file');
      const output = document.getElementById('qrcode');
      const error = document.getElementById('qr-error');
      const status = document.getElementById('qr-status');
      const capacityUsed = document.getElementById('qr-capacity-used');
      const capacityRemaining = document.getElementById('qr-capacity-remaining');
      const capacityTotal = document.getElementById('qr-capacity-total');
      const generateButton = document.getElementById('generate-qr');
      const downloadButton = document.getElementById('download-qr');
      const copyButton = document.getElementById('copy-content');
      const byteCount = document.querySelector('[data-byte-count]');
      const fileName = document.querySelector('[data-file-name]');
      const logoInput = document.getElementById('qr-logo');
      const logoName = document.getElementById('qr-logo-name');
      const removeLogoButton = document.getElementById('remove-logo');
      let mode = 'text';
      let payload = '';
      let filePayload = '';
      let logoImage = null;
      let renderTimer = 0;

      function bytes(value) {
        return new TextEncoder().encode(value || '').length;
      }

      function qrEncodedBytes(value) {
        const bodyLength = bytes(value);
        return bodyLength + (bodyLength !== Array.from(value).length ? 3 : 0);
      }

      function formatBytes(value) {
        return Number(value).toLocaleString('zh-CN') + ' B';
      }

      function updateCapacity(matrix, usedBytes) {
        const level = document.getElementById('qr-level').value;
        const levelIndex = { L: 0, M: 1, Q: 2, H: 3 }[level];
        const version = matrix ? (matrix.getModuleCount() - 17) / 4 : 40;
        const total = QR_BYTE_CAPACITY[version - 1][levelIndex];
        capacityUsed.textContent = formatBytes(usedBytes);
        capacityRemaining.textContent = formatBytes(Math.max(0, total - usedBytes));
        capacityTotal.textContent = formatBytes(total);
        return version;
      }

      function resetCapacity() {
        capacityUsed.textContent = '—';
        capacityRemaining.textContent = '—';
        capacityTotal.textContent = '—';
      }

      function updateByteCount() {
        const value = textInput.value;
        byteCount.textContent = Array.from(value).length + ' 字符 · ' + bytes(value) + ' 字节';
      }

      function showError(message) {
        error.textContent = message;
        error.hidden = !message;
      }

      function setMode(nextMode) {
        mode = nextMode;
        document.querySelectorAll('[data-mode]').forEach(function (tab) {
          const active = tab.dataset.mode === mode;
          tab.classList.toggle('active', active);
          tab.setAttribute('aria-selected', String(active));
        });
        document.querySelectorAll('[data-mode-panel]').forEach(function (panel) {
          panel.hidden = panel.dataset.modePanel !== mode;
        });
        showError('');
      }

      function levelValue() {
        return {
          L: QRCode.CorrectLevel.L,
          M: QRCode.CorrectLevel.M,
          Q: QRCode.CorrectLevel.Q,
          H: QRCode.CorrectLevel.H
        }[document.getElementById('qr-level').value];
      }

      function roundRect(context, x, y, width, height, radius) {
        const safeRadius = Math.min(radius, width / 2, height / 2);
        context.beginPath();
        context.roundRect(x, y, width, height, safeRadius);
        context.fill();
      }

      function isFinder(row, column, count) {
        return (row < 7 && column < 7) ||
          (row < 7 && column >= count - 7) ||
          (row >= count - 7 && column < 7);
      }

      function drawFinder(context, column, row, unit, quiet, dark, light, style) {
        const x = (quiet + column) * unit;
        const y = (quiet + row) * unit;
        const radius = style === 'square' ? 0 : unit * 1.25;
        context.fillStyle = dark;
        roundRect(context, x, y, unit * 7, unit * 7, radius);
        context.fillStyle = light;
        roundRect(context, x + unit, y + unit, unit * 5, unit * 5, Math.max(0, radius - unit * .25));
        context.fillStyle = dark;
        roundRect(context, x + unit * 2, y + unit * 2, unit * 3, unit * 3, style === 'dots' ? unit * 1.5 : Math.max(0, radius - unit * .5));
      }

      function paintMatrix(matrix, size) {
        const count = matrix.getModuleCount();
        const quiet = 4;
        const unit = size / (count + quiet * 2);
        const dark = document.getElementById('qr-dark').value;
        const light = document.getElementById('qr-light').value;
        const style = document.getElementById('qr-style').value;
        const canvas = document.createElement('canvas');
        const ratio = Math.max(1, window.devicePixelRatio || 1);
        canvas.width = Math.round(size * ratio);
        canvas.height = Math.round(size * ratio);
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
        const context = canvas.getContext('2d');
        context.scale(ratio, ratio);
        context.fillStyle = light;
        context.fillRect(0, 0, size, size);
        context.fillStyle = dark;

        for (let row = 0; row < count; row += 1) {
          for (let column = 0; column < count; column += 1) {
            if (!matrix.isDark(row, column) || isFinder(row, column, count)) continue;
            const x = (quiet + column) * unit;
            const y = (quiet + row) * unit;
            if (style === 'square') {
              context.fillRect(x, y, unit + .25, unit + .25);
            } else {
              const inset = style === 'dots' ? unit * .12 : unit * .045;
              const radius = style === 'dots' ? unit / 2 : unit * .28;
              roundRect(context, x + inset, y + inset, unit - inset * 2, unit - inset * 2, radius);
            }
          }
        }

        drawFinder(context, 0, 0, unit, quiet, dark, light, style);
        drawFinder(context, count - 7, 0, unit, quiet, dark, light, style);
        drawFinder(context, 0, count - 7, unit, quiet, dark, light, style);

        if (logoImage) {
          const logoSize = size * .19;
          const padding = unit * 1.1;
          const x = (size - logoSize) / 2;
          const y = (size - logoSize) / 2;
          context.fillStyle = light;
          roundRect(context, x - padding, y - padding, logoSize + padding * 2, logoSize + padding * 2, unit * 1.2);
          context.save();
          context.beginPath();
          context.roundRect(x, y, logoSize, logoSize, unit * .8);
          context.clip();
          context.drawImage(logoImage, x, y, logoSize, logoSize);
          context.restore();
        }
        output.replaceChildren(canvas);
      }

      function scheduleRender() {
        window.clearTimeout(renderTimer);
        renderTimer = window.setTimeout(renderCode, 120);
      }

      function encodePayload(value) {
        const codePoints = Array.from(value, function (character) { return character.codePointAt(0); });
        const unicodePayload = {
          length: codePoints.length,
          charCodeAt: function (index) { return codePoints[index]; },
          toString: function () { return value; }
        };
        const scratch = document.createElement('div');
        const encoder = new QRCode(scratch, {
          width: 32,
          height: 32,
          correctLevel: levelValue()
        });
        // 旧库按 UTF-16 码元拆分 Emoji；以 Unicode 码点适配器传入可得到标准 UTF-8。
        encoder.makeCode(unicodePayload);
        return encoder;
      }

      function renderCode() {
        if (typeof QRCode === 'undefined') {
          showError('二维码组件加载失败，请检查网络连接后刷新页面。');
          return;
        }
        payload = mode === 'file' ? filePayload : textInput.value.trim();
        if (!payload) {
          showError(mode === 'file' ? '请先选择一个小型文件。' : '请输入要生成二维码的内容。');
          resetCapacity();
          return;
        }
        showError('');
        const size = Number(document.getElementById('qr-size').value);
        const usedBytes = qrEncodedBytes(payload);
        try {
          const encoder = encodePayload(payload);
          paintMatrix(encoder._oQRCode, size);
          const version = updateCapacity(encoder._oQRCode, usedBytes);
          status.textContent = '版本 V' + version + ' · 实时预览';
          downloadButton.disabled = false;
          copyButton.disabled = false;
        } catch (exception) {
          output.replaceChildren();
          updateCapacity(null, usedBytes);
          status.textContent = '超出最大容量';
          downloadButton.disabled = true;
          copyButton.disabled = true;
          showError('当前内容在“' + document.getElementById('qr-level').selectedOptions[0].textContent + '”纠错等级下无法编码。请降低纠错等级或缩短内容。');
        }
      }

      document.querySelectorAll('[data-mode]').forEach(function (tab) {
        tab.addEventListener('click', function () {
          setMode(tab.dataset.mode);
          scheduleRender();
        });
      });

      textInput.addEventListener('input', function () {
        updateByteCount();
        if (mode === 'text') scheduleRender();
      });
      fileInput.addEventListener('change', function () {
        const file = fileInput.files && fileInput.files[0];
        filePayload = '';
        if (!file) {
          fileName.textContent = '选择要编码的文件';
          return;
        }
        if (file.size > MAX_FILE_BYTES) {
          fileInput.value = '';
          fileName.textContent = '选择要编码的文件';
          showError('文件为 ' + file.size + ' 字节，超过 1.2 KB 限制。建议上传文件后生成下载链接二维码。');
          return;
        }
        const reader = new FileReader();
        reader.onload = function () {
          filePayload = reader.result;
          fileName.textContent = file.name + ' · ' + file.size + ' 字节';
          showError('');
          scheduleRender();
        };
        reader.onerror = function () { showError('文件读取失败，请重新选择。'); };
        reader.readAsDataURL(file);
      });

      document.querySelectorAll('input[type="color"]').forEach(function (input) {
        input.addEventListener('input', function () {
          document.querySelector('[data-color-label="' + input.id + '"]').value = input.value;
          document.querySelectorAll('[data-theme]').forEach(function (theme) {
            const active = theme.dataset.dark === document.getElementById('qr-dark').value &&
              theme.dataset.light === document.getElementById('qr-light').value;
            theme.classList.toggle('active', active);
          });
          scheduleRender();
        });
      });

      document.querySelectorAll('[data-theme]').forEach(function (theme) {
        theme.addEventListener('click', function () {
          const darkInput = document.getElementById('qr-dark');
          const lightInput = document.getElementById('qr-light');
          darkInput.value = theme.dataset.dark;
          lightInput.value = theme.dataset.light;
          document.querySelector('[data-color-label="qr-dark"]').value = theme.dataset.dark;
          document.querySelector('[data-color-label="qr-light"]').value = theme.dataset.light;
          document.querySelectorAll('[data-theme]').forEach(function (item) {
            item.classList.toggle('active', item === theme);
          });
          scheduleRender();
        });
      });

      ['qr-size', 'qr-level', 'qr-style'].forEach(function (id) {
        document.getElementById(id).addEventListener('change', scheduleRender);
      });

      logoInput.addEventListener('change', function () {
        const file = logoInput.files && logoInput.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          logoInput.value = '';
          showError('Logo 请选择 PNG、JPG、WebP 或 SVG 图片。');
          return;
        }
        if (file.size > 2 * 1024 * 1024) {
          logoInput.value = '';
          showError('Logo 图片不能超过 2 MB。');
          return;
        }
        const reader = new FileReader();
        reader.onload = function () {
          const image = new Image();
          image.onload = function () {
            logoImage = image;
            logoName.textContent = file.name;
            removeLogoButton.hidden = false;
            showError('');
            scheduleRender();
          };
          image.onerror = function () { showError('Logo 图片无法读取，请更换图片。'); };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

      removeLogoButton.addEventListener('click', function () {
        logoInput.value = '';
        logoImage = null;
        logoName.textContent = '未选择';
        removeLogoButton.hidden = true;
        scheduleRender();
      });

      generateButton.addEventListener('click', renderCode);
      document.getElementById('clear-qr').addEventListener('click', function () {
        textInput.value = '';
        fileInput.value = '';
        filePayload = '';
        payload = '';
        logoInput.value = '';
        logoImage = null;
        logoName.textContent = '未选择';
        removeLogoButton.hidden = true;
        fileName.textContent = '选择要编码的文件';
        output.replaceChildren();
        status.textContent = '等待生成';
        resetCapacity();
        downloadButton.disabled = true;
        copyButton.disabled = true;
        showError('');
        updateByteCount();
      });

      downloadButton.addEventListener('click', function () {
        const canvas = output.querySelector('canvas');
        const image = output.querySelector('img');
        const source = canvas ? canvas.toDataURL('image/png') : image && image.src;
        if (!source) return;
        const link = document.createElement('a');
        link.href = source;
        link.download = 'phdsx-qrcode.png';
        link.click();
      });

      copyButton.addEventListener('click', async function () {
        try {
          await navigator.clipboard.writeText(payload);
          copyButton.textContent = '已复制';
          setTimeout(function () { copyButton.textContent = '复制内容'; }, 1200);
        } catch (exception) {
          showError('浏览器未允许复制，请手动复制原始内容。');
        }
      });

      updateByteCount();
      renderCode();
    });
  </script>
</body>
</html>
