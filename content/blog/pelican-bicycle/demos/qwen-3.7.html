<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车动画</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        svg {
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 70%, #90EE90 70%, #90EE90 100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>鹈鹕骑自行车动画</h1>
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 背景 -->
            <rect x="0" y="0" width="800" height="500" fill="url(#bgGradient)" />
            
            <!-- 地面 -->
            <rect x="0" y="350" width="800" height="150" fill="#90EE90" />
            
            <!-- 道路 -->
            <rect x="0" y="380" width="800" height="40" fill="#666" />
            
            <!-- 道路标线 -->
            <line x1="0" y1="400" x2="800" y2="400" stroke="#FFF" stroke-width="2" stroke-dasharray="20,15" />
            
            <!-- 自行车 -->
            <g id="bicycle" transform="translate(250, 300)">
                <!-- 自行车框架 -->
                <path d="M50,100 L100,50 L150,100 L100,150 Z" fill="none" stroke="#333" stroke-width="4" />
                <line x1="100" y1="50" x2="100" y2="150" stroke="#333" stroke-width="4" />
                <line x1="50" y1="100" x2="150" y2="100" stroke="#333" stroke-width="4" />
                
                <!-- 车座 -->
                <ellipse cx="100" cy="30" rx="20" ry="10" fill="#8B4513" />
                
                <!-- 车把 -->
                <path d="M150,50 L180,30" stroke="#333" stroke-width="4" />
                <circle cx="180" cy="30" r="5" fill="#333" />
                
                <!-- 前轮 -->
                <circle cx="180" cy="150" r="40" fill="none" stroke="#333" stroke-width="4" />
                <circle cx="180" cy="150" r="5" fill="#333" />
                
                <!-- 后轮 -->
                <circle cx="20" cy="150" r="40" fill="none" stroke="#333" stroke-width="4" />
                <circle cx="20" cy="150" r="5" fill="#333" />
                
                <!-- 轮辐 -->
                <g id="spokes-front">
                    <line x1="180" y1="150" x2="180" y2="110" stroke="#333" stroke-width="2" />
                    <line x1="180" y1="150" x2="220" y2="150" stroke="#333" stroke-width="2" />
                    <line x1="180" y1="150" x2="180" y2="190" stroke="#333" stroke-width="2" />
                    <line x1="180" y1="150" x2="140" y2="150" stroke="#333" stroke-width="2" />
                </g>
                
                <g id="spokes-back">
                    <line x1="20" y1="150" x2="20" y2="110" stroke="#333" stroke-width="2" />
                    <line x1="20" y1="150" x2="60" y2="150" stroke="#333" stroke-width="2" />
                    <line x1="20" y1="150" x2="20" y2="190" stroke="#333" stroke-width="2" />
                    <line x1="20" y1="150" x2="-20" y2="150" stroke="#333" stroke-width="2" />
                </g>
                
                <!-- 踏板 -->
                <g id="pedals">
                    <circle cx="100" cy="150" r="10" fill="#333" />
                    <line x1="100" y1="150" x2="100" y2="180" stroke="#333" stroke-width="4" />
                    <rect x="90" y="180" width="20" height="10" fill="#333" />
                </g>
            </g>
            
            <!-- 鹈鹕 -->
            <g id="pelican" transform="translate(250, 200)">
                <!-- 身体 -->
                <ellipse cx="100" cy="100" rx="60" ry="40" fill="#FFF" />
                
                <!-- 头部 -->
                <circle cx="140" cy="70" r="30" fill="#FFF" />
                
                <!-- 眼睛 -->
                <circle cx="150" cy="65" r="5" fill="#000" />
                <circle cx="152" cy="63" r="2" fill="#FFF" />
                
                <!-- 喙 -->
                <path d="M170,70 L200,75 L190,85 L170,80 Z" fill="#FFA500" />
                <path d="M170,80 L190,85 L180,95 L160,90 Z" fill="#FF8C00" />
                
                <!-- 脖子 -->
                <path d="M120,90 Q130,80 140,70" fill="none" stroke="#FFF" stroke-width="20" />
                
                <!-- 翅膀 -->
                <path d="M80,100 Q60,80 100,60 Q120,80 100,100" fill="#FFF" stroke="#DDD" stroke-width="2" />
                
                <!-- 腿 -->
                <line x1="100" y1="140" x2="100" y2="180" stroke="#FFA500" stroke-width="8" />
                
                <!-- 脚 -->
                <path d="M90,180 L100,190 L110,180" fill="#FFA500" />
                
                <!-- 尾巴 -->
                <path d="M40,100 L20,90 L30,110 Z" fill="#FFF" />
            </g>
            
            <!-- 动画效果 -->
            <animateTransform 
                xlink:href="#bicycle" 
                attributeName="transform" 
                type="translate" 
                from="0,0" 
                to="800,0" 
                dur="10s" 
                repeatCount="indefinite" />
                
            <animateTransform 
                xlink:href="#pelican" 
                attributeName="transform" 
                type="translate" 
                from="0,0" 
                to="800,0" 
                dur="10s" 
                repeatCount="indefinite" />
                
            <!-- 轮子旋转动画 -->
            <animateTransform 
                xlink:href="#spokes-front" 
                attributeName="transform" 
                type="rotate" 
                from="0,180,150" 
                to="360,180,150" 
                dur="2s" 
                repeatCount="indefinite" />
                
            <animateTransform 
                xlink:href="#spokes-back" 
                attributeName="transform" 
                type="rotate" 
                from="0,20,150" 
                to="360,20,150" 
                dur="2s" 
                repeatCount="indefinite" />
                
            <!-- 踏板旋转动画 -->
            <animateTransform 
                xlink:href="#pedals" 
                attributeName="transform" 
                type="rotate" 
                from="0,100,150" 
                to="360,100,150" 
                dur="2s" 
                repeatCount="indefinite" />
        </svg>
    </div>
</body>
</html>
