<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑行 · SVG 2D 动画</title>
<style>
  :root{
    --ink:#23303b;
    --accent:#2f9e8f;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,#cfe9f5 0%,#eef8fb 55%,#f7fcfd 100%);
    min-height:100vh;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    padding:28px 16px;
  }
  .wrap{ width:100%; max-width:1020px; }
  header{ text-align:center; margin-bottom:14px; }
  header h1{ font-size:26px; letter-spacing:1px; }
  header h1 span{ font-size:30px; }
  header .sub{ margin-top:6px; font-size:13.5px; color:#5f7182; }

  .stage{
    background:#fff;
    border-radius:24px;
    box-shadow:0 18px 50px rgba(35,80,110,.14), 0 2px 8px rgba(35,80,110,.08);
    overflow:hidden;
  }
  .stage svg{ display:block; width:100%; height:auto; }

  .controls{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:16px; flex-wrap:wrap;
  }
  .controls .hint{ font-size:13.5px; color:#5f7182; margin-right:2px; }
  .controls button{
    font-size:14px; font-family:inherit;
    padding:9px 20px; border-radius:999px;
    border:1.5px solid #bcd4de; background:#fff; color:#3a4a58;
    cursor:pointer; transition:all .18s ease;
  }
  .controls button:hover{ border-color:var(--accent); color:var(--accent); transform:translateY(-1px); }
  .controls button.active{
    background:var(--accent); border-color:var(--accent); color:#fff;
    box-shadow:0 6px 16px rgba(47,158,143,.35);
  }
  footer{
    text-align:center; font-size:12px; color:#8fa2b1; margin-top:14px; line-height:1.7;
  }

  /* ============ 动画总控 ============ */
  @keyframes spin       { to { transform: rotate(360deg); } }
  @keyframes spin-rev   { to { transform: rotate(-360deg); } }
  @keyframes roadline   { to { stroke-dashoffset: 72; } }
  @keyframes chainline  { to { stroke-dashoffset: -8; } }
  @keyframes scroll-x   { to { transform: translateX(-900px); } }
  @keyframes cloudmove  { to { transform: translateX(-1500px); } }
  @keyframes birdfly    { to { transform: translateX(-1150px); } }
  @keyframes birdbob    { to { transform: translateY(7px); } }
  @keyframes wingflap   { to { transform: scaleY(.55); } }
  @keyframes bob        { 50% { transform: translateY(2.5px); } }
  @keyframes bob-small  { 50% { transform: translateY(1.5px); } }
  @keyframes sway-head  { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }
  @keyframes sway-beak  { from { transform: rotate(-1.4deg); } to { transform: rotate(1.4deg); } }
  @keyframes sway-tail  { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
  @keyframes sway-scarf { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
  @keyframes pouch      { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.012,1.045); } }
  @keyframes blink      { 0%,90%,96%,100% { transform: scaleY(1); } 93% { transform: scaleY(.12); } }
  @keyframes breathe    { to { transform: scale(1.05); } }
  @keyframes shadow-b   { to { transform: scaleX(.94); opacity:.13; } }
  @keyframes flap-fish  { from { transform: rotate(-4deg); } to { transform: rotate(11deg); } }

  /* 蹬踏运动学（依据髋 (418,300)、曲柄心 (430,445)、大腿 95 / 小腿 90 反解的 8 相位关键帧） */
  @keyframes thigh {
    0%    { transform: rotate(39.2deg); }
    12.5% { transform: rotate(56.6deg); }
    25%   { transform: rotate(69.6deg); }
    37.5% { transform: rotate(69.5deg); }
    50%   { transform: rotate(61.3deg); }
    62.5% { transform: rotate(48.3deg); }
    75%   { transform: rotate(33.7deg); }
    87.5% { transform: rotate(29.2deg); }
    100%  { transform: rotate(39.2deg); }
  }
  @keyframes shin {
    0%    { transform: rotate(69.9deg); }
    12.5% { transform: rotate(44.7deg); }
    25%   { transform: rotate(34.0deg); }
    37.5% { transform: rotate(49.7deg); }
    50%   { transform: rotate(75.5deg); }
    62.5% { transform: rotate(96.8deg); }
    75%   { transform: rotate(104.2deg); }
    87.5% { transform: rotate(93.2deg); }
    100%  { transform: rotate(69.9deg); }
  }

  /* ============ 场景元素 ============ */
  .spokes-rear, .spokes-front, .crank, .pedal-near, .pedal-far,
  .thigh-n, .shin-n, .thigh-f, .shin-f, .head-g, .beak-g, .pouch-g,
  .eye-g, .tail-g, .scarf-g, .fish-g, .rays, .sun-breath, .shadow {
    transform-box: view-box;
  }
  .spokes-rear  { animation: spin 2s linear infinite;     transform-origin: 300px 440px; }
  .spokes-front { animation: spin 2s linear infinite;     transform-origin: 565px 440px; }
  .crank        { animation: spin 2s linear infinite;     transform-origin: 430px 445px; }
  .pedal-near   { animation: spin-rev 2s linear infinite; transform-origin: 462px 445px; }
  .pedal-far    { animation: spin-rev 2s linear infinite; transform-origin: 398px 445px; }

  .road-dash { animation: roadline .37s linear infinite; }
  .chain     { animation: chainline .127s linear infinite; }

  .hill-back  { animation: scroll-x 90s linear infinite; }
  .hill-front { animation: scroll-x 55s linear infinite; }
  .grassroll  { animation: scroll-x 4.6s linear infinite; }

  .cloud-1 { animation: cloudmove 30s linear infinite; }
  .cloud-2 { animation: cloudmove 38s linear infinite; }
  .cloud-3 { animation: cloudmove 46s linear infinite; }

  .bird-1    { animation: birdfly 14s linear infinite; }
  .bird-2    { animation: birdfly 18s linear infinite; }
  .bird-bob  { animation: birdbob 1.1s ease-in-out infinite alternate; }
  .bird-wing { animation: wingflap .42s ease-in-out infinite alternate;
               transform-box: fill-box; transform-origin: 50% 50%; }

  .rays       { animation: spin 26s linear infinite;      transform-origin: 788px 86px; }
  .sun-breath { animation: breathe 3.8s ease-in-out infinite alternate; transform-origin: 788px 86px; }
  .shadow     { animation: shadow-b 2.2s ease-in-out infinite alternate; transform-origin: 438px 507px; }

  /* ============ 骑行者 ============ */
  .rider-bob { animation: bob-small 1s ease-in-out infinite; }
  .torso     { animation: bob 1s ease-in-out infinite; }

  .thigh-n { animation: thigh 2s linear infinite; transform-origin: 418px 300px; }
  .shin-n  { animation: shin  2s linear infinite; transform-origin: 513px 300px; }
  .thigh-f { animation: thigh 2s linear infinite -1s; transform-origin: 418px 300px; }
  .shin-f  { animation: shin  2s linear infinite -1s; transform-origin: 513px 300px; }

  .head-g    { animation: sway-head 2.8s ease-in-out infinite alternate; transform-origin: 470px 163px; }
  .beak-g    { animation: sway-beak 3.4s ease-in-out infinite alternate; transform-origin: 497px 147px; }
  .pouch-g   { animation: pouch 1.7s ease-in-out infinite;                transform-origin: 497px 156px; }
  .eye-g     { animation: blink 4.6s linear infinite;                    transform-origin: 487px 143px; }
  .tail-g    { animation: sway-tail 1.9s ease-in-out infinite alternate;  transform-origin: 358px 262px; }
  .scarf-g   { animation: sway-scarf 1.25s ease-in-out infinite alternate; transform-origin: 447px 245px; }
  .fish-g    { animation: flap-fish 1.1s ease-in-out infinite alternate;  transform-origin: 310px 314px; }

  @media (prefers-reduced-motion: reduce) {
    #scene, #scene * { animation: none !important; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1><span>🚴</span> 鹈鹕骑行记</h1>
    <p class="sub">纯 SVG + CSS 关键帧手绘的 2D 矢量动画 —— 一只鹈鹕踩着单车，驮着小鱼篓悠悠地穿过田野</p>
  </header>

  <figure class="stage">
  <svg id="scene" viewBox="0 0 900 560" role="img" aria-label="一只白色鹈鹕骑着自行车在乡间道路上前行，天空中有太阳、白云与飞鸟">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8fd0ea"/>
        <stop offset="1" stop-color="#e6f6fc"/>
      </linearGradient>
      <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8ed166"/>
        <stop offset="1" stop-color="#64b34a"/>
      </linearGradient>
    </defs>

    <!-- ===================== 天空 ===================== -->
    <rect width="900" height="420" fill="url(#skyGrad)"/>

    <!-- 太阳（光芒旋转 + 呼吸缩放） -->
    <g class="sun-breath">
      <g class="rays">
        <g stroke="#ffcf4d" stroke-width="4" stroke-linecap="round">
          <line x1="788" y1="30"  x2="788" y2="42"/>
          <line x1="788" y1="130" x2="788" y2="142"/>
          <line x1="732" y1="86"  x2="744" y2="86"/>
          <line x1="832" y1="86"  x2="844" y2="86"/>
          <line x1="748" y1="46"  x2="757" y2="55"/>
          <line x1="819" y1="117" x2="828" y2="126"/>
          <line x1="748" y1="126" x2="757" y2="117"/>
          <line x1="819" y1="55"  x2="828" y2="46"/>
          <line x1="768" y1="33"  x2="773" y2="44"/>
          <line x1="803" y1="128" x2="808" y2="139"/>
          <line x1="735" y1="66"  x2="746" y2="71"/>
          <line x1="830" y1="101" x2="841" y2="106"/>
        </g>
      </g>
      <circle cx="788" cy="86" r="44" fill="#ffd257" opacity=".25"/>
      <circle cx="788" cy="86" r="32" fill="#ffd257"/>
    </g>

    <!-- 云 × 3（视差飘移） -->
    <g class="cloud-1" transform="translate(980,78)">
      <g transform="scale(.9)" fill="#ffffff" opacity=".95">
        <circle cx="0" cy="6" r="14"/><circle cx="20" cy="-4" r="19"/><circle cx="42" cy="4" r="13"/>
        <rect x="-16" y="2" width="76" height="16" rx="8"/>
      </g>
    </g>
    <g class="cloud-2" transform="translate(1160,128)">
      <g transform="scale(1.15)" fill="#ffffff" opacity=".9">
        <circle cx="0" cy="6" r="14"/><circle cx="20" cy="-4" r="19"/><circle cx="42" cy="4" r="13"/>
        <rect x="-16" y="2" width="76" height="16" rx="8"/>
      </g>
    </g>
    <g class="cloud-3" transform="translate(1350,52)">
      <g transform="scale(.7)" fill="#ffffff" opacity=".85">
        <circle cx="0" cy="6" r="14"/><circle cx="20" cy="-4" r="19"/><circle cx="42" cy="4" r="13"/>
        <rect x="-16" y="2" width="76" height="16" rx="8"/>
      </g>
    </g>

    <!-- 小鸟 × 2（飞行 + 上下浮动 + 拍翅） -->
    <g class="bird-1" transform="translate(950,95)">
      <g class="bird-bob">
        <g class="bird-wing" transform="scale(.95)">
          <path d="M0,0 Q6,-8 12,0 Q18,-8 24,0" fill="none" stroke="#55606e" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>
    </g>
    <g class="bird-2" transform="translate(990,148)">
      <g class="bird-bob">
        <g class="bird-wing" transform="scale(.72)">
          <path d="M0,0 Q6,-8 12,0 Q18,-8 24,0" fill="none" stroke="#7a8699" stroke-width="3.5" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- ===================== 远景丘陵（双层视差滚动） ===================== -->
    <g class="hill-back">
      <path id="hill-back-p" fill="#cfe6b5"
        d="M0,420 C120,352 250,408 360,390 C480,370 560,338 680,392 C780,428 860,404 900,414 L900,424 L0,424 Z"/>
      <use href="#hill-back-p" x="900"/>
    </g>
    <g class="hill-front">
      <path id="hill-front-p" fill="#b3dc94"
        d="M0,420 C90,382 180,416 300,408 C420,400 480,372 600,404 C700,428 820,398 900,412 L900,426 L0,426 Z"/>
      <use href="#hill-front-p" x="900"/>
    </g>

    <!-- ===================== 草地与道路 ===================== -->
    <rect y="420" width="900" height="140" fill="url(#grassGrad)"/>

    <!-- 路肩滚动草丛（双份平铺无缝循环） -->
    <g class="grassroll">
      <g id="grass-set">
        <g id="tuft" stroke="#4e9e3f" stroke-width="3.5" stroke-linecap="round" fill="none">
          <g transform="translate(60,452)"><path d="M0,0 C-2,-8 -6,-12 -9,-16"/><path d="M0,0 C0,-10 1,-14 3,-19"/><path d="M0,0 C3,-7 7,-11 11,-14"/></g>
          <g transform="translate(190,448)"><path d="M0,0 C-2,-8 -6,-12 -9,-16"/><path d="M0,0 C0,-10 1,-14 3,-19"/><path d="M0,0 C3,-7 7,-11 11,-14"/></g>
          <g transform="translate(300,453)"><path d="M0,0 C-2,-8 -6,-12 -9,-16"/><path d="M0,0 C0,-10 1,-14 3,-19"/><path d="M0,0 C3,-7 7,-11 11,-14"/></g>
          <g transform="translate(430,449)"><path d="M0,0 C-2,-8 -6,-12 -9,-16"/><path d="M0,0 C0,-10 1,-14 3,-19"/><path d="M0,0 C3,-7 7,-11 11,-14"/></g>
          <g transform="translate(520,452)"><path d="M0,0 C-2,-8 -6,-12 -9,-16"/><path d="M0,0 C0,-10 1,-14 3,-19"/><path d="M0,0 C3,-7 7,-11 11,-14"/></g>
          <g transform="translate(640,448)"><path d="M0,0 C-2,-8 -6,-12 -9,-16"/><path d="M0,0 C0,-10 1,-14 3,-19"/><path d="M0,0 C3,-7 7,-11 11,-14"/></g>
          <g transform="translate(730,453)"><path d="M0,0 C-2,-8 -6,-12 -9,-16"/><path d="M0,0 C0,-10 1,-14 3,-19"/><path d="M0,0 C3,-7 7,-11 11,-14"/></g>
          <g transform="translate(860,450)"><path d="M0,0 C-2,-8 -6,-12 -9,-16"/><path d="M0,0 C0,-10 1,-14 3,-19"/><path d="M0,0 C3,-7 7,-11 11,-14"/></g>
        </g>
        <g stroke="#4e9e3f" stroke-width="3" stroke-linecap="round" fill="none">
          <g transform="translate(130,452)"><path d="M0,0 C-2,-7 -5,-10 -8,-13"/><path d="M0,0 C1,-8 2,-11 4,-15"/><path d="M0,0 C3,-6 6,-9 9,-12"/></g>
          <g transform="translate(580,451)"><path d="M0,0 C-2,-7 -5,-10 -8,-13"/><path d="M0,0 C1,-8 2,-11 4,-15"/><path d="M0,0 C3,-6 6,-9 9,-12"/></g>
        </g>
        <g stroke="#3f7a34" stroke-width="2.5" stroke-linecap="round">
          <line x1="248" y1="452" x2="248" y2="441"/><line x1="688" y1="451" x2="688" y2="440"/>
        </g>
        <circle cx="248" cy="438" r="4" fill="#ff9a9e"/><circle cx="248" cy="438" r="1.6" fill="#ffd76e"/>
        <circle cx="688" cy="437" r="4" fill="#ffb1a6"/><circle cx="688" cy="437" r="1.6" fill="#ffd76e"/>
      </g>
      <use href="#grass-set" x="900"/>
    </g>

    <!-- 柏油路 -->
    <rect y="455" width="900" height="100" fill="#5b5c66"/>
    <line x1="0" y1="462" x2="900" y2="462" stroke="#ececec" stroke-width="3"/>
    <line x1="0" y1="548" x2="900" y2="548" stroke="#ececec" stroke-width="3"/>
    <line class="road-dash" x1="0" y1="505" x2="900" y2="505"
          stroke="#ffffff" stroke-width="6" stroke-dasharray="42 30" stroke-linecap="round" opacity=".92"/>

    <!-- 车轮接地阴影 -->
    <ellipse class="shadow" cx="438" cy="507" rx="178" ry="11" fill="#1c2b36" opacity=".18"/>

    <!-- ===================== 骑行者（整车轻微颠簸） ===================== -->
    <g class="rider-bob">

      <!-- 远侧腿（深色，相位提前半圈） -->
      <g class="thigh-f">
        <line x1="418" y1="300" x2="513" y2="300" stroke="#b25f16" stroke-width="15" stroke-linecap="round"/>
        <g class="shin-f">
          <line x1="513" y1="300" x2="603" y2="300" stroke="#a84e10" stroke-width="11" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 远侧曲柄（画在车架后面） -->
      <g class="crank">
        <line x1="430" y1="445" x2="398" y2="445" stroke="#6b6b73" stroke-width="7" stroke-linecap="round"/>
        <g class="pedal-far">
          <rect x="388" y="440" width="20" height="9" rx="3" fill="#33333a"/>
          <path d="M398,440 C386,437 378,439 375,444 C378,449 388,452 398,452 Z" fill="#b25f16"/>
        </g>
      </g>

      <!-- 后轮 -->
      <g>
        <circle cx="300" cy="440" r="60" fill="none" stroke="#33333a" stroke-width="8"/>
        <circle cx="300" cy="440" r="48" fill="none" stroke="#d8dde2" stroke-width="5"/>
        <g class="spokes-rear" stroke="#aab2ba" stroke-width="2.4">
          <line x1="300" y1="394" x2="300" y2="486"/>
          <line x1="254" y1="440" x2="346" y2="440"/>
          <line x1="268" y1="408" x2="332" y2="472"/>
          <line x1="268" y1="472" x2="332" y2="408"/>
          <line x1="284" y1="396" x2="316" y2="484"/>
          <line x1="256" y1="424" x2="344" y2="456"/>
          <line x1="256" y1="456" x2="344" y2="424"/>
          <line x1="284" y1="484" x2="316" y2="396"/>
        </g>
        <circle cx="300" cy="440" r="12" fill="none" stroke="#5a5a62" stroke-width="3"/>
        <circle cx="300" cy="440" r="7" fill="#4a4a50"/>
      </g>

      <!-- 前轮 -->
      <g>
        <circle cx="565" cy="440" r="60" fill="none" stroke="#33333a" stroke-width="8"/>
        <circle cx="565" cy="440" r="48" fill="none" stroke="#d8dde2" stroke-width="5"/>
        <g class="spokes-front" stroke="#aab2ba" stroke-width="2.4">
          <line x1="565" y1="394" x2="565" y2="486"/>
          <line x1="519" y1="440" x2="611" y2="440"/>
          <line x1="533" y1="408" x2="597" y2="472"/>
          <line x1="533" y1="472" x2="597" y2="408"/>
          <line x1="549" y1="396" x2="581" y2="484"/>
          <line x1="521" y1="424" x2="609" y2="456"/>
          <line x1="521" y1="456" x2="609" y2="424"/>
          <line x1="549" y1="484" x2="581" y2="396"/>
        </g>
        <circle cx="565" cy="440" r="7" fill="#4a4a50"/>
      </g>

      <!-- 车架 -->
      <g stroke="#2f9e8f" stroke-width="9" stroke-linecap="round" fill="none">
        <line x1="430" y1="445" x2="400" y2="330"/>   <!-- 座管 -->
        <line x1="430" y1="445" x2="553" y2="340"/>   <!-- 下管 -->
        <line x1="400" y1="330" x2="551" y2="340"/>  <!-- 上管 -->
        <line x1="400" y1="330" x2="300" y2="440"/>   <!-- 后上叉 -->
        <line x1="430" y1="445" x2="300" y2="440"/>   <!-- 后下叉 -->
        <line x1="565" y1="440" x2="551" y2="338"/>  <!-- 前叉 -->
        <line x1="551" y1="338" x2="547" y2="314"/>  <!-- 头管 -->
      </g>
      <!-- 车把 -->
      <path d="M547,314 C547,308 560,306 585,307" fill="none" stroke="#3a3a40" stroke-width="7" stroke-linecap="round"/>
      <circle cx="585" cy="307" r="5" fill="#26262c"/>
      <!-- 车座 -->
      <path d="M370,322 C376,315 408,313 416,320 C410,327 378,329 370,322 Z" fill="#7a4a2b"/>
      <path d="M374,319 C382,316 404,315 411,318" fill="none" stroke="#9c6a3f" stroke-width="2" stroke-linecap="round"/>

      <!-- 货架 + 鱼篓（两条小鱼在篓口） -->
      <line x1="408" y1="352" x2="326" y2="346" stroke="#5a5a60" stroke-width="4" stroke-linecap="round"/>
      <g>
        <path d="M294,318 C294,300 350,300 350,318 L345,346 C335,352 309,352 299,346 Z"
              fill="#cf9a55" stroke="#a06a33" stroke-width="2"/>
        <path d="M304,304 C310,318 308,334 302,344 M322,302 C328,316 326,332 320,346 M340,304 C344,316 342,330 338,344"
              fill="none" stroke="#a06a33" stroke-width="1.6" opacity=".65"/>
        <path d="M298,326 C312,332 332,332 346,324 M300,338 C314,344 330,344 344,338"
              fill="none" stroke="#a06a33" stroke-width="1.6" opacity=".65"/>
        <ellipse cx="322" cy="318" rx="28" ry="7" fill="#8a5a2e"/>
        <g class="fish-g">
          <path d="M310,312 C316,300 322,295 332,292 C329,301 323,308 316,314 Z" fill="#6fc7d6"/>
          <path d="M328,292 L339,282 L337,295 Z" fill="#58b7c6"/>
          <circle cx="330" cy="295" r="1.4" fill="#233"/>
        </g>
        <path d="M338,314 L347,305 L346,316 Z" fill="#58b7c6"/>
      </g>

      <!-- 链条（节距滚动）与牙盘 -->
      <circle cx="430" cy="445" r="20" fill="#5a5a62" stroke="#3f3f46" stroke-width="3"/>
      <circle cx="300" cy="440" r="12" fill="none" stroke="#5a5a62" stroke-width="3"/>

<script>
  const rateBtns  = document.querySelectorAll('[data-rate]');
  const pauseBtn  = document.getElementById('pauseBtn');
  let rate = 1, paused = false;

  // 用 Web Animations API 统一调节整页动画倍速（相位连续，不跳帧）
  function apply() {
    document.getAnimations()
      .filter(a => a instanceof CSSAnimation)
      .forEach(a => {
        if (paused) { a.pause(); }
        else { a.playbackRate = rate; a.play(); }
      });
  }

  rateBtns.forEach(btn => btn.addEventListener('click', () => {
    rate = parseFloat(btn.dataset.rate);
    paused = false;
    pauseBtn.textContent = '⏸ 暂停';
    rateBtns.forEach(b => b.classList.toggle('active', b === btn));
    apply();
  }));

  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? '▶ 继续' : '⏸ 暂停';
    apply();
  });
</script>
