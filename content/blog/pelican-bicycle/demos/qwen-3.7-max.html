<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车 SVG 动画</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e0f7fa; /* 浅蓝色背景 */
            font-family: sans-serif;
        }
        .container {
            width: 800px;
            height: 500px;
            border: 2px solid #333;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 80%, #8D6E63 80%, #5D4037 100%);
            overflow: hidden;
            position: relative;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        h1 {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #01579B;
            margin: 0;
            font-size: 24px;
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>鹈鹕骑行记</h1>
    
    <svg width="100%" height="100%" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- 定义自行车车轮的模板 -->
            <g id="wheel">
                <circle cx="0" cy="0" r="40" fill="none" stroke="#333" stroke-width="8" />
                <!-- 辐条 -->
                <g stroke="#888" stroke-width="2">
                    <line x1="0" y1="-40" x2="0" y2="40" />
                    <line x1="-40" y1="0" x2="40" y2="0" />
                    <line x1="-28" y1="-28" x2="28" y2="28" />
                    <line x1="28" y1="-28" x2="-28" y2="28" />
                </g>
                <!-- 旋转动画 -->
                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite" />
            </g>
            
            <!-- 定义踏板曲柄的模板 -->
            <g id="crank">
                <line x1="0" y1="0" x2="0" y2="-25" stroke="#555" stroke-width="6" stroke-linecap="round" />
                <rect x="-8" y="-30" width="16" height="10" fill="#333" rx="2" />
            </g>
        </defs>

        <!-- 背景云朵 (移动效果) -->
        <g fill="#FFF" opacity="0.8">
            <path d="M100,100 Q115,80 130,100 T160,100 T190,100 T220,100 V120 H100 Z">
                <animate attributeName="cx" from="800" to="-200" dur="20s" repeatCount="indefinite" />
            </path>
            <path transform="translate(400, 50) scale(0.8)" d="M100,100 Q115,80 130,100 T160,100 T190,100 T220,100 V120 H100 Z">
                <animate attributeName="cx" from="800" to="-200" dur="15s" repeatCount="indefinite" />
            </path>
        </g>

        <!-- 地面线条 (移动效果) -->
        <g stroke="#5D4037" stroke-width="4">
            <line x1="0" y1="410" x2="800" y2="410" />
            <!-- 快速移动的地面纹理 -->
            <path d="M0,415 L800,415" stroke="#795548" stroke-width="2" stroke-dasharray="50, 30">
                <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="1s" repeatCount="indefinite" />
            </path>
        </g>

        <!-- 自行车主体组 -->
        <g transform="translate(250, 350)">
            
            <!-- 自行车车架 -->
            <path d="M0,0 L60,-60 L140,0 L110,0 L80,-60 L30,-60 Z" fill="none" stroke="#D32F2F" stroke-width="6" stroke-linejoin="round" />
            <line x1="60" y1="-60" x2="110" y2="0" stroke="#D32F2F" stroke-width="6" /> <!-- 立管 -->
            <line x1="30" y1="-60" x2="0" y2="0" stroke="#D32F2F" stroke-width="6" /> <!-- 后叉 -->
            <line x1="140" y1="0" x2="110" y2="0" stroke="#D32F2F" stroke-width="6" /> <!-- 前叉连接 -->
            
            <!-- 车座 -->
            <path d="M20,-65 L60,-65" stroke="#333" stroke-width="8" stroke-linecap="round" />
            
            <!-- 车把 -->
            <path d="M130,-60 L140,-90 L110,-95" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

            <!-- 后轮 -->
            <use href="#wheel" x="0" y="0" />
            <!-- 前轮 -->
            <use href="#wheel" x="140" y="0" />

            <!-- 鹈鹕主体 -->
            <g transform="translate(45, -65)">
                <!-- 后腿 (远侧) -->
                <path d="M10,10 Q20,30 30,40" fill="none" stroke="#FF9800" stroke-width="12" stroke-linecap="round">
                    <animate attributeName="d" values="M10,10 Q20,30 30,40; M10,10 Q0,30 -10,40; M10,10 Q20,30 30,40" dur="1.5s" repeatCount="indefinite" />
                </path>
                <path d="M30,40 L40,40" stroke="#333" stroke-width="6"> <!-- 远侧脚掌 -->
                     <animate attributeName="d" values="M30,40 L40,40; M-10,40 L0,40; M30,40 L40,40" dur="1.5s" repeatCount="indefinite" />
                </path>

                <!-- 身体 -->
                <ellipse cx="20" cy="0" rx="35" ry="25" fill="#FFF" stroke="#333" stroke-width="2" />
                <!-- 翅膀 -->
                <path d="M10,-5 Q30,-5 40,15 Q20,20 10,-5" fill="#F5F5F5" stroke="#333" stroke-width="1" />
                <!-- 翅膀抓住车把 -->
                <path d="M40,0 Q80,-20 100,-30" fill="none" stroke="#FFF" stroke-width="10" stroke-linecap="round" />
                <path d="M40,0 Q80,-20 100,-30" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="100, 110" stroke-linecap="round" />

                <!-- 脖子 -->
                <path d="M40,-15 Q50,-40 40,-60" fill="none" stroke="#FFF" stroke-width="18" stroke-linecap="round" />
                <path d="M40,-15 Q50,-40 40,-60" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="40, 100" /> <!-- 脖子轮廓修正 -->

                <!-- 头部 -->
                <circle cx="40" cy="-65" r="15" fill="#FFF" stroke="#333" stroke-width="2" />
                
                <!-- 眼睛 -->
                <circle cx="45" cy="-70" r="3" fill="#000" />
                <circle cx="46" cy="-71" r="1" fill="#FFF" />

                <!-- 嘴巴 (上颚) -->
                <path d="M50,-70 L100,-65 L50,-60 Z" fill="#FFC107" stroke="#333" stroke-width="1" />
                
                <!-- 嘴巴 (下颚/喉囊) -->
                <path d="M50,-60 Q80,-20 100,-65 L50,-60" fill="#FFB300" stroke="#333" stroke-width="1" />

                <!-- 叼着的鱼 -->
                <g transform="translate(95, -65) rotate(-10)">
                    <path d="M0,0 Q15,-5 30,0 Q15,5 0,0" fill="#4FC3F7" stroke="#0277BD" stroke-width="1" />
                    <polygon points="30,0 35,-5 35,5" fill="#4FC3F7" stroke="#0277BD" stroke-width="1" /> <!-- 鱼尾 -->
                    <circle cx="5" cy="-2" r="1" fill="#FFF" /> <!-- 鱼眼 -->
                </g>

                <!-- 前腿 (近侧) -->
                <path d="M10,10 Q30,20 40,35" fill="none" stroke="#FF9800" stroke-width="12" stroke-linecap="round">
                    <!-- 腿部踩踏动画 -->
                    <animate attributeName="d" values="M10,10 Q30,20 40,35; M10,10 Q-10,30 -20,45; M10,10 Q30,20 40,35" dur="1.5s" repeatCount="indefinite" />
                </path>
                 <path d="M40,35 L55,35" stroke="#333" stroke-width="6"> <!-- 近侧脚掌 -->
                     <animate attributeName="d" values="M40,35 L55,35; M-20,45 L-5,45; M40,35 L55,35" dur="1.5s" repeatCount="indefinite" />
                </path>
            </g>

            <!-- 踏板曲柄组 (旋转动画) -->
            <g transform="translate(80, 0)">
                <g>
                    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite" />
                    <!-- 曲柄1 -->
                    <use href="#crank" />
                    <!-- 曲柄2 (反向) -->
                    <use href="#crank" transform="rotate(180)" />
                </g>
            </g>
        </g>
    </svg>
</div>

</body>
</html>
