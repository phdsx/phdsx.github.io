<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可爱鹈鹕骑自行车 2D 动画</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0fdf4;
            overflow: hidden;
            user-select: none;
        }

        .font-title {
            font-family: 'Fredoka One', cursive;
        }

        /* -------------------------------------------------------------
           SVG 动画帧与关键帧定义
           ------------------------------------------------------------- */
        
        /* 云朵移动动画 */
        @keyframes moveClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(-1000px); }
        }
        
        /* 树木与背景线条平移 */
        @keyframes moveBackground {
            0% { transform: translateX(0); }
            100% { transform: translateX(-800px); }
        }

        /* 地面虚线与灌木丛平移（较快速度实现视觉深度） */
        @keyframes moveForeground {
            0% { transform: translateX(0); }
            100% { transform: translateX(-600px); }
        }

        /* 车轮旋转动画 */
        @keyframes spinWheel {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 鹈鹕整体颠簸（模拟骑行起伏） */
        @keyframes pelicanBounce {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(-1.5deg); }
        }

        /* 喉囊与大嘴轻微震颤抖动 */
        @keyframes pouchJiggle {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.03, 0.97) rotate(1deg); }
        }

        /* 翅膀轻微扇动/摆动 */
        @keyframes wingFlap {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-5deg); }
        }

        /* 眼睛眨眼效果 */
        @keyframes blinkEye {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        /* 应用动画的 CSS 类 */
        .anim-cloud { animation: moveClouds 35s linear infinite; }
        .anim-bg-trees { animation: moveBackground 12s linear infinite; }
        .anim-fg-road { animation: moveForeground 3s linear infinite; }
        .anim-wheel { transform-origin: center; animation: spinWheel 1.2s linear infinite; }
        .anim-bounce { animation: pelicanBounce 0.6s ease-in-out infinite; }
        .anim-pouch { transform-origin: 320px 210px; animation: pouchJiggle 1.2s ease-in-out infinite; }
        .anim-wing { transform-origin: 290px 210px; animation: wingFlap 1.2s ease-in-out infinite; }
        .anim-eye { transform-origin: 350px 148px; animation: blinkEye 4s infinite; }
        
        /* 玻璃质感控制面板 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>

    <!-- JavaScript 逻辑：逆向运动学 (IK) 腿部踩踏与动画同步 -->
    <script>
        /*
         * 鹈鹕腿部踩踏逆向运动学 (Inverse Kinematics) 算法
         * 髋关节 (Hip): 固定在鹈鹕身体/车座附近 (x: 375, y: 360)
         * 脚踏板 (Pedal): 绕牙盘中心 (cx: 400, cy: 470) 做圆周运动，半径 R = 32
         * 大腿长度 L1 = 65, 小腿长度 L2 = 65
         * 每次计算膝关节 (Knee) 的 2D 坐标位置，生成完全符合物理规则的踩踏动作。
         */

        const hipX = 375;
        const hipY = 355;
        const crankX = 400;
        const crankY = 470;
        const crankRadius = 30;
        const L1 = 62; // 大腿长
        const L2 = 62; // 小腿长

        let angle = 0; // 当前脚踏板旋转角度 (弧度)
        let speed = 0.05; // 旋转角速度
        let isPaused = false;
        let isBoosted = false;

        const rightLegGroup = document.getElementById('right-leg-system');
        const leftLegGroup = document.getElementById('left-leg-system');
        const speedSlider = document.getElementById('speed-slider');
        const btnPause = document.getElementById('btn-pause');
        const btnBoost = document.getElementById('btn-boost');
        const pauseText = document.getElementById('pause-text');
        const pauseIcon = document.getElementById('pause-icon');

        // 计算膝关节坐标的 IK 解算器
        function solveIK(hx, hy, px, py, r1, r2, bendRight = true) {
            const dx = px - hx;
            const dy = py - hy;
            const d = Math.hypot(dx, dy);

            // 防止超出腿长极限
            const dist = Math.min(d, r1 + r2 - 0.1);

            const a = (r1 * r1 - r2 * r2 + dist * dist) / (2 * dist);
            const h = Math.sqrt(Math.max(0, r1 * r1 - a * a));

            const x2 = hx + (a * dx) / dist;
            const y2 = hy + (a * dy) / dist;

            // 膝关节向右/向前弯曲
            const kx = bendRight ? x2 + (h * dy) / dist : x2 - (h * dy) / dist;
            const ky = bendRight ? y2 - (h * dx) / dist : y2 + (h * dx) / dist;

            return { x: kx, y: ky };
        }

        function renderLeg(container, pedalAngle, isFront) {
            // 脚踏板位置
            const px = crankX + crankRadius * Math.cos(pedalAngle);
            const py = crankY + crankRadius * Math.sin(pedalAngle);

            // IK 计算膝盖位置
            const knee = solveIK(hipX, hipY, px, py, L1, L2, true);

            // 颜色区分前后（远近深度）
            const legColor = isFront ? "#f97316" : "#c2410c"; // 鹈鹕橘黄色的腿
            const footColor = isFront ? "#ea580c" : "#9a3412";
            const crankLineColor = isFront ? "#cbd5e1" : "#64748b";
            const opacity = isFront ? "1.0" : "0.65";

            container.innerHTML = `
                <g opacity="${opacity}">
                    <!-- 曲柄 (Crank Arm) -->
                    <line x1="${crankX}" y1="${crankY}" x2="${px}" y2="${py}" stroke="${crankLineColor}" stroke-width="7" stroke-linecap="round" />
                    <circle cx="${px}" cy="${py}" r="4" fill="#334155" />

                    <!-- 大腿 (Hip -> Knee) -->
                    <line x1="${hipX}" y1="${hipY}" x2="${knee.x}" y2="${knee.y}" stroke="${legColor}" stroke-width="12" stroke-linecap="round" />
                    
                    <!-- 小腿 (Knee -> Pedal) -->
                    <line x1="${knee.x}" y1="${knee.y}" x2="${px}" y2="${py}" stroke="${legColor}" stroke-width="9" stroke-linecap="round" />

                    <!-- 关节圆角 -->
                    <circle cx="${knee.x}" cy="${knee.y}" r="6" fill="${legColor}" />
                    <circle cx="${hipX}" cy="${hipY}" r="7" fill="${legColor}" />

                    <!-- 蹼足 / 脚掌 (Webbed Foot) -->
                    <path d="M ${px - 12},${py - 2} L ${px + 15},${py + 2} L ${px + 10},${py + 10} Z" fill="${footColor}" />

                    <!-- 脚踏板 (Pedal) -->
                    <rect x="${px - 14}" y="${py - 4}" width="28" height="8" rx="3" fill="#1e293b" />
                </g>
            `;
        }

        // 主动画循环
        function animateLoop() {
            if (!isPaused) {
                angle += speed;
                if (angle >= Math.PI * 2) angle -= Math.PI * 2;

                // 左腿与右腿相差 180 度 (Math.PI)
                renderLeg(leftLegGroup, angle + Math.PI, false);
                renderLeg(rightLegGroup, angle, true);
            }

            requestAnimationFrame(animateLoop);
        }

        // 更新 CSS 动画播放速率以匹配脚步速度
        function updateAnimationSpeeds(factor) {
            const baseWheelTime = 1.2 / factor;
            const baseBounceTime = 0.6 / factor;
            const baseBgTime = 12 / factor;
            const baseFgTime = 3 / factor;

            document.querySelectorAll('.anim-wheel').forEach(el => {
                el.style.animationDuration = `${baseWheelTime}s`;
            });
            document.querySelectorAll('.anim-bounce').forEach(el => {
                el.style.animationDuration = `${baseBounceTime}s`;
            });
            document.querySelectorAll('.anim-bg-trees').forEach(el => {
                el.style.animationDuration = `${baseBgTime}s`;
            });
            document.querySelectorAll('.anim-fg-road').forEach(el => {
                el.style.animationDuration = `${baseFgTime}s`;
            });
        }

        // 事件监听：速度滑块
        speedSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            speed = 0.05 * val;
            updateAnimationSpeeds(val);
        });

        // 事件监听：暂停/播放
        btnPause.addEventListener('click', () => {
            isPaused = !isPaused;
            const elementsToToggle = document.querySelectorAll('.anim-wheel, .anim-bounce, .anim-bg-trees, .anim-fg-road, .anim-cloud, .anim-pouch, .anim-wing');
            
            if (isPaused) {
                elementsToToggle.forEach(el => el.style.animationPlayState = 'paused');
                pauseText.textContent = "继续";
                pauseIcon.textContent = "▶️";
                btnPause.classList.replace('bg-teal-600', 'bg-blue-600');
            } else {
                elementsToToggle.forEach(el => el.style.animationPlayState = 'running');
                pauseText.textContent = "暂停";
                pauseIcon.textContent = "⏸️";
                btnPause.classList.replace('bg-blue-600', 'bg-teal-600');
            }
        });

        // 事件监听：冲刺加速
        btnBoost.addEventListener('click', () => {
            if (isBoosted) return;
            isBoosted = true;
            const originalSpeed = speedSlider.value;
            
            speedSlider.value = 2.8;
            speed = 0.05 * 2.8;
            updateAnimationSpeeds(2.8);

            btnBoost.classList.add('scale-110', 'bg-red-500');
            btnBoost.textContent = "🔥 极速冲刺中!";

            setTimeout(() => {
                speedSlider.value = originalSpeed;
                speed = 0.05 * parseFloat(originalSpeed);
                updateAnimationSpeeds(parseFloat(originalSpeed));
                btnBoost.classList.remove('scale-110', 'bg-red-500');
                btnBoost.textContent = "🚀 加速冲刺";
                isBoosted = false;
            }, 3000);
        });

        // 页面加载完成后启动动画
        window.onload = function() {
            updateAnimationSpeeds(1);
            animateLoop();
        };
    </script>
</body>
</html>
