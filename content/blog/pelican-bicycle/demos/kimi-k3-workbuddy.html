<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #aee2ff 0%, #d8f0ff 55%, #eaf7e3 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  h1 {
    color: #2b5d7d;
    font-size: 28px;
    letter-spacing: 4px;
    margin-bottom: 8px;
    text-shadow: 0 2px 6px rgba(255,255,255,.8);
  }
  p.sub { color: #4d7d99; font-size: 14px; margin-bottom: 18px; letter-spacing: 2px; }
  .stage {
    width: min(960px, 96vw);
    border-radius: 20px;
    box-shadow: 0 18px 50px rgba(43, 93, 125, .25);
    overflow: hidden;
    background: linear-gradient(180deg, #bfe8ff 0%, #e6f6ff 60%, #d8ecc8 60%, #c4e0ae 100%);
  }
  svg { display: block; width: 100%; height: auto; }

  /* ============ 动画定义 ============ */
  /* 车轮旋转 */
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  /* 脚踏/链条曲柄旋转（与车轮同向） */
  .wheel-spokes {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.6s linear infinite;
  }
  .crank {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.6s linear infinite;
  }
  /* 车身轻微上下颠簸 */
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  .rider-bike {
    animation: bob 0.8s ease-in-out infinite;
  }
  /* 鹈鹕身体起伏（与车身错相） */
  @keyframes bobBody {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-7px) rotate(-1.2deg); }
  }
  .pelican-body {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: bobBody 0.8s ease-in-out infinite;
  }
  /* 头部点动 */
  @keyframes headBob {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-3.5deg); }
  }
  .pelican-head {
    transform-box: fill-box;
    transform-origin: 20% 85%;
    animation: headBob 1.6s ease-in-out infinite;
  }
  /* 眨眼 */
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.08); }
  }
  .eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 3.8s ease-in-out infinite;
  }
  /* 尾羽摆动 */
  @keyframes tailWag {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(5deg); }
  }
  .tail {
    transform-box: fill-box;
    transform-origin: right center;
    animation: tailWag 0.8s ease-in-out infinite;
  }
  /* 翅膀扶把微颤 */
  @keyframes wingFlap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-4deg); }
  }
  .wing {
    transform-box: fill-box;
    transform-origin: 15% 15%;
    animation: wingFlap 1.6s ease-in-out infinite;
  }
  /* 云朵飘动 */
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-1100px); }
  }
  .clouds { animation: drift 26s linear infinite; }
  .clouds-slow { animation: drift 40s linear infinite; }
  /* 地面虚线后退，营造前进感 */
  @keyframes roadMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-120px); }
  }
  .road-line { animation: roadMove 0.9s linear infinite; }
  /* 草丛后退 */
  @keyframes grassMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-1000px); }
  }
  .grass { animation: grassMove 7s linear infinite; }
  /* 速度线 */
  @keyframes speedline {
    0%   { transform: translateX(0); opacity: 0; }
    15%  { opacity: .8; }
    100% { transform: translateX(-340px); opacity: 0; }
  }
  .speed line { animation: speedline 1.1s linear infinite; }
  .speed line:nth-child(2) { animation-delay: .35s; }
  .speed line:nth-child(3) { animation-delay: .7s; }
  /* 太阳脉动光晕 */
  @keyframes sunGlow {
    0%, 100% { opacity: .45; }
    50%      { opacity: .75; }
  }
  .sun-halo { animation: sunGlow 4s ease-in-out infinite; }
</style>
</head>
<body>
  <h1>鹈鹕骑自行车</h1>
  <p class="sub">SVG + CSS · 纯前端 2D 循环动画</p>

  <div class="stage">
  <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕正在骑自行车">
    <defs>
      <!-- 云朵 -->
      <g id="cloud">
        <ellipse cx="0" cy="0" rx="46" ry="22" fill="#ffffff"/>
        <ellipse cx="34" cy="-8" rx="34" ry="18" fill="#ffffff"/>
        <ellipse cx="-34" cy="-6" rx="30" ry="16" fill="#ffffff"/>
      </g>
      <!-- 草丛 -->
      <g id="bush">
        <circle cx="0" cy="0" r="26" fill="#8fca7f"/>
        <circle cx="26" cy="6" r="20" fill="#7ebd6d"/>
        <circle cx="-26" cy="8" r="18" fill="#7ebd6d"/>
      </g>
      <!-- 车轮（含辐条，辐条单独成组以便旋转） -->
      <g id="wheel">
        <circle cx="0" cy="0" r="72" fill="none" stroke="#37474f" stroke-width="10"/>
        <circle cx="0" cy="0" r="62" fill="none" stroke="#90a4ae" stroke-width="3"/>
        <g class="wheel-spokes">
          <g stroke="#78909c" stroke-width="3.5">
            <line x1="0" y1="-62" x2="0" y2="62"/>
            <line x1="-62" y1="0" x2="62" y2="0"/>
            <line x1="-44" y1="-44" x2="44" y2="44"/>
            <line x1="-44" y1="44" x2="44" y2="-44"/>
            <line x1="-24" y1="-57.5" x2="24" y2="57.5"/>
            <line x1="-57.5" y1="-24" x2="57.5" y2="24"/>
            <line x1="24" y1="-57.5" x2="-24" y2="57.5"/>
            <line x1="57.5" y1="-24" x2="-57.5" y2="24"/>
          </g>
          <circle cx="0" cy="0" r="8" fill="#546e7a"/>
        </g>
      </g>
    </defs>

    <!-- ===== 背景 ===== -->
    <g class="sun-halo">
      <circle cx="860" cy="92" r="66" fill="#fff3b0" opacity=".55"/>
    </g>
    <circle cx="860" cy="92" r="42" fill="#ffd94d"/>
    <g stroke="#ffcf3d" stroke-width="5" stroke-linecap="round">
      <line x1="860" y1="22" x2="860" y2="36"/>
      <line x1="860" y1="148" x2="860" y2="162"/>
      <line x1="790" y1="92" x2="804" y2="92"/>
      <line x1="916" y1="92" x2="930" y2="92"/>
      <line x1="812" y1="44" x2="822" y2="54"/>
      <line x1="898" y1="130" x2="908" y2="140"/>
      <line x1="908" y1="44" x2="898" y2="54"/>
      <line x1="822" y1="130" x2="812" y2="140"/>
    </g>

    <g class="clouds-slow" opacity=".9">
      <use href="#cloud" x="180" y="90"/>
      <use href="#cloud" x="1280" y="90"/>
    </g>
    <g class="clouds" opacity=".95">
      <use href="#cloud" x="560" y="60" transform="scale(1)"/>
      <use href="#cloud" x="940" y="130"/>
      <use href="#cloud" x="1660" y="60"/>
      <use href="#cloud" x="2040" y="130"/>
    </g>

    <!-- 地面 -->
    <rect x="0" y="520" width="1000" height="100" fill="#a9d489"/>
    <rect x="0" y="540" width="1000" height="26" fill="#b9a98c"/>
    <g class="road-line" stroke="#ffffff" stroke-width="5" stroke-dasharray="40 80" stroke-linecap="round">
      <line x1="-40" y1="553" x2="1160" y2="553"/>
    </g>

    <g class="grass">
      <use href="#bush" x="120" y="530"/>
      <use href="#bush" x="430" y="534"/>
      <use href="#bush" x="760" y="528"/>
      <use href="#bush" x="1120" y="530"/>
      <use href="#bush" x="1430" y="534"/>
      <use href="#bush" x="1760" y="528"/>
    </g>

    <!-- 速度线 -->
    <g class="speed" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
      <line x1="240" y1="300" x2="310" y2="300"/>
      <line x1="210" y1="360" x2="300" y2="360"/>
      <line x1="250" y1="420" x2="320" y2="420"/>
    </g>

    <!-- ===== 自行车 + 骑手整体颠簸 ===== -->
    <g class="rider-bike">

      <!-- 后轮 / 前轮 -->
      <use href="#wheel" x="330" y="480"/>
      <use href="#wheel" x="690" y="480"/>

      <!-- 车架 -->
      <g stroke="#e2574c" stroke-width="11" stroke-linecap="round" fill="none">
        <line x1="330" y1="480" x2="500" y2="480"/>            <!-- 下叉 -->
        <line x1="330" y1="480" x2="430" y2="338"/>           <!-- 座管 -->
        <line x1="500" y1="480" x2="430" y2="338"/>           <!-- 立管 -->
        <line x1="500" y1="480" x2="648" y2="342"/>           <!-- 下管 -->
        <line x1="430" y1="338" x2="648" y2="342"/>           <!-- 上管 -->
        <line x1="648" y1="342" x2="690" y2="480"/>           <!-- 前叉 -->
      </g>
      <!-- 车座 -->
      <path d="M398 330 Q430 318 464 330 Q464 344 430 344 Q398 344 398 330 Z" fill="#4e342e"/>
      <!-- 车把立管 + 弯把 -->
      <line x1="648" y1="342" x2="662" y2="300" stroke="#37474f" stroke-width="9" stroke-linecap="round"/>
      <path d="M662 300 Q700 292 706 316 Q708 330 692 332" fill="none" stroke="#37474f" stroke-width="9" stroke-linecap="round"/>

      <!-- 曲柄 + 脚踏 + 鹈鹕双腿（整体绕曲柄轴旋转） -->
      <g transform="translate(500,480)">
        <g class="crank">
          <!-- 左腿（远侧，颜色稍深） -->
          <g stroke="#d8b48c" stroke-width="13" stroke-linecap="round" fill="none">
            <path d="M 0 -34 L -16 -50 L -24 -58"/>
          </g>
          <ellipse cx="-26" cy="-60" rx="16" ry="8" fill="#d8b48c" transform="rotate(-16 -26 -60)"/>
          <!-- 曲柄臂与脚踏 -->
          <line x1="0" y1="0" x2="0" y2="-34" stroke="#37474f" stroke-width="9" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="0" y2="34" stroke="#37474f" stroke-width="9" stroke-linecap="round"/>
          <rect x="-24" y="-42" width="46" height="12" rx="5" fill="#263238"/>
          <rect x="-22" y="30" width="46" height="12" rx="5" fill="#263238"/>
          <circle cx="0" cy="0" r="13" fill="#546e7a"/>
          <circle cx="0" cy="0" r="6" fill="#cfd8dc"/>
          <!-- 右腿（近侧） -->
          <g stroke="#f0c9a0" stroke-width="14" stroke-linecap="round" fill="none">
            <path d="M 0 34 L 18 10 L 26 -44"/>
          </g>
          <ellipse cx="28" cy="-46" rx="17" ry="8.5" fill="#f0c9a0" transform="rotate(-14 28 -46)"/>
        </g>
      </g>

      <!-- ===== 鹈鹕身体（随踏频起伏） ===== -->
      <g class="pelican-body">
        <!-- 尾羽 -->
        <g class="tail">
          <path d="M352 296 Q300 280 276 296 Q306 300 318 312 Q292 312 282 326 Q316 324 336 318 Z" fill="#e8e4da"/>
        </g>
        <!-- 躯干 -->
        <ellipse cx="420" cy="300" rx="82" ry="58" fill="#f7f4ec" transform="rotate(-12 420 300)"/>
        <ellipse cx="438" cy="318" rx="52" ry="34" fill="#ffffff" transform="rotate(-12 438 318)"/>
        <!-- 翅膀（扶着车把方向伸展） -->
        <g class="wing">
          <path d="M436 268 Q520 250 590 282 Q560 300 516 300 Q470 300 436 288 Z" fill="#efece2"/>
          <path d="M590 282 Q630 292 662 302 Q630 310 596 302 Q566 296 552 292 Z" fill="#e3ded0"/>
          <path d="M470 276 Q530 266 574 286" fill="none" stroke="#d9d3c2" stroke-width="4" stroke-linecap="round"/>
          <!-- 翼尖"手"搭在车把上 -->
          <ellipse cx="668" cy="306" rx="15" ry="10" fill="#efece2" transform="rotate(18 668 306)"/>
        </g>

        <!-- 脖子 -->
        <path d="M462 272 Q500 230 492 192 Q488 172 470 166 Q452 160 444 176 Q436 194 442 218 Q448 248 428 278 Z" fill="#f7f4ec"/>

        <!-- ===== 头部 ===== -->
        <g class="pelican-head">
          <!-- 头 -->
          <ellipse cx="452" cy="164" rx="34" ry="27" fill="#f7f4ec"/>
          <!-- 头顶呆毛 -->
          <path d="M436 140 Q428 122 414 118 Q428 128 432 142 Z" fill="#e8e4da"/>
          <path d="M448 136 Q446 116 434 108 Q448 118 452 138 Z" fill="#e8e4da"/>
          <!-- 眼睛 -->
          <g class="eye">
            <circle cx="442" cy="156" r="7.5" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
            <circle cx="443.5" cy="157" r="3.6" fill="#263238"/>
          </g>
          <!-- 上喙 -->
          <path d="M478 152 Q560 146 622 158 Q628 161 622 166 Q556 168 480 168 Z" fill="#ffb74d"/>
          <!-- 喉囊（标志性大口袋） -->
          <path d="M480 168 Q540 176 600 168 Q596 208 556 224 Q516 236 490 214 Q478 196 480 168 Z" fill="#ffcc80"/>
          <path d="M494 196 Q530 210 566 202" fill="none" stroke="#f2b26a" stroke-width="4" stroke-linecap="round"/>
          <!-- 下喙边缘线 -->
          <path d="M480 168 Q556 168 622 166" fill="none" stroke="#f49f2e" stroke-width="3.5" stroke-linecap="round"/>
          <!-- 喙尖钩 -->
          <path d="M622 158 Q632 160 630 168 Q624 172 618 166 Z" fill="#f49f2e"/>
          <!-- 腮红 -->
          <ellipse cx="428" cy="172" rx="9" ry="6" fill="#ffcdd2" opacity=".8"/>
        </g>
      </g>
    </g>

    <!-- 前轮扬起的尘点 -->
    <g fill="#cbb797">
      <circle cx="760" cy="545" r="5">
        <animate attributeName="opacity" values="0;.8;0" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="545;530" dur="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="782" cy="550" r="4">
        <animate attributeName="opacity" values="0;.7;0" dur="0.8s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="550;534" dur="0.8s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </svg>
  </div>
</body>
</html>
