<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #90EE90 50%, #228B22 100%);
            font-family: Arial, sans-serif;
        }
        
        .container {
            text-align: center;
            max-width: 900px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        svg {
            border: 2px solid #ddd;
            border-radius: 10px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 60%, #90EE90 60%, #228B22 100%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .controls {
            margin-top: 20px;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #45a049;
        }
        
        .info {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦤 鹈鹕骑自行车 🚲</h1>
        
        <svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
            <!-- 背景 -->
            <defs>
                <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
                </linearGradient>
                
                <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
                </linearGradient>
                
                <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
                </radialGradient>
            </defs>
            
            <!-- 天空 -->
            <rect x="0" y="0" width="800" height="240" fill="url(#skyGrad)" />
            
            <!-- 太阳 -->
            <circle cx="700" cy="80" r="40" fill="url(#sunGrad)">
                <animate attributeName="cx" values="700;720;700" dur="8s" repeatCount="indefinite" />
            </circle>
            
            <!-- 云朵 -->
            <g opacity="0.8">
                <ellipse cx="150" cy="60" rx="40" ry="20" fill="white">
                    <animate attributeName="cx" values="150;200;150" dur="12s" repeatCount="indefinite" />
                </ellipse>
                <ellipse cx="180" cy="50" rx="35" ry="18" fill="white">
                    <animate attributeName="cx" values="180;230;180" dur="12s" repeatCount="indefinite" />
                </ellipse>
                <ellipse cx="120" cy="55" rx="30" ry="15" fill="white">
                    <animate attributeName="cx" values="120;170;120" dur="12s" repeatCount="indefinite" />
                </ellipse>
            </g>
            
            <g opacity="0.6">
                <ellipse cx="500" cy="100" rx="35" ry="15" fill="white">
                    <animate attributeName="cx" values="500;550;500" dur="15s" repeatCount="indefinite" />
                </ellipse>
                <ellipse cx="530" cy="90" rx="30" ry="12" fill="white">
                    <animate attributeName="cx" values="530;580;530" dur="15s" repeatCount="indefinite" />
                </ellipse>
            </g>
            
            <!-- 地面 -->
            <rect x="0" y="240" width="800" height="160" fill="url(#groundGrad)" />
            
            <!-- 道路 -->
            <rect x="0" y="280" width="800" height="40" fill="#666" />
            <line x1="0" y1="300" x2="800" y2="300" stroke="#FFF" stroke-width="2" stroke-dasharray="20,20">
                <animate attributeName="stroke-dashoffset" values="0;-40" dur="1s" repeatCount="indefinite" />
            </line>
            
            <!-- 树木 -->
            <g>
                <rect x="50" y="200" width="20" height="80" fill="#8B4513" />
                <circle cx="60" cy="180" r="30" fill="#228B22" />
                <circle cx="40" cy="190" r="25" fill="#32CD32" />
                <circle cx="80" cy="190" r="25" fill="#32CD32" />
            </g>
            
            <g>
                <rect x="700" y="210" width="15" height="70" fill="#8B4513" />
                <circle cx="707" cy="190" r="25" fill="#228B22" />
                <circle cx="690" cy="200" r="20" fill="#32CD32" />
                <circle cx="725" cy="200" r="20" fill="#32CD32" />
            </g>
            
            <!-- 自行车 -->
            <g transform="translate(400, 280)">
                <!-- 后轮 -->
                <circle cx="-60" cy="0" r="35" fill="none" stroke="#333" stroke-width="4">
                    <animateTransform attributeName="transform" type="rotate" from="0 -60 0" to="360 -60 0" dur="2s" repeatCount="indefinite" />
                </circle>
                <circle cx="-60" cy="0" r="3" fill="#333" />
                
                <!-- 前轮 -->
                <circle cx="60" cy="0" r="35" fill="none" stroke="#333" stroke-width="4">
                    <animateTransform attributeName="transform" type="rotate" from="0 60 0" to="360 60 0" dur="2s" repeatCount="indefinite" />
                </circle>
                <circle cx="60" cy="0" r="3" fill="#333" />
                
                <!-- 车架 -->
                <path d="M-60,0 L-30,-40 L30,-40 L60,0" fill="none" stroke="#FF6347" stroke-width="4" stroke-linejoin="round" />
                <line x1="-30" y1="-40" x2="-30" y2="0" stroke="#FF6347" stroke-width="4" />
                <line x1="30" y1="-40" x2="30" y2="0" stroke="#FF6347" stroke-width="4" />
                
                <!-- 车把 -->
                <line x1="30" y1="-40" x2="40" y2="-60" stroke="#FF6347" stroke-width="4" />
                <line x1="40" y1="-60" x2="50" y2="-55" stroke="#FF6347" stroke-width="4" />
                
                <!-- 座椅 -->
                <line x1="-30" y1="-40" x2="-35" y2="-55" stroke="#FF6347" stroke-width="4" />
                <ellipse cx="-35" cy="-55" rx="15" ry="5" fill="#8B4513" />
                
                <!-- 曲柄和脚踏 -->
                <g>
                    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite" />
                    <line x1="0" y1="0" x2="0" y2="25" stroke="#333" stroke-width="3" />
                    <rect x="-8" y="20" width="16" height="8" fill="#333" />
                </g>
                <g>
                    <animateTransform attributeName="transform" type="rotate" from="180 0 0" to="540 0 0" dur="2s" repeatCount="indefinite" />
                    <line x1="0" y1="0" x2="0" y2="25" stroke="#333" stroke-width="3" />
                    <rect x="-8" y="20" width="16" height="8" fill="#333" />
                </g>
                
                <!-- 链条 -->
                <path d="M0,0 Q-30,20 -60,0" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="4,2" />
            </g>
            
            <!-- 鹈鹕 -->
            <g transform="translate(400, 280)">
                <!-- 身体 -->
                <ellipse cx="-10" cy="-80" rx="25" ry="30" fill="#F5F5DC" />
                
                <!-- 脖子 -->
                <path d="M-10,-110 Q-5,-130 0,-140 Q5,-130 10,-110" fill="#F5F5DC" stroke="#D3D3D3" stroke-width="2" />
                
                <!-- 头部 -->
                <circle cx="0" cy="-145" r="20" fill="#F5F5DC" />
                
                <!-- 眼睛 -->
                <circle cx="-8" cy="-150" r="3" fill="black" />
                <circle cx="8" cy="-150" r="3" fill="black" />
                <circle cx="-7" cy="-151" r="1" fill="white" />
                <circle cx="9" cy="-151" r="1" fill="white" />
                
                <!-- 大嘴 -->
                <path d="M-20,-145 Q-40,-140 -35,-130 Q-30,-125 -20,-130 Z" fill="#FFA500" />
                <path d="M20,-145 Q40,-140 35,-130 Q30,-125 20,-130 Z" fill="#FFA500" />
                
                <!-- 喉囊 -->
                <ellipse cx="0" cy="-125" rx="15" ry="8" fill="#FFD700" opacity="0.7">
                    <animate attributeName="ry" values="8;12;8" dur="2s" repeatCount="indefinite" />
                </ellipse>
                
                <!-- 翅膀 -->
                <path d="M-35,-80 Q-50,-70 -45,-60 Q-40,-50 -30,-60" fill="#F5F5DC" stroke="#D3D3D3" stroke-width="2">
                    <animate attributeName="d" values="M-35,-80 Q-50,-70 -45,-60 Q-40,-50 -30,-60;M-35,-80 Q-55,-75 -50,-65 Q-45,-55 -30,-60;M-35,-80 Q-50,-70 -45,-60 Q-40,-50 -30,-60" dur="1s" repeatCount="indefinite" />
                </path>
                <path d="M35,-80 Q50,-70 45,-60 Q40,-50 30,-60" fill="#F5F5DC" stroke="#D3D3D3" stroke-width="2">
                    <animate attributeName="d" values="M35,-80 Q50,-70 45,-60 Q40,-50 30,-60;M35,-80 Q55,-75 50,-65 Q45,-55 30,-60;M35,-80 Q50,-70 45,-60 Q40,-50 30,-60" dur="1s" repeatCount="indefinite" />
                </path>
                
                <!-- 腿 -->
                <line x1="-15" y1="-50" x2="-20" y2="-25" stroke="#FFA500" stroke-width="3" />
                <line x1="15" y1="-50" x2="20" y2="-25" stroke="#FFA500" stroke-width="3" />
                
                <!-- 脚 -->
                <ellipse cx="-20" cy="-25" rx="8" ry="3" fill="#FFA500" />
                <ellipse cx="20" cy="-25" rx="8" ry="3" fill="#FFA500" />
                
                <!-- 帽子 -->
                <ellipse cx="0" cy="-165" rx="25" ry="8" fill="#FF6347" />
                <rect x="-15" y="-180" width="30" height="15" fill="#FF6347" />
                <rect x="-10" y="-185" width="20" height="5" fill="#FF4500" />
            </g>
            
            <!-- 运动效果线 -->
            <g opacity="0.6">
                <line x1="350" y1="280" x2="300" y2="280" stroke="#333" stroke-width="2">
                    <animate attributeName="x1" values="350;320;350" dur="0.5s" repeatCount="indefinite" />
                    <animate attributeName="x2" values="300;270;300" dur="0.5s" repeatCount="indefinite" />
                </line>
                <line x1="340" y1="270" x2="290" y2="270" stroke="#333" stroke-width="2">
                    <animate attributeName="x1" values="340;310;340" dur="0.5s" repeatCount="indefinite" />
                    <animate attributeName="x2" values="290;260;290" dur="0.5s" repeatCount="indefinite" />
                </line>
                <line x1="360" y1="290" x2="310" y2="290" stroke="#333" stroke-width="2">
                    <animate attributeName="x1" values="360;330;360" dur="0.5s" repeatCount="indefinite" />
                    <animate attributeName="x2" values="310;280;310" dur="0.5s" repeatCount="indefinite" />
                </line>
            </g>
        </svg>
        
        <div class="controls">
            <button onclick="toggleAnimation()">暂停/继续</button>
            <button onclick="changeSpeed('slow')">慢速</button>
            <button onclick="changeSpeed('normal')">正常</button>
            <button onclick="changeSpeed('fast')">快速</button>
        </div>
        
        <div class="info">
            <p>鹈鹕骑自行车动画 - 使用纯SVG和CSS动画创建</p>
            <p>点击按钮控制动画速度和播放状态</p>
        </div>
    </div>

    <script>
        let animationPlaying = true;
        const svgElement = document.querySelector('svg');
        
        function toggleAnimation() {
            if (animationPlaying) {
                svgElement.pauseAnimations();
                animationPlaying = false;
            } else {
                svgElement.unpauseAnimations();
                animationPlaying = true;
            }
        }
        
        function changeSpeed(speed) {
            const animations = svgElement.getAnimations();
            animations.forEach(anim => {
                switch(speed) {
                    case 'slow':
                        anim.playbackRate = 0.5;
                        break;
                    case 'normal':
                        anim.playbackRate = 1;
                        break;
                    case 'fast':
                        anim.playbackRate = 2;
                        break;
                }
            });
        }
        
        // 页面加载完成后初始化
        window.addEventListener('load', () => {
            console.log('鹈鹕骑自行车动画已加载');
        });
    </script>
</body>
</html>
