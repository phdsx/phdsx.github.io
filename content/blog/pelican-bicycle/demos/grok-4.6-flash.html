<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑自行车 2D 动画</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(#87CEEB 0%, #87CEEB 60%, #90EE90 60%, #228B22 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    svg {
      width: 100%;
      max-width: 900px;
      height: auto;
      background: transparent;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg">
    <!-- 地面 -->
    <rect x="0" y="320" width="900" height="130" fill="#228B22"/>
    <rect x="0" y="320" width="900" height="8" fill="#555"/>

    <!-- 太阳 -->
    <circle cx="780" cy="80" r="40" fill="#FFD700"/>

    <!-- 云朵 -->
    <g fill="#fff" opacity="0.9">
      <ellipse cx="150" cy="70" rx="40" ry="25"/>
      <ellipse cx="180" cy="65" rx="35" ry="22"/>
      <ellipse cx="120" cy="75" rx="30" ry="18"/>
      
      <ellipse cx="450" cy="50" rx="50" ry="28"/>
      <ellipse cx="490" cy="45" rx="40" ry="25"/>
      <ellipse cx="410" cy="55" rx="35" ry="20"/>
    </g>

    <!-- 整车 + 鹈鹕 整体移动 -->
    <g id="rider">
      <!-- 自行车后轮 -->
      <g transform="translate(120, 280)">
        <circle r="38" fill="none" stroke="#333" stroke-width="6"/>
        <circle r="8" fill="#333"/>
        <!-- 辐条 -->
        <g stroke="#555" stroke-width="2">
          <line x1="0" y1="-38" x2="0" y2="38"/>
          <line x1="-38" y1="0" x2="38" y2="0"/>
          <line x1="-27" y1="-27" x2="27" y2="27"/>
          <line x1="-27" y1="27" x2="27" y2="-27"/>
        </g>
        <animateTransform attributeName="transform" type="rotate"
          from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      </g>

      <!-- 自行车前轮 -->
      <g transform="translate(260, 280)">
        <circle r="38" fill="none" stroke="#333" stroke-width="6"/>
        <circle r="8" fill="#333"/>
        <g stroke="#555" stroke-width="2">
          <line x1="0" y1="-38" x2="0" y2="38"/>
          <line x1="-38" y1="0" x2="38" y2="0"/>
          <line x1="-27" y1="-27" x2="27" y2="27"/>
          <line x1="-27" y1="27" x2="27" y2="-27"/>
        </g>
        <animateTransform attributeName="transform" type="rotate"
          from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      </g>

      <!-- 车架 -->
      <g stroke="#2c3e50" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- 下管 -->
        <line x1="120" y1="280" x2="200" y2="220"/>
        <!-- 上管 -->
        <line x1="140" y1="230" x2="230" y2="220"/>
        <!-- 立管 -->
        <line x1="200" y1="220" x2="200" y2="280"/>
        <!-- 前叉 -->
        <line x1="230" y1="220" x2="260" y2="280"/>
        <!-- 后叉 -->
        <line x1="120" y1="280" x2="140" y2="230"/>
        <!-- 车把 -->
        <line x1="230" y1="220" x2="250" y2="195"/>
        <line x1="250" y1="195" x2="275" y2="195"/>
        <!-- 坐垫支撑 -->
        <line x1="140" y1="230" x2="155" y2="205"/>
      </g>

      <!-- 坐垫 -->
      <ellipse cx="155" cy="200" rx="22" ry="10" fill="#8B4513"/>

      <!-- 脚踏板中心 -->
      <circle cx="200" cy="280" r="6" fill="#555"/>

      <!-- 脚踏板（旋转） -->
      <g transform="translate(200, 280)">
        <line x1="0" y1="0" x2="0" y2="28" stroke="#444" stroke-width="4"/>
        <rect x="-8" y="26" width="16" height="6" rx="2" fill="#666"/>
        <animateTransform attributeName="transform" type="rotate"
          from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      </g>

      <!-- ===== 鹈鹕 ===== -->
      <!-- 身体 -->
      <ellipse cx="175" cy="175" rx="45" ry="28" fill="#f5f5dc"/>
      
      <!-- 翅膀（轻微扇动） -->
      <g>
        <path d="M140,165 Q110,140 95,165 Q115,175 140,165" fill="#e8e0c8"/>
        <animate attributeName="d"
          values="M140,165 Q110,140 95,165 Q115,175 140,165;
                  M140,165 Q105,130 90,155 Q115,175 140,165;
                  M140,165 Q110,140 95,165 Q115,175 140,165"
          dur="0.8s" repeatCount="indefinite"/>
      </g>

      <!-- 脖子 -->
      <path d="M200,160 Q230,140 245,155" fill="none" stroke="#f5f5dc" stroke-width="18" stroke-linecap="round"/>

      <!-- 头 -->
      <circle cx="250" cy="155" r="18" fill="#f5f5dc"/>

      <!-- 眼睛 -->
      <circle cx="255" cy="150" r="4" fill="#222"/>
      <circle cx="256" cy="149" r="1.5" fill="#fff"/>

      <!-- 长嘴巴（鹈鹕特征） -->
      <path d="M265,155 Q310,145 320,160 Q310,175 265,165 Z" fill="#f4a460"/>
      <path d="M265,160 Q300,155 310,162" fill="none" stroke="#d2691e" stroke-width="2"/>

      <!-- 脚（踩踏） -->
      <g>
        <!-- 左腿 -->
        <line x1="165" y1="200" x2="185" y2="255" stroke="#f5f5dc" stroke-width="8" stroke-linecap="round"/>
        <ellipse cx="185" cy="260" rx="10" ry="6" fill="#f4a460"/>
        
        <!-- 右腿（跟着脚踏板动） -->
        <g>
          <line x1="185" y1="200" x2="200" y2="265" stroke="#f5f5dc" stroke-width="8" stroke-linecap="round"/>
          <ellipse cx="200" cy="270" rx="10" ry="6" fill="#f4a460"/>
          <animateTransform attributeName="transform" type="rotate"
            values="0 185 200; 25 185 200; 0 185 200; -25 185 200; 0 185 200"
            dur="1.2s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- 尾巴 -->
      <path d="M130,175 Q105,160 100,185 Q115,190 130,175" fill="#e8e0c8"/>
    </g>

    <!-- 整体左右循环移动 -->
    <animateTransform xlink:href="#rider" attributeName="transform" type="translate"
      values="-350,0; 950,0" dur="8s" repeatCount="indefinite"/>
  </svg>
</body>
</html>
