<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · 2D SVG 动画</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    width: min(92vw, 880px);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    background: #87c5e8;
  }
  svg { display: block; width: 100%; height: auto; }

  /* 整车上下颠簸 */
  #scene { animation: bob 0.6s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  /* 云朵漂移 */
  .cloud { animation: drift 22s linear infinite; }
  .cloud.c2 { animation-duration: 30s; animation-delay: -8s; }
  .cloud.c3 { animation-duration: 26s; animation-delay: -15s; }
  @keyframes drift {
    from { transform: translateX(900px); }
    to   { transform: translateX(-260px); }
  }

  /* 速度线闪动 */
  .speed { animation: streak 0.5s linear infinite; }
  .speed.s2 { animation-delay: 0.15s; }
  .speed.s3 { animation-delay: 0.30s; }
  @keyframes streak {
    0%   { opacity: 0;   transform: translateX(20px); }
    40%  { opacity: .9; }
    100% { opacity: 0;   transform: translateX(-40px); }
  }

  /* 翅膀扇动 */
  #wing { transform-box: fill-box; transform-origin: 80% 10%; animation: flap 0.6s ease-in-out infinite; }
  @keyframes flap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-14deg); }
  }

  /* 喉囊开合 */
  #pouch { transform-box: fill-box; transform-origin: 100% 0%; animation: gape 1s ease-in-out infinite; }
  @keyframes gape {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(7deg); }
  }

  .title {
    position: absolute; left: 22px; top: 16px;
    color: #ffffff; font-weight: 700; letter-spacing: 2px;
    font-size: 15px; text-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .wrap { position: relative; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="title">PELICAN ON A BIKE</div>
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <lineargradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#aee3ff"></stop>
          <stop offset="100%" stop-color="#d8f3ff"></stop>
        </lineargradient>
        <lineargradient id="grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8fd36a"></stop>
          <stop offset="100%" stop-color="#5fb24a"></stop>
        </lineargradient>
        <radialgradient id="sun" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6c4"></stop>
          <stop offset="100%" stop-color="#ffd24a"></stop>
        </radialgradient>
        <lineargradient id="body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"></stop>
          <stop offset="100%" stop-color="#dfe6ee"></stop>
        </lineargradient>
      </defs>

      <!-- 背景 -->
      <rect x="0" y="0" width="800" height="500" fill="url(#sky)"></rect>
      <circle cx="700" cy="90" r="46" fill="url(#sun)"></circle>
      <circle cx="700" cy="90" r="60" fill="#fff3b0" opacity="0.25"></circle>

      <!-- 云 -->
      <g class="cloud c1" fill="#ffffff" opacity="0.9">
        <ellipse cx="120" cy="110" rx="46" ry="26"></ellipse>
        <ellipse cx="160" cy="95" rx="38" ry="30"></ellipse>
        <ellipse cx="90" cy="98" rx="30" ry="22"></ellipse>
      </g>
      <g class="cloud c2" fill="#ffffff" opacity="0.85">
        <ellipse cx="400" cy="70" rx="40" ry="22"></ellipse>
        <ellipse cx="435" cy="58" rx="32" ry="24"></ellipse>
        <ellipse cx="372" cy="60" rx="26" ry="18"></ellipse>
      </g>
      <g class="cloud c3" fill="#ffffff" opacity="0.8">
        <ellipse cx="600" cy="150" rx="34" ry="18"></ellipse>
        <ellipse cx="628" cy="140" rx="26" ry="20"></ellipse>
      </g>

      <!-- 地面 -->
      <rect x="0" y="448" width="800" height="52" fill="url(#grass)"></rect>
      <path d="M0 448 Q 200 440 400 448 T 800 448 L800 460 L0 460 Z" fill="#7cc35f"></path>

      <!-- 速度线 -->
      <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8">
        <line class="speed" x1="60" y1="300" x2="140" y2="300"></line>
        <line class="speed s2" x1="40" y1="340" x2="120" y2="340"></line>
        <line class="speed s3" x1="70" y1="380" x2="150" y2="380"></line>
      </g>

      <!-- 骑行主体 -->
      <g id="scene">

        <!-- ========== 自行车 + 鹈鹕腿（随踏板旋转） ========== -->
        <g id="bike">

          <!-- 车架 -->
          <g stroke="#2f6fb0" stroke-width="9" stroke-linecap="round" fill="none">
            <line x1="250" y1="380" x2="400" y2="380"></line>  <!-- 后下管 -->
            <line x1="400" y1="380" x2="375" y2="248"></line>  <!-- 座管 -->
            <line x1="375" y1="248" x2="515" y2="245"></line>  <!-- 上管 -->
            <line x1="515" y1="245" x2="550" y2="380"></line>  <!-- 前叉 -->
            <line x1="515" y1="245" x2="528" y2="232"></line>  <!-- 把立 -->
            <line x1="505" y1="235" x2="540" y2="240"></line>  <!-- 车把 -->
          </g>
          <!-- 车座 -->
          <path d="M352 246 Q 375 238 398 246 Q 380 256 360 252 Z" fill="#1f2937"></path>
          <!-- 车把把手 -->
          <circle cx="540" cy="240" r="6" fill="#1f2937"></circle>

          <!-- 后轮 -->
          <g>
            <circle cx="250" cy="380" r="70" fill="none" stroke="#222" stroke-width="9"></circle>
            <circle cx="250" cy="380" r="60" fill="none" stroke="#9aa3ad" stroke-width="2"></circle>
            <g stroke="#c2c9d1" stroke-width="3">
              <line x1="190" y1="380" x2="310" y2="380"></line>
              <line x1="250" y1="320" x2="250" y2="440"></line>
              <line x1="208" y1="338" x2="292" y2="422"></line>
              <line x1="208" y1="422" x2="292" y2="338"></line>
            </g>
            <circle cx="250" cy="380" r="8" fill="#444"></circle>
            <animatetransform attributeName="transform" attributeType="XML" type="rotate" from="0 250 380" to="360 250 380" dur="1.2s" repeatCount="indefinite"></animatetransform>
          </g>

          <!-- 前轮 -->
          <g>
            <circle cx="550" cy="380" r="70" fill="none" stroke="#222" stroke-width="9"></circle>
            <circle cx="550" cy="380" r="60" fill="none" stroke="#9aa3ad" stroke-width="2"></circle>
            <g stroke="#c2c9d1" stroke-width="3">
              <line x1="490" y1="380" x2="610" y2="380"></line>
              <line x1="550" y1="320" x2="550" y2="440"></line>
              <line x1="508" y1="338" x2="592" y2="422"></line>
              <line x1="508" y1="422" x2="592" y2="338"></line>
            </g>
            <circle cx="550" cy="380" r="8" fill="#444"></circle>
            <animatetransform attributeName="transform" attributeType="XML" type="rotate" from="0 550 380" to="360 550 380" dur="1.2s" repeatCount="indefinite"></animatetransform>
          </g>

          <!-- 踏板 + 鹈鹕腿（整体绕曲柄中心旋转） -->
          <g>
            <!-- 曲柄臂 -->
            <line x1="400" y1="380" x2="400" y2="418" stroke="#374151" stroke-width="7" stroke-linecap="round"></line>
            <rect x="384" y="414" width="32" height="10" rx="3" fill="#111827"></rect>
            <!-- 鹈鹕腿（大腿深入身体被遮挡） -->
            <path d="M360 250 L392 330 L400 414" fill="none" stroke="#ff9f43" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path>
            <!-- 蹼足 -->
            <path d="M392 414 L420 414 L408 426 Z" fill="#ffb86b"></path>
            <animatetransform attributeName="transform" attributeType="XML" type="rotate" from="0 400 380" to="360 400 380" dur="1.2s" repeatCount="indefinite"></animatetransform>
          </g>

          <!-- 另一侧静态腿（远侧，做点缀） -->
          <path d="M372 252 L404 332 L412 412" fill="none" stroke="#e8852f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"></path>
        </g>

        <!-- ========== 鹈鹕身体 ========== -->
        <g id="pelican">
          <!-- 尾巴 -->
          <path d="M408 200 Q 452 188 460 210 Q 440 222 410 214 Z" fill="#cfd8e3"></path>
          <!-- 身体 -->
          <ellipse cx="360" cy="200" rx="58" ry="46" fill="url(#body)" stroke="#c3ccd6" stroke-width="2" transform="rotate(-8 360 200)"></ellipse>
          <!-- 翅膀 -->
          <g id="wing">
            <path d="M340 175 Q 300 185 312 235 Q 350 240 372 210 Q 360 185 340 175 Z" fill="#eef2f6" stroke="#c3ccd6" stroke-width="2"></path>
            <path d="M330 200 Q 345 205 360 200" fill="none" stroke="#c3ccd6" stroke-width="2"></path>
          </g>
          <!-- 脖子 -->
          <path d="M338 168 Q 330 140 332 122 L356 122 Q 360 150 360 175 Z" fill="url(#body)" stroke="#c3ccd6" stroke-width="2"></path>
          <!-- 头 -->
          <circle cx="336" cy="120" r="30" fill="url(#body)" stroke="#c3ccd6" stroke-width="2"></circle>
          <!-- 上喙 -->
          <path d="M312 116 L250 150 L312 132 Z" fill="#ff9f43" stroke="#e8852f" stroke-width="2"></path>
          <!-- 喉囊（可开合） -->
          <g id="pouch">
            <path d="M310 132 Q 280 150 250 150 Q 278 168 312 150 Z" fill="#ffb86b" stroke="#e8852f" stroke-width="2"></path>
          </g>
          <!-- 眼睛 -->
          <circle cx="340" cy="114" r="6" fill="#fff"></circle>
          <circle cx="341" cy="115" r="3.4" fill="#1f2937"></circle>
          <!-- 腮红 -->
          <circle cx="350" cy="128" r="5" fill="#ffb3b3" opacity="0.7"></circle>
        </g>

      </g>
    </svg>
  </div>
</div>


</body>
</html>
