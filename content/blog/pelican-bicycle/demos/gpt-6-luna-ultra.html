<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3e8">
  <title>海风里的自行车鹈鹕</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #183a45;
      --paper: #f7f3e8;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(ellipse at 50% 8%, #fffdf5 0, transparent 48%),
        var(--paper);
      color: var(--ink);
      font-family: ui-rounded, "Trebuchet MS", "Microsoft YaHei", sans-serif;
    }
    .card { width: min(100%, 1000px); }
    .heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 4px 13px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 3vw, 2rem);
      letter-spacing: .04em;
    }
    .subtitle { margin: 6px 0 0; color: #527077; font-size: .96rem; }
    .stage {
      overflow: hidden;
      border: 3px solid var(--ink);
      border-radius: 22px;
      background: #b8e6e3;
      box-shadow: 0 9px 0 #183a4518, 0 20px 45px #183a4514;
    }
    svg { display: block; width: 100%; height: auto; }
    .controls { display: flex; justify-content: flex-end; margin-top: 13px; }
    button {
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 9px 16px;
      color: var(--ink);
      background: #fffdf5;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--ink);
    }
    button:hover { background: #ffdf83; }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
    button:focus-visible { outline: 3px solid #e97842; outline-offset: 4px; }

    .clouds { animation: cloud-drift 30s linear infinite; }
    .far-clouds { animation: cloud-drift 42s linear infinite reverse; }
    .waves { animation: wave-drift 9s ease-in-out infinite alternate; }
    .road-dashes { animation: road-roll 1.4s linear infinite; }
    .rear-wheel, .front-wheel { transform-box: fill-box; transform-origin: center; animation: wheel-spin 1.3s linear infinite; }
    .crank, .pedal-foot { transform-box: view-box; transform-origin: 51.11% 75%; animation: wheel-spin 1.3s linear infinite; }
    .rider { transform-box: view-box; transform-origin: 51.67% 54.64%; animation: ride-bob .65s ease-in-out infinite alternate; }
    .front-leg { transform-box: view-box; transform-origin: 48% 54.64%; animation: pedal-front 1.3s ease-in-out infinite; }
    .back-leg { transform-box: view-box; transform-origin: 47.22% 54.82%; animation: pedal-back 1.3s ease-in-out infinite; }
    .sparkle { animation: twinkle 2.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .sparkle.delay { animation-delay: -1.1s; }
    .motion-paused *, .motion-paused *::before, .motion-paused *::after { animation-play-state: paused !important; }
    @keyframes wheel-spin { to { transform: rotate(360deg); } }
    @keyframes pedal-front { 0%,100% { transform: rotate(-17deg); } 50% { transform: rotate(17deg); } }
    @keyframes pedal-back { 0%,100% { transform: rotate(17deg); } 50% { transform: rotate(-17deg); } }
    @keyframes ride-bob { from { transform: translateY(0) rotate(-.8deg); } to { transform: translateY(-4px) rotate(.8deg); } }
    @keyframes cloud-drift { from { transform: translateX(-90px); } to { transform: translateX(150px); } }
    @keyframes wave-drift { from { transform: translateX(-15px); } to { transform: translateX(18px); } }
    @keyframes road-roll { from { transform: translateX(0); } to { transform: translateX(-100px); } }
    @keyframes twinkle { from { opacity: .35; transform: scale(.75) rotate(0); } to { opacity: 1; transform: scale(1.1) rotate(18deg); } }
    @media (max-width: 600px) {
      body { padding: 18px 12px; }
      .heading { align-items: start; flex-direction: column; gap: 2px; }
      .stage { border-radius: 15px; border-width: 2px; }
      .controls { justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="heading">
      <div>
        <h1>海风里的自行车鹈鹕</h1>
        <p class="subtitle">沿着海岸线，慢悠悠地兜风。</p>
      </div>
    </header>
    <div class="stage">
      <svg id="scene" viewBox="0 0 900 560" role="img" aria-labelledby="svg-title svg-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="svg-title">鹈鹕骑自行车的动画</title>
        <desc id="svg-desc">一只橘黄嘴巴的鹈鹕骑着蓝绿色自行车，沿海边小路前进，车轮和脚踏持续转动。</desc>
        <defs>
          <linearGradient id="sky" x2="0" y2="1">
            <stop stop-color="#8fd8df"/>
            <stop offset="1" stop-color="#d7f0df"/>
          </linearGradient>
          <linearGradient id="sea" x2="0" y2="1">
            <stop stop-color="#63bfc2"/>
            <stop offset="1" stop-color="#328e9b"/>
          </linearGradient>
          <linearGradient id="feather" x2="0.7" y2="1">
            <stop stop-color="#fff7df"/>
            <stop offset="1" stop-color="#ead7a9"/>
          </linearGradient>
          <clipPath id="scene-clip"><rect width="900" height="560" rx="18"/></clipPath>
        </defs>
        <g clip-path="url(#scene-clip)" stroke-linecap="round" stroke-linejoin="round">
          <!-- Sky and faraway coast -->
          <rect width="900" height="560" fill="url(#sky)"/>
          <circle cx="755" cy="92" r="43" fill="#ffd777"/>
          <g class="far-clouds" fill="#f9fff2" opacity=".78">
            <path d="M93 123c-20 0-28-24-11-36 7-5 15-5 22-2 5-20 34-25 47-8 22-9 42 8 36 28 14 17 0 38-20 38H97c-22 0-27-27-4-36z"/>
            <path d="M650 166c-15 0-21-18-8-27 5-4 11-4 16-2 4-15 25-19 35-6 16-7 31 6 27 21 11 13 0 28-15 28h-52c-16 0-20-20-3-27z"/>
          </g>
          <g class="clouds" fill="#fffdf5" opacity=".86">
            <path d="M326 88c-14 0-20-17-7-25 5-4 10-4 15-2 4-14 23-17 33-5 15-6 28 6 24 20 10 12 0 26-14 26h-47c-15 0-18-18-4-25z"/>
            <path d="M842 247c-12 0-17-14-6-21 4-3 9-3 13-2 3-11 19-14 27-4 12-5 23 5 20 16 8 10 0 22-12 22h-39c-12 0-15-15-3-21z"/>
          </g>
          <path d="M0 273c126-49 205 5 311-17 115-24 194-63 314-28 95 28 178 4 275-24v143H0z" fill="#90c9a1"/>
          <path d="M0 299c108-31 191 24 296-5 91-25 181-46 285-18 116 31 212-5 319-30v148H0z" fill="#69ad91"/>
          <rect x="0" y="311" width="900" height="150" fill="url(#sea)"/>
          <g class="waves" fill="none" stroke="#c4eee0" stroke-width="5" opacity=".75">
            <path d="M-20 350q28-13 56 0t56 0 56 0 56 0 56 0 56 0 56 0 56 0 56 0 56 0 56 0 56 0 56 0 56 0 56 0 56 0 56 0 56 0"/>
            <path d="M20 389q23-10 46 0t46 0 46 0 46 0 46 0 46 0 46 0 46 0 46 0 46 0 46 0 46 0 46 0 46 0 46 0 46 0 46 0" opacity=".62"/>
          </g>
          <!-- Shoreline and road -->
          <path d="M0 433c154-15 246 9 383-1 171-13 333-1 517-19v147H0z" fill="#f4d99e"/>
          <path d="M0 467c173-16 292 8 447-2 163-11 295 3 453-16v111H0z" fill="#e9bb79"/>
          <path d="M0 492h900" stroke="#fff0c8" stroke-width="3" opacity=".8"/>
          <g class="road-dashes" fill="none" stroke="#fff2cf" stroke-width="7" opacity=".8">
            <path d="M-80 532h65m35 0h65m35 0h65m35 0h65m35 0h65m35 0h65m35 0h65m35 0h65m35 0h65m35 0h65m35 0h65m35 0h65m35 0h65"/>
          </g>
          <g fill="#338e88" opacity=".86">
            <path d="M66 428q-18-17-6-37 15 12 9 29 13-31 34-34-1 26-27 42z"/>
            <path d="M823 425q-16-16-5-33 14 11 8 26 12-27 30-30-2 22-24 38z"/>
          </g>
          <!-- Bicycle wheels -->
          <g class="rear-wheel">
            <circle cx="330" cy="420" r="67" fill="#f8f5e9" stroke="#183a45" stroke-width="8"/>
            <circle cx="330" cy="420" r="57" fill="none" stroke="#82a7a5" stroke-width="2"/>
            <g stroke="#82a7a5" stroke-width="2">
              <path d="M330 353v134M263 420h134M283 373l94 94m0-94-94 94"/>
              <path d="m305 355 50 130m-85-40 120-50m-120 0 120 50m-85-130-50 130" opacity=".65"/>
            </g>
            <circle cx="330" cy="420" r="7" fill="#e77b4c" stroke="#183a45" stroke-width="3"/>
          </g>
          <g class="front-wheel">
            <circle cx="605" cy="420" r="67" fill="#f8f5e9" stroke="#183a45" stroke-width="8"/>
            <circle cx="605" cy="420" r="57" fill="none" stroke="#82a7a5" stroke-width="2"/>
            <g stroke="#82a7a5" stroke-width="2">
              <path d="M605 353v134M538 420h134M558 373l94 94m0-94-94 94"/>
              <path d="m580 355 50 130m-85-40 120-50m-120 0 120 50m-85-130-50 130" opacity=".65"/>
            </g>
            <circle cx="605" cy="420" r="7" fill="#e77b4c" stroke="#183a45" stroke-width="3"/>
          </g>
          <!-- Frame, rack and handlebars -->
          <g fill="none" stroke="#167f82" stroke-width="11">
            <path d="M330 420 405 307 460 420 330 420M405 307h139l-84 113-50-113M544 307l61 113M460 420"/>
          </g>
          <g fill="none" stroke="#183a45" stroke-width="7">
            <path d="M398 306h18M399 300l-5 12M534 306l6-25h28m-7 0h18"/>
            <path d="M457 420l-38 2m38-2 26 30" stroke-width="5"/>
          </g>
          <path d="M382 300q23-12 48 0l-3 9h-44z" fill="#ed9958" stroke="#183a45" stroke-width="4"/>
          <path d="M525 278q-5-8 4-10h31" fill="none" stroke="#183a45" stroke-width="6"/>
          <g class="crank" fill="none" stroke="#183a45" stroke-width="5">
            <circle cx="460" cy="420" r="12" fill="#f7d36f"/>
            <path d="M460 420v-35m0 70v-35"/>
            <circle cx="460" cy="385" r="5" fill="#e77b4c"/>
            <circle cx="460" cy="455" r="5" fill="#e77b4c"/>
          </g>
          <g class="pedal-foot" fill="#183a45">
            <rect x="447" y="378" width="26" height="8" rx="4"/>
            <rect x="447" y="455" width="26" height="8" rx="4"/>
          </g>
          <!-- Pelican's cycling legs -->
          <g class="back-leg" fill="none" stroke="#e77b4c" stroke-width="8">
            <path d="M430 302q-15 41 17 63l14 20"/>
            <path d="M453 385l16 1" stroke-width="6"/>
          </g>
          <g class="front-leg" fill="none" stroke="#f29a55" stroke-width="9">
            <path d="M440 302q31 30 10 62l10 20"/>
            <path d="M458 384l17 1" stroke-width="6"/>
          </g>
          <!-- Pelican rider -->
          <g class="rider">
            <!-- body and folded wing -->
            <path d="M416 253c-5-31 17-54 52-53 39 1 62 26 59 58-2 29-28 51-66 49-31-2-49-21-45-54z" fill="url(#feather)" stroke="#183a45" stroke-width="6"/>
            <path d="M429 257c22-23 58-20 78 0-11 23-39 36-67 24-8-4-12-12-11-24z" fill="#d8c391" stroke="#183a45" stroke-width="4"/>
            <path d="M444 264q29-14 50 2m-42 8q19-8 32-2" fill="none" stroke="#f5e8c8" stroke-width="4"/>
            <!-- long neck -->
            <path d="M476 229c17-15 22-30 29-48 5-14 17-20 28-14 13 7 9 24 0 37-11 17-21 29-25 46" fill="url(#feather)" stroke="#183a45" stroke-width="6"/>
            <!-- head -->
            <path d="M493 170c-2-22 13-38 34-38 19 0 31 13 30 31-1 19-14 31-34 31-17 0-28-9-30-24z" fill="#fff5dc" stroke="#183a45" stroke-width="6"/>
            <circle cx="537" cy="156" r="4.5" fill="#183a45"/>
            <circle cx="538" cy="154" r="1.4" fill="#fffdf5"/>
            <!-- enormous pelican bill and pouch -->
            <path d="M548 160c29-8 71-2 104 12-26 15-68 21-101 11-10-3-13-17-3-23z" fill="#f5a33d" stroke="#183a45" stroke-width="5"/>
            <path d="M551 177c31 8 66 8 97-5-13 33-52 49-84 31-10-5-17-17-13-26z" fill="#e87943" stroke="#183a45" stroke-width="5"/>
            <path d="M559 181q29 11 62 0" fill="none" stroke="#ffc46a" stroke-width="3"/>
            <path d="M566 163q31-3 61 5" fill="none" stroke="#ffd27a" stroke-width="3"/>
            <!-- wing/arm reaching for the handlebar -->
            <path d="M477 239q28 4 45 21l28 25q9 8 1 16-7 7-15-1l-33-22q-30-7-40-21z" fill="#f5e7c5" stroke="#183a45" stroke-width="5"/>
            <path d="M535 295q7-9 17-5l8 5q5 4 1 9-8 8-19 1z" fill="#e77b4c" stroke="#183a45" stroke-width="4"/>
            <!-- little tail feathers -->
            <path d="M418 269q-22-7-30 8 15 8 30 5m-5-16q-14-14-26-6 9 13 25 18" fill="#fff5dc" stroke="#183a45" stroke-width="4"/>
          </g>
          <!-- Tiny joyful accents -->
          <g class="sparkle" fill="#fff4bf">
            <path d="M706 260q3 13 16 16-13 3-16 16-3-13-16-16 13-3 16-16z"/>
          </g>
          <g class="sparkle delay" fill="#fff4bf">
            <path d="M235 242q2 9 11 11-9 2-11 11-2-9-11-11 9-2 11-11z"/>
          </g>
          <path d="M677 314q12-10 24 0m-19 12q8-7 16 0" fill="none" stroke="#fff4bf" stroke-width="4" opacity=".85"/>
        </g>
      </svg>
    </div>
    <div class="controls">
      <button id="motion-toggle" type="button" aria-pressed="false">暂停动画</button>
    </div>
  </main>
  <script>
    const scene = document.querySelector('#scene');
    const button = document.querySelector('#motion-toggle');
    button.addEventListener('click', () => {
      const paused = scene.classList.toggle('motion-paused');
      button.setAttribute('aria-pressed', String(paused));
      button.textContent = paused ? '继续播放' : '暂停动画';
    });
  </script>
</body>
</html>
