<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车 - 2D动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, #87ceeb 0%, #b0e0e6 55%, #98d8c8 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .title {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: #2c3e50;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 2px 8px rgba(255,255,255,0.7);
    z-index: 10;
  }
  .subtitle {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    color: #34495e;
    font-size: 13px;
    opacity: 0.8;
    z-index: 10;
  }
  svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* 太阳 */
  @keyframes sunGlow {
    0%, 100% { filter: drop-shadow(0 0 12px rgba(255, 220, 100, 0.8)); }
    50%      { filter: drop-shadow(0 0 22px rgba(255, 220, 100, 1)); }
  }
  .sun {
    transform-origin: center;
    animation: sunGlow 3s ease-in-out infinite;
  }

  /* 云朵漂浮 */
  @keyframes cloudDrift1 {
    from { transform: translateX(-200px); }
    to   { transform: translateX(calc(100vw + 200px)); }
  }
  @keyframes cloudDrift2 {
    from { transform: translateX(-300px); }
    to   { transform: translateX(calc(100vw + 300px)); }
  }
  .cloud-1 { animation: cloudDrift1 38s linear infinite; }
  .cloud-2 { animation: cloudDrift2 55s linear infinite; }

  /* 草丛微摆 */
  @keyframes grassSway {
    0%, 100% { transform: skewX(0deg); }
    50%      { transform: skewX(2deg); }
  }
  .grass { animation: grassSway 2.5s ease-in-out infinite; transform-origin: bottom center; }

  /* 道路虚线平移 */
  @keyframes roadScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-120px); }
  }
  .road-lines { animation: roadScroll 0.6s linear infinite; }

  /* 自行车整体前进 */
  @keyframes bikeMove {
    0%   { transform: translateX(-25vw); }
    100% { transform: translateX(125vw); }
  }
  .bike-rider {
    animation: bikeMove 14s linear infinite;
  }

  /* 车轮旋转 */
  @keyframes wheelSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .wheel-rear, .wheel-front {
    transform-origin: center;
    animation: wheelSpin 0.8s linear infinite;
  }

  /* 鹈鹕身体起伏 */
  @keyframes bodyBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25%      { transform: translateY(-1.5px) rotate(-0.6deg); }
    75%      { transform: translateY(1px) rotate(0.4deg); }
  }
  .pelican-body { animation: bodyBob 0.8s ease-in-out infinite; transform-origin: 200px 220px; }

  /* 翅膀扇动 */
  @keyframes wingFlap {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(-22deg); }
  }
  .wing {
    animation: wingFlap 0.4s ease-in-out infinite;
    transform-origin: 195px 215px;
  }

  /* 脚蹬旋转 */
  @keyframes pedalSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .pedal-group {
    transform-origin: 200px 285px;
    animation: pedalSpin 0.8s linear infinite;
  }

  /* 嘴巴张合 */
  @keyframes beakOpen {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-3deg); }
  }
  .beak-lower {
    animation: beakOpen 0.8s ease-in-out infinite;
    transform-origin: 268px 198px;
  }

  /* 眼球左右看 */
  @keyframes eyeLook {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(1.5px); }
    75%      { transform: translateX(-1.5px); }
  }
  .eye-pupil { animation: eyeLook 2.5s ease-in-out infinite; }

  /* 远景丘陵缓慢平移 */
  @keyframes hillScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .hill-track {
    animation: hillScroll 30s linear infinite;
    width: 200%;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="title">鹈鹕骑行记</div>
  <div class="subtitle">Pelican on a Bicycle · 2D SVG Animation</div>

  <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">

    <!-- 远景丘陵 -->
    <g class="hill-track">
      <path d="M0,420 Q150,360 320,400 T640,400 T960,400 T1280,400 T1600,400 L1600,600 L0,600 Z"
            fill="#7ec8a8" opacity="0.7"/>
      <path d="M0,460 Q200,410 400,440 T800,440 T1200,440 T1600,440 L1600,600 L0,600 Z"
            fill="#5fb092" opacity="0.85"/>
    </g>
    <g class="hill-track" style="animation-duration:45s;">
      <path d="M0,470 Q120,440 260,460 T520,460 T780,460 T1040,460 T1300,460 T1600,460 L1600,600 L0,600 Z"
            fill="#4a9c7e" opacity="0.9"/>
    </g>

    <!-- 太阳 -->
    <g class="sun" transform="translate(680,110)">
      <circle r="42" fill="#ffe066"/>
      <circle r="42" fill="none" stroke="#ffb84d" stroke-width="3" opacity="0.5"/>
      <g stroke="#ffb84d" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-58" x2="0" y2="-70"/>
        <line x1="0" y1="58"  x2="0" y2="70"/>
        <line x1="-58" y1="0" x2="-70" y2="0"/>
        <line x1="58"  y1="0" x2="70"  y2="0"/>
        <line x1="-42" y1="-42" x2="-50" y2="-50"/>
        <line x1="42"  y1="-42" x2="50"  y2="-50"/>
        <line x1="-42" y1="42"  x2="-50" y2="50"/>
        <line x1="42"  y1="42"  x2="50"  y2="50"/>
      </g>
    </g>

    <!-- 云朵 1 -->
    <g class="cloud-1" transform="translate(0,90)">
      <ellipse cx="0"   cy="0" rx="28" ry="16" fill="white"/>
      <ellipse cx="25"  cy="-6" rx="22" ry="14" fill="white"/>
      <ellipse cx="50"  cy="0" rx="26" ry="15" fill="white"/>
      <ellipse cx="35"  cy="6" rx="30" ry="13" fill="white"/>
    </g>

    <!-- 云朵 2 -->
    <g class="cloud-2" transform="translate(0,150)">
      <ellipse cx="0"   cy="0" rx="20" ry="12" fill="white" opacity="0.95"/>
      <ellipse cx="20"  cy="-4" rx="16" ry="10" fill="white" opacity="0.95"/>
      <ellipse cx="38"  cy="0" rx="20" ry="12" fill="white" opacity="0.95"/>
    </g>

    <!-- 草地 -->
    <rect x="0" y="500" width="800" height="100" fill="#6bbf8a"/>
    <g class="grass">
      <path d="M50,500 Q52,488 54,500" stroke="#3f8a5c" stroke-width="2" fill="none"/>
      <path d="M120,500 Q123,485 126,500" stroke="#3f8a5c" stroke-width="2" fill="none"/>
      <path d="M210,500 Q212,490 214,500" stroke="#3f8a5c" stroke-width="2" fill="none"/>
      <path d="M310,500 Q313,485 316,500" stroke="#3f8a5c" stroke-width="2" fill="none"/>
      <path d="M430,500 Q432,490 434,500" stroke="#3f8a5c" stroke-width="2" fill="none"/>
      <path d="M540,500 Q543,486 546,500" stroke="#3f8a5c" stroke-width="2" fill="none"/>
      <path d="M640,500 Q643,489 646,500" stroke="#3f8a5c" stroke-width="2" fill="none"/>
      <path d="M740,500 Q743,486 746,500" stroke="#3f8a5c" stroke-width="2" fill="none"/>
    </g>

    <!-- 道路 -->
    <rect x="0" y="510" width="800" height="60" fill="#555"/>
    <rect x="0" y="510" width="800" height="6"  fill="#777"/>
    <rect x="0" y="564" width="800" height="6"  fill="#777"/>

    <!-- 道路虚线（循环平移） -->
    <g class="road-lines">
      <g fill="#ffd84d">
        <rect x="0"   y="538" width="50" height="6" rx="2"/>
        <rect x="120" y="538" width="50" height="6" rx="2"/>
        <rect x="240" y="538" width="50" height="6" rx="2"/>
        <rect x="360" y="538" width="50" height="6" rx="2"/>
        <rect x="480" y="538" width="50" height="6" rx="2"/>
        <rect x="600" y="538" width="50" height="6" rx="2"/>
        <rect x="720" y="538" width="50" height="6" rx="2"/>
        <rect x="840" y="538" width="50" height="6" rx="2"/>
        <rect x="960" y="538" width="50" height="6" rx="2"/>
      </g>
    </g>

    <!-- 鹈鹕 + 自行车 -->
    <g class="bike-rider">
      <g transform="translate(0,0)">

        <!-- 后轮 -->
        <g class="wheel-rear" transform="translate(140,360)">
          <circle r="38" fill="none" stroke="#222" stroke-width="5"/>
          <circle r="34" fill="none" stroke="#444" stroke-width="1.5"/>
          <g stroke="#666" stroke-width="2">
            <line x1="0"   y1="-34" x2="0"   y2="34"/>
            <line x1="-34" y1="0"   x2="34"  y2="0"/>
            <line x1="-24" y1="-24" x2="24"  y2="24"/>
            <line x1="-24" y1="24"  x2="24"  y2="-24"/>
          </g>
          <circle r="5" fill="#222"/>
        </g>

        <!-- 前轮 -->
        <g class="wheel-front" transform="translate(330,360)">
          <circle r="38" fill="none" stroke="#222" stroke-width="5"/>
          <circle r="34" fill="none" stroke="#444" stroke-width="1.5"/>
          <g stroke="#666" stroke-width="2">
            <line x1="0"   y1="-34" x2="0"   y2="34"/>
            <line x1="-34" y1="0"   x2="34"  y2="0"/>
            <line x1="-24" y1="-24" x2="24"  y2="24"/>
            <line x1="-24" y1="24"  x2="24"  y2="-24"/>
          </g>
          <circle r="5" fill="#222"/>
        </g>

        <!-- 车架 -->
        <g stroke="#c0392b" stroke-width="7" stroke-linecap="round" fill="none">
          <line x1="140" y1="360" x2="220" y2="290"/>
          <line x1="220" y1="290" x2="330" y2="360"/>
          <line x1="220" y1="290" x2="200" y2="285"/>
          <line x1="330" y1="360" x2="280" y2="240"/>
          <line x1="200" y1="285" x2="280" y2="240"/>
        </g>

        <!-- 脚蹬曲柄 -->
        <g class="pedal-group">
          <circle cx="220" cy="290" r="7" fill="#333"/>
          <rect x="217" y="282" width="6" height="22" fill="#333" rx="2"/>
          <rect x="217" y="296" width="6" height="22" fill="#333" rx="2" opacity="0.9"/>
          <rect x="210" y="277" width="20" height="6" fill="#222" rx="2"/>
          <rect x="210" y="307" width="20" height="6" fill="#222" rx="2"/>
        </g>

        <!-- 座椅 -->
        <ellipse cx="200" cy="280" rx="14" ry="5" fill="#222"/>
        <path d="M188,279 Q200,272 212,279" stroke="#222" stroke-width="3" fill="none"/>

        <!-- 车把 -->
        <line x1="280" y1="240" x2="280" y2="218" stroke="#444" stroke-width="5" stroke-linecap="round"/>
        <line x1="265" y1="218" x2="300" y2="218" stroke="#444" stroke-width="6" stroke-linecap="round"/>
        <circle cx="265" cy="218" r="4" fill="#222"/>
        <circle cx="300" cy="218" r="4" fill="#222"/>

        <!-- 鹈鹕身体 -->
        <g class="pelican-body">
          <!-- 尾巴 -->
          <path d="M155,255 Q140,245 138,260 Q145,265 160,262 Z" fill="#e8e8e8"/>
          <!-- 腹部 + 身体 -->
          <ellipse cx="200" cy="245" rx="50" ry="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <!-- 翅膀 -->
          <g class="wing">
            <path d="M170,225 Q190,210 215,225 Q210,250 180,255 Q160,250 170,225 Z"
                  fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
            <path d="M180,230 Q195,222 210,232" stroke="#cbd5e1" stroke-width="1" fill="none"/>
            <path d="M178,238 Q195,232 212,240" stroke="#cbd5e1" stroke-width="1" fill="none"/>
          </g>
          <!-- 脖子 -->
          <path d="M225,235 Q235,205 250,195 Q258,205 252,235 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <!-- 头 -->
          <ellipse cx="252" cy="192" rx="22" ry="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <!-- 头顶小撮毛 -->
          <path d="M250,174 Q254,166 258,175 Q256,180 252,178 Z" fill="#cbd5e1"/>

          <!-- 上喙 -->
          <path d="M268,192 Q305,186 320,200 Q310,205 268,200 Z"
                fill="#f5b942" stroke="#d49020" stroke-width="1.5"/>
          <!-- 下喙（含喉囊） -->
          <g class="beak-lower">
            <path d="M268,200 Q295,215 318,206 Q305,225 270,210 Z"
                  fill="#facc6b" stroke="#d49020" stroke-width="1.5"/>
            <path d="M275,205 Q290,213 312,205" stroke="#d49020" stroke-width="1" fill="none" opacity="0.6"/>
          </g>
          <!-- 喙尖小钩 -->
          <path d="M318,201 Q324,202 320,206" stroke="#d49020" stroke-width="2" fill="none" stroke-linecap="round"/>

          <!-- 眼睛 -->
          <circle cx="258" cy="188" r="5" fill="white" stroke="#cbd5e1" stroke-width="1"/>
          <g class="eye-pupil">
            <circle cx="259" cy="189" r="2.5" fill="#1f2937"/>
            <circle cx="260" cy="188" r="0.8" fill="white"/>
          </g>

          <!-- 腮红 -->
          <ellipse cx="248" cy="200" rx="3" ry="1.5" fill="#fca5a5" opacity="0.5"/>

          <!-- 抓车把的"翅膀"（小手） -->
          <ellipse cx="280" cy="222" rx="6" ry="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" transform="rotate(20 280 222)"/>
        </g>

        <!-- 脚蹼踩踏板 -->
        <g>
          <ellipse cx="223" cy="295" rx="6" ry="4" fill="#f5b942" stroke="#d49020" stroke-width="1"/>
          <ellipse cx="217" cy="313" rx="6" ry="4" fill="#f5b942" stroke="#d49020" stroke-width="1"/>
        </g>

        <!-- 速度线 -->
        <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7">
          <line x1="80"  y1="270" x2="110" y2="270"/>
          <line x1="70"  y1="290" x2="105" y2="290"/>
          <line x1="85"  y1="310" x2="115" y2="310"/>
        </g>

      </g>
    </g>

    <!-- 地面装饰小花 -->
    <g>
      <circle cx="60"  cy="555" r="3" fill="#ff6b9d"/>
      <circle cx="58"  cy="553" r="1.5" fill="#ffd1dc"/>
      <circle cx="62"  cy="557" r="1.5" fill="#ffd1dc"/>

      <circle cx="260" cy="560" r="3" fill="#fff"/>
      <circle cx="258" cy="558" r="1.5" fill="#ffd1dc"/>

      <circle cx="450" cy="552" r="3" fill="#c084fc"/>
      <circle cx="448" cy="550" r="1.5" fill="#fff"/>

      <circle cx="660" cy="558" r="3" fill="#fbbf24"/>
      <circle cx="658" cy="556" r="1.5" fill="#fff"/>
    </g>

  </svg>
</div>
</body>
</html>
